<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServerEyes — NOC Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f0f2f5;color:#333;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;}

/* ── LOGIN ── */
.login-screen{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);}
.login-card{background:#fff;border-radius:20px;padding:48px 40px;width:380px;max-width:92vw;box-shadow:0 24px 64px rgba(0,0,0,0.4);}
.login-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;}
.login-logo .eye-icon{font-size:36px;}
.login-logo h1{font-size:26px;font-weight:800;color:#1a1a2e;}
.login-sub{text-align:center;color:#999;font-size:13px;margin-bottom:32px;}
.login-card input{width:100%;border:2px solid #e8e8e8;border-radius:10px;padding:12px 14px;font-size:15px;color:#333;outline:none;margin-bottom:12px;transition:border-color .2s;}
.login-card input:focus{border-color:#2196F3;}
.login-btn{width:100%;background:#2196F3;color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .2s;}
.login-btn:hover{background:#1976D2;}
.login-err{color:#F44336;text-align:center;font-size:13px;margin-top:8px;}

/* ── LAYOUT ── */
.app-layout{display:flex;flex-direction:column;min-height:100vh;padding-bottom:64px;}

/* ── HEADER ── */
.noc-header{background:#fff;padding:0 20px;height:60px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);position:sticky;top:0;z-index:100;}
.hamburger{background:none;border:none;cursor:pointer;padding:8px;border-radius:8px;color:#666;font-size:20px;line-height:1;}
.hamburger:hover{background:#f0f2f5;}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;}
.brand .eye{font-size:22px;}
.brand .name{font-size:18px;font-weight:800;color:#1a1a2e;}
.noc-badge{background:#2196F3;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.5px;}
.header-search{flex:1;max-width:400px;position:relative;}
.header-search input{width:100%;border:2px solid #e8e8e8;border-radius:10px;padding:8px 14px 8px 36px;font-size:14px;color:#333;outline:none;transition:border-color .2s;background:#f8f9fa;}
.header-search input:focus{border-color:#2196F3;background:#fff;}
.header-search .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#999;font-size:14px;}
.header-spacer{flex:1;}
.header-actions{display:flex;align-items:center;gap:6px;}
.icon-btn{background:none;border:none;cursor:pointer;padding:8px;border-radius:8px;color:#666;font-size:18px;position:relative;transition:background .2s;}
.icon-btn:hover{background:#f0f2f5;color:#333;}
.badge-dot{position:absolute;top:4px;right:4px;width:16px;height:16px;background:#F44336;color:#fff;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.avatar{width:34px;height:34px;border-radius:50%;background:#2196F3;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;}

/* ── MAIN CONTENT ── */
.noc-main{flex:1;padding:20px;display:grid;gap:16px;}

/* ── STATS ROW ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.stat-card{background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 2px 8px rgba(0,0,0,0.06);display:flex;align-items:center;gap:14px;}
.stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.stat-icon.blue{background:#E3F2FD;}
.stat-icon.green{background:#E8F5E9;}
.stat-icon.red{background:#FFEBEE;}
.stat-icon.orange{background:#FFF3E0;}
.stat-info{flex:1;}
.stat-num{font-size:28px;font-weight:800;line-height:1;}
.stat-num.blue{color:#2196F3;}
.stat-num.green{color:#4CAF50;}
.stat-num.red{color:#F44336;}
.stat-num.orange{color:#FF9800;}
.stat-label{font-size:12px;color:#999;margin-top:2px;}
.sparkline{width:60px;height:30px;}

/* ── GRID SECTIONS ── */
.noc-grid-top{display:grid;grid-template-columns:200px 1fr 280px;gap:16px;align-items:start;}
.noc-grid-mid{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start;}

/* ── PANEL CARD ── */
.panel{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.panel-title{font-size:13px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.panel-title .dot{width:8px;height:8px;border-radius:50%;}

/* ── DONUT SALUD ── */
.donut-wrap{display:flex;flex-direction:column;align-items:center;}
.donut-svg{width:120px;height:120px;}
.donut-pct{font-size:22px;font-weight:800;text-anchor:middle;dominant-baseline:middle;}
.donut-sub{font-size:13px;color:#999;margin-top:6px;text-align:center;}

/* ── MAP ── */
.map-panel{min-height:280px;position:relative;}
#nocMap{width:100%;height:260px;border-radius:10px;overflow:hidden;}

/* ── ALERTAS SIDE ── */
.alert-list{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;}
.alert-item{background:#FFF3F3;border-left:3px solid #F44336;border-radius:0 8px 8px 0;padding:8px 12px;}
.alert-item .alert-name{font-size:13px;font-weight:700;color:#333;}
.alert-item .alert-time{font-size:11px;color:#999;margin-top:2px;}
.alert-item .alert-ip{font-size:11px;color:#F44336;font-weight:600;}
.no-alerts{text-align:center;padding:24px 0;color:#ccc;font-size:13px;}

/* ── RECURSOS GLOBALES ── */
.recursos-wrap{display:flex;align-items:center;gap:16px;}
.recursos-list{flex:1;display:flex;flex-direction:column;gap:8px;}
.rec-row{display:flex;align-items:center;gap:8px;}
.rec-label{font-size:12px;color:#666;width:50px;}
.rec-bar-bg{flex:1;height:6px;background:#f0f2f5;border-radius:3px;overflow:hidden;}
.rec-bar-fg{height:100%;border-radius:3px;transition:width .4s;}
.rec-pct{font-size:12px;font-weight:700;width:34px;text-align:right;}

/* ── SERVER TABLE ── */
.server-table{width:100%;border-collapse:collapse;}
.server-table th{font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.4px;padding:8px 12px;text-align:left;border-bottom:2px solid #f0f2f5;}
.server-table td{padding:10px 12px;border-bottom:1px solid #f8f9fa;vertical-align:middle;}
.server-table tr:hover td{background:#f8f9fa;cursor:pointer;}
.server-table tr:last-child td{border-bottom:none;}
.status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}
.status-dot.on{background:#4CAF50;box-shadow:0 0 6px rgba(76,175,80,.5);}
.status-dot.off{background:#F44336;}
.srv-name{font-size:14px;font-weight:700;color:#333;}
.srv-meta{font-size:11px;color:#999;margin-top:1px;}
.srv-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.srv-badge.on{background:#E8F5E9;color:#4CAF50;}
.srv-badge.off{background:#FFEBEE;color:#F44336;}
.mini-bar{width:60px;height:6px;background:#f0f2f5;border-radius:3px;overflow:hidden;margin-top:2px;}
.mini-bar-fg{height:100%;border-radius:3px;}
.val-num{font-size:13px;font-weight:700;}
.val-num.ok{color:#4CAF50;}
.val-num.warn{color:#FF9800;}
.val-num.crit{color:#F44336;}

/* ── ACCIONES RAPIDAS ── */
.actions-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.action-btn{background:#f8f9fa;border:2px solid #f0f2f5;border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .2s;font-size:11px;font-weight:700;color:#666;}
.action-btn:hover{background:#E3F2FD;border-color:#2196F3;color:#2196F3;}
.action-btn .ab-icon{font-size:22px;}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #f0f2f5;display:flex;height:64px;z-index:99;box-shadow:0 -4px 16px rgba(0,0,0,0.06);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:#999;font-size:10px;font-weight:700;transition:color .2s;position:relative;border:none;background:none;}
.nav-item:hover,.nav-item.active{color:#2196F3;}
.nav-item .nav-icon{font-size:20px;}
.nav-badge{position:absolute;top:8px;right:calc(50% - 18px);background:#F44336;color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700;}

/* ── MODALS ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;z-index:500;overflow-y:auto;}
.modal-box{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:560px;margin:auto;box-shadow:0 24px 64px rgba(0,0,0,.2);}
.modal-box.wide{max-width:720px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-header h2{font-size:18px;font-weight:800;color:#1a1a2e;}
.modal-close{background:#f0f2f5;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;color:#666;font-size:13px;font-weight:600;}
.modal-close:hover{background:#e0e0e0;color:#333;}
.modal-label{font-size:12px;color:#999;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:14px;margin-bottom:4px;display:block;}
.modal-input{width:100%;border:2px solid #e8e8e8;border-radius:10px;padding:10px 14px;font-size:14px;color:#333;outline:none;transition:border-color .2s;}
.modal-input:focus{border-color:#2196F3;}
.modal-textarea{width:100%;border:2px solid #e8e8e8;border-radius:10px;padding:10px 14px;font-size:14px;color:#333;outline:none;resize:vertical;min-height:70px;}
.modal-textarea:focus{border-color:#2196F3;}
.modal-btn{width:100%;background:#2196F3;color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px;transition:background .2s;}
.modal-btn:hover{background:#1976D2;}
.modal-btn.danger{background:#F44336;}
.modal-btn.danger:hover{background:#D32F2F;}
.modal-btn.ghost{background:#f0f2f5;color:#666;margin-top:8px;}
.modal-btn.ghost:hover{background:#e0e0e0;}
.modal-btn.sm{width:auto;padding:8px 18px;font-size:13px;margin-top:0;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.chip{background:#E3F2FD;color:#2196F3;border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;}
.chip:hover{background:#BBDEFB;}
.day-tabs{display:flex;gap:8px;margin-bottom:16px;}
.day-tab{background:#f0f2f5;color:#666;border:none;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;}
.day-tab.active{background:#2196F3;color:#fff;}

/* uptime bars */
.uptime-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.uptime-day{font-size:11px;color:#999;width:80px;flex-shrink:0;}
.uptime-bg{flex:1;height:16px;background:#f0f2f5;border-radius:4px;overflow:hidden;}
.uptime-fg{height:100%;border-radius:4px;}
.uptime-pct{font-size:12px;font-weight:700;width:36px;text-align:right;flex-shrink:0;}
.uptime-avg{text-align:center;margin-bottom:20px;}
.uptime-avg .big{font-size:48px;font-weight:800;line-height:1;}

/* ip history */
.ip-entry{background:#f8f9fa;border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
.ip-entry .ip-date{color:#999;font-size:11px;width:130px;}
.ip-old{color:#FF9800;font-weight:700;font-size:13px;}
.ip-arrow{color:#ccc;}
.ip-new{color:#4CAF50;font-weight:700;font-size:13px;}

/* metrics mini chart */
.mini-chart{display:flex;align-items:flex-end;height:60px;gap:1px;background:#f8f9fa;border-radius:8px;padding:4px;overflow:hidden;}
.mini-bar-chart{border-radius:1px;transition:height .3s;}

/* logs */
.log-pre{background:#1a1a2e;color:#aaa;border-radius:10px;padding:14px;font-size:11px;font-family:monospace;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto;line-height:1.7;}

/* cmd */
.cmd-entry{background:#f8f9fa;border-radius:10px;padding:12px;margin-bottom:8px;border-left:3px solid #ccc;}
.cmd-entry.done{border-left-color:#4CAF50;}
.cmd-entry.pending{border-left-color:#FF9800;}
.cmd-code{font-family:monospace;color:#2196F3;font-size:13px;}
.cmd-output{background:#1a1a2e;color:#aaa;border-radius:6px;padding:8px;font-size:11px;font-family:monospace;white-space:pre-wrap;max-height:180px;overflow-y:auto;margin-top:6px;}
.cmd-meta{font-size:10px;color:#999;margin-top:4px;}

/* disk detail */
.disk-card{background:#f8f9fa;border-radius:10px;padding:14px;margin-bottom:10px;}
.disk-card-header{display:flex;align-items:center;margin-bottom:8px;}
.disk-drive-name{flex:1;font-size:16px;font-weight:800;}
.disk-pct-big{font-size:20px;font-weight:800;}
.disk-stat-row{display:flex;justify-content:space-between;font-size:12px;color:#999;margin-bottom:2px;}
.disk-stat-val{color:#333;font-weight:600;}
.disk-bar{height:8px;background:#e8e8e8;border-radius:4px;overflow:hidden;margin:6px 0 10px;}
.disk-bar-fg{height:100%;border-radius:4px;}
.disk-controls{display:flex;align-items:center;gap:10px;padding-top:8px;border-top:1px solid #e8e8e8;}

/* checkbox */
.checkbox-row{display:flex;align-items:center;gap:8px;cursor:pointer;}
.checkbox-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;}

/* update banner */
.update-banner{background:#FFF8E1;border:1px solid #FF9800;border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.update-banner .ub-msg{color:#E65100;font-weight:700;font-size:13px;}
.update-banner .ub-sub{color:#999;font-size:11px;font-weight:400;margin-top:2px;}
.ub-dismiss{background:none;border:none;color:#999;cursor:pointer;font-size:18px;padding:2px 6px;}

/* pulse animation */
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.pulse{animation:pulse 2s infinite;}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:#f0f2f5;}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px;}

/* responsive */
@media(max-width:1100px){
  .noc-grid-top{grid-template-columns:180px 1fr 240px;}
}
@media(max-width:880px){
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .noc-grid-top{grid-template-columns:1fr 1fr;}
  .noc-grid-mid{grid-template-columns:1fr;}
  .actions-grid{grid-template-columns:repeat(3,1fr);}
}
@media(max-width:600px){
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .noc-grid-top{grid-template-columns:1fr;}
  .actions-grid{grid-template-columns:repeat(3,1fr);}
  .noc-main{padding:12px;}
  .header-search{max-width:160px;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ── STATE ──
const API = window.location.origin;
let token = localStorage.getItem('se_token');
let machines = [];
let agentInfo = { version: null, url: null };
let filter = '';
let statusFilter = 'all';
let activeModal = null;
let uptimeDays = 7;
let metricsHours = 24;
let refreshInterval = null;
let dismissedUpdate = false;
let activeNav = 'noc';

// ── API ──
async function api(path, opts={}) {
  const headers = {'Content-Type':'application/json',...opts.headers};
  if (token) headers.Authorization = 'Bearer ' + token;
  try {
    const r = await fetch(API + path, {...opts, headers});
    const d = await r.json();
    return {ok: r.ok, status: r.status, data: d};
  } catch(e) {
    return {ok:false, status:0, data:{error:e.message}};
  }
}

// ── UTILS ──
function timeSince(ts) {
  if (!ts) return 'Nunca';
  const s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s/60) + 'min';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  return Math.floor(s/86400) + 'd';
}

function colorPct(pct, warn=70, crit=90) {
  if (pct >= crit) return '#F44336';
  if (pct >= warn) return '#FF9800';
  return '#4CAF50';
}

function classPct(pct, warn=70, crit=90) {
  if (pct >= crit) return 'crit';
  if (pct >= warn) return 'warn';
  return 'ok';
}

function avgArr(arr) {
  if (!arr || arr.length === 0) return 0;
  return arr.reduce((a,b)=>a+b,0)/arr.length;
}

function getFiltered() {
  let list = machines;
  if (statusFilter === 'online') list = list.filter(m=>m.is_online);
  if (statusFilter === 'offline') list = list.filter(m=>!m.is_online);
  if (filter) {
    const f = filter.toLowerCase();
    list = list.filter(m =>
      (m.machine_name||'').toLowerCase().includes(f) ||
      (m.public_ip||'').includes(f) ||
      (m.local_ip||'').toLowerCase().includes(f) ||
      (m.grupo||'').toLowerCase().includes(f) ||
      (m.notes||'').toLowerCase().includes(f)
    );
  }
  return list;
}

// ── LOGIN ──
function renderLogin(err) {
  document.getElementById('app').innerHTML = `
  <div class="login-screen">
    <div class="login-card">
      <div class="login-logo"><span class="eye-icon">👁️</span><h1>ServerEyes</h1></div>
      <p class="login-sub">NOC Dashboard · Monitoreo en tiempo real</p>
      <input type="email" id="le" placeholder="Email" autocomplete="username"/>
      <input type="password" id="lp" placeholder="Contraseña" autocomplete="current-password"/>
      ${err?`<p class="login-err">${err}</p>`:''}
      <button class="login-btn" onclick="doLogin()">Iniciar sesión</button>
    </div>
  </div>`;
  const le = document.getElementById('le');
  const lp = document.getElementById('lp');
  le.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  lp.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

async function doLogin() {
  const email = document.getElementById('le').value.trim();
  const pass  = document.getElementById('lp').value;
  if (!email||!pass) { renderLogin('Completá todos los campos'); return; }
  const r = await api('/api/auth/login', {method:'POST', body:JSON.stringify({email, password:pass})});
  if (r.ok && r.data.token) {
    token = r.data.token;
    localStorage.setItem('se_token', token);
    startDashboard();
  } else {
    renderLogin(r.data?.error || 'Error de autenticación');
  }
}

function logout() {
  token = null;
  localStorage.removeItem('se_token');
  if (refreshInterval) clearInterval(refreshInterval);
  renderLogin();
}

// ── RENDER MAIN ──
function render() {
  const el = document.getElementById('app');
  if (!token) { renderLogin(); return; }
  el.innerHTML = buildLayout();
  attachEvents();
  // init map after DOM
  if (activeNav === 'noc') {
    setTimeout(initInlineMap, 120);
  }
}

function buildLayout() {
  const filtered = getFiltered();
  const online  = machines.filter(m=>m.is_online).length;
  const offline = machines.length - online;
  const healthPct = machines.length > 0 ? Math.round((online/machines.length)*100) : 0;
  const alerts = machines.filter(m=>!m.is_online);
  const offlineBadge = alerts.length > 0 ? alerts.length : '';

  // avg resources
  const cpus  = machines.filter(m=>m.cpu_usage!=null).map(m=>m.cpu_usage);
  const rams  = machines.filter(m=>m.ram_usage!=null&&m.ram_total).map(m=>Math.round(m.ram_usage/m.ram_total*100));
  const pings = machines.filter(m=>m.ping_ms!=null&&m.is_online).map(m=>m.ping_ms);
  const disks = machines.filter(m=>m.disk_usage!=null&&m.disk_total).map(m=>Math.round(m.disk_usage/m.disk_total*100));
  const avgCpu  = Math.round(avgArr(cpus));
  const avgRam  = Math.round(avgArr(rams));
  const avgDisk = Math.round(avgArr(disks));
  const avgPing = Math.round(avgArr(pings));

  const updateOutdated = machines.filter(m=>m.agent_version&&agentInfo.version&&m.agent_version!==agentInfo.version);

  let updateBanner = '';
  if (!dismissedUpdate && updateOutdated.length>0) {
    updateBanner = `<div class="update-banner">
      <div><div class="ub-msg">⚠️ ${updateOutdated.length} agente(s) desactualizado(s)</div>
      <div class="ub-sub">${updateOutdated.map(m=>m.machine_name+' (v'+m.agent_version+')').join(', ')} — última: v${agentInfo.version}</div></div>
      <button class="ub-dismiss" onclick="dismissedUpdate=true;render()">✕</button>
    </div>`;
  }

  return `
  <div class="app-layout">
    ${buildHeader()}
    <div class="noc-main">
      ${updateBanner}
      ${buildStatsRow(online, offline, alerts.length)}

      ${activeNav==='reportes' ? buildReportesView() : ''}
      ${activeNav==='ajustes' ? buildAjustesView() : ''}

    ${activeModal ? buildModal() : ''}
  </div>`;
}

function buildHeader() {

function buildStatsRow(online, offline, alertCount) {
  function sparkSVG(values, color) {
    if (!values||values.length<2) return '';
    const max=Math.max(...values,1), w=60, h=30;
    const pts = values.map((v,i)=>`${Math.round(i/(values.length-1)*w)},${Math.round(h - (v/max)*h)}`).join(' ');
    return `<svg class="sparkline" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/></svg>`;
  }
  const cpuHist = machines.filter(m=>m.cpu_usage!=null).map(m=>m.cpu_usage);
  return `<div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon blue">🖥️</div>
      <div class="stat-info"><div class="stat-num blue">${machines.length}</div><div class="stat-label">Total Servidores</div></div>
      ${sparkSVG(machines.map((_,i)=>i+1).slice(-8),'#2196F3')}
    </div>
    <div class="stat-card">
      <div class="stat-icon green">✅</div>
      <div class="stat-info"><div class="stat-num green">${online}</div><div class="stat-label">Online</div></div>
      ${sparkSVG(cpuHist.slice(-8),'#4CAF50')}
    </div>
    <div class="stat-card">
      <div class="stat-icon red">❌</div>
      <div class="stat-info"><div class="stat-num red">${offline}</div><div class="stat-label">Offline</div></div>
      ${sparkSVG([0,0,offline,offline,offline].slice(-8),'#F44336')}
    </div>
    <div class="stat-card">
      <div class="stat-icon orange">⚠️</div>
      <div class="stat-info"><div class="stat-num orange">${alertCount}</div><div class="stat-label">Alertas</div></div>
      ${sparkSVG([0,alertCount],'#FF9800')}
    </div>
  </div>`;
}

      <div class="panel-title"><span class="dot" style="background:#4CAF50"></span>Estado General</div>

          <circle cx="50" cy="50" r="44" fill="none" stroke="#f0f2f5" stroke-width="10"/>
          <circle cx="50" cy="50" r="44" fill="none" stroke="${hColor}" stroke-width="10"
            stroke-dasharray="${circ}" stroke-dashoffset="${dash}"

// ── INLINE MAP ──
let nocMapInstance = null;

function initInlineMap() {
  const el = document.getElementById('nocMap');
  if (!el) return;
  const pts = machines.filter(m=>m.geo_lat&&m.geo_lon).map(m=>({
    lat:parseFloat(m.geo_lat), lon:parseFloat(m.geo_lon),
    name:m.machine_name, online:m.is_online, ip:m.public_ip
  }));
  if (pts.length===0) {
    el.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:13px;background:#f8f9fa;border-radius:10px">Sin datos de geolocalización</div>';
    return;
  }
  loadLeaflet(()=>{
    if (nocMapInstance) { nocMapInstance.remove(); nocMapInstance=null; }
    const center = [pts.reduce((a,p)=>a+p.lat,0)/pts.length, pts.reduce((a,p)=>a+p.lon,0)/pts.length];
    nocMapInstance = L.map(el, {zoomControl:true}).setView(center, 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(nocMapInstance);
    pts.forEach(p=>{
      const c = p.online?'#4CAF50':'#F44336';
      L.circleMarker([p.lat,p.lon],{radius:9,color:c,fillColor:c,fillOpacity:.85,weight:2})
        .bindPopup(`<strong>${p.name}</strong><br>${p.online?'🟢 Online':'🔴 Offline'}<br><small>${p.ip||''}</small>`)
        .addTo(nocMapInstance);
    });
    if (pts.length>1) nocMapInstance.fitBounds(pts.map(p=>[p.lat,p.lon]),{padding:[20,20]});
  });
}

function loadLeaflet(cb) {
  if (window.L) { cb(); return; }
  if (!document.getElementById('lf-css')) {
    const css = document.createElement('link');
    css.id='lf-css'; css.rel='stylesheet';
    css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
  }
  if (!document.getElementById('lf-js')) {
    const js = document.createElement('script');
    js.id='lf-js'; js.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.onload=cb; document.head.appendChild(js);
  } else {
    setTimeout(()=>{ if(window.L) cb(); else loadLeaflet(cb); }, 100);
  }
}

    case 'metrics':  return buildMetricsModal();

    case 'agent':    return buildAgentModal();

function buildDetailModal() {
  const m = machines.find(x=>x.id===activeModal.machineId);
  if (!m) return '';
  const cpu=m.cpu_usage!=null?m.cpu_usage:null;
  const ramPct=m.ram_usage&&m.ram_total?Math.round(m.ram_usage/m.ram_total*100):null;

  let diskHtml='';
  if (m.disks&&m.disks.length>0) {
    diskHtml = m.disks.map(d=>{
      const pct=d.total>0?Math.round(d.used/d.total*100):0;
      return `<div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span style="color:#666">${d.drive}</span>
          <span style="font-weight:700;color:${colorPct(pct,80,92)}">${d.used}/${d.total} GB (${pct}%)</span>
        </div>
        <div style="height:5px;background:#f0f2f5;border-radius:3px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${colorPct(pct,80,92)};border-radius:3px"></div>
        </div>
      </div>`;
    }).join('');
  } else if (m.disk_usage&&m.disk_total) {
    const pct=Math.round(m.disk_usage/m.disk_total*100);
    diskHtml=`<div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">

function openUptime(id) {
  uptimeDays=7;
  activeModal={type:'uptime',machineId:id,data:null};
  render();
  loadUptime(id,7);
}
async function loadUptime(id,days) {
  const r = await api('/api/machines/'+id+'/uptime?days='+days);

}
function buildUptimeModal() {
  const m=machines.find(x=>x.id===activeModal.machineId);
  const data=activeModal.data||[];
  const avg=data.length>0?Math.round(data.reduce((a,d)=>a+d.percentage,0)/data.length):0;
  const hColor=avg>=95?'#4CAF50':avg>=80?'#FF9800':'#F44336';
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-header"><h2>📊 Uptime — ${m?.machine_name||''}</h2><button class="modal-close" onclick="closeModal()">Cerrar</button></div>
    <div class="day-tabs">
      ${[7,14,30].map(d=>`<button class="day-tab ${uptimeDays===d?'active':''}" onclick="uptimeDays=${d};loadUptime(${activeModal.machineId},${d})">${d} días</button>`).join('')}
    </div>
    ${!activeModal.data?'<p style="color:#999;text-align:center;padding:20px">Cargando...</p>':`
    <div class="uptime-avg"><div class="big" style="color:${hColor}">${avg}%</div><div style="color:#999;font-size:13px">Promedio últimos ${uptimeDays} días</div></div>
    ${data.map(day=>{
      const c=day.percentage>=95?'#4CAF50':day.percentage>=80?'#FF9800':'#F44336';
      const dateStr=new Date(day.date+'T12:00:00').toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'});
      return `<div class="uptime-row">
        <span class="uptime-day">${dateStr}</span>
        <div class="uptime-bg"><div class="uptime-fg" style="width:${day.percentage}%;background:${c}"></div></div>

}

// ── DISK MODAL ──
function openDiskModal(id) {
  const m=machines.find(x=>x.id===id);
  if(!m)return;
  activeModal={type:'disks',machineId:id,monitored:[...(m.monitored_disks||[])],alertDisks:{...(m.alert_disks||{})}};
  render();
}
function buildDiskModal() {
  const m=machines.find(x=>x.id===activeModal.machineId);
  const allDisks=(m?.disks&&Array.isArray(m.disks))?m.disks:[];
  const mon=activeModal.monitored||[];
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-header"><h2>💾 Discos — ${m?.machine_name||''}</h2><button class="modal-close" onclick="closeModal()">Cerrar</button></div>
    <p style="font-size:13px;color:#999;margin-bottom:14px">Seleccioná los discos a mostrar en el resumen. Sin selección: se muestran todos.</p>
    ${allDisks.length===0?'<p style="color:#ccc;text-align:center;padding:20px">Sin datos de disco.</p>':allDisks.map(disk=>{
      const pct=disk.total>0?Math.round(disk.used/disk.total*100):0;
      const c=colorPct(pct,80,92);
      const checked=mon.includes(disk.drive);
      return `<div class="disk-card">
        <div class="disk-card-header">
          <span class="disk-drive-name">Disco ${disk.drive}</span>
          <span class="disk-pct-big" style="color:${c}">${pct}%</span>
        </div>
        <div class="disk-bar"><div class="disk-bar-fg" style="width:${pct}%;background:${c}"></div></div>
        <div class="disk-stat-row"><span>Usado</span><span class="disk-stat-val">${disk.used} GB</span></div>
        <div class="disk-stat-row"><span>Libre</span><span class="disk-stat-val" style="color:#4CAF50">${disk.free} GB</span></div>
        <div class="disk-stat-row"><span>Total</span><span class="disk-stat-val">${disk.total} GB</span></div>
        <div class="disk-controls">
          <label class="checkbox-row" style="flex:1">
            <input type="checkbox" ${checked?'checked':''} onchange="toggleDisk('${disk.drive}')"/>
            <span style="font-size:12px;color:#666">Mostrar en resumen</span>
          </label>
          <span style="font-size:11px;color:#FF9800;margin-right:6px">Alerta %:</span>
          <input type="number" value="${activeModal.alertDisks[disk.drive]||''}" onchange="activeModal.alertDisks['${disk.drive}']=this.value?parseInt(this.value):0" placeholder="—" style="width:50px;border:1px solid #e0e0e0;border-radius:6px;padding:4px;font-size:13px;text-align:center"/>
        </div>
      </div>`;
    }).join('')}
    <button class="modal-btn" onclick="saveDisk()">Guardar</button>
    <button class="modal-btn ghost" onclick="closeModal()">Cancelar</button>
  </div></div>`;
}
function toggleDisk(drive) {
  const idx=activeModal.monitored.indexOf(drive);
  if(idx>=0) activeModal.monitored.splice(idx,1); else activeModal.monitored.push(drive);
  render();
}
async function saveDisk() {
  const ca={};
  for(const[k,v]of Object.entries(activeModal.alertDisks||{})){if(v>0)ca[k]=v;}
  const r=await api('/api/machines/'+activeModal.machineId,{method:'PUT',body:JSON.stringify({monitored_disks:activeModal.monitored,alert_disks:ca})});
  if(r.ok){closeModal();loadMachines();}
  else alert(r.data?.error||'Error');
}

// ── METRICS MODAL ──
function openMetrics(id) {
  metricsHours=24;
  activeModal={type:'metrics',machineId:id,data:null};
  render();
  loadMetrics(id,24);
}
async function loadMetrics(id,hours) {
  const r=await api('/api/machines/'+id+'/metrics?hours='+hours);
  if(r.ok){activeModal.data=r.data;render();}
}
function buildMetricsModal() {
  const m=machines.find(x=>x.id===activeModal.machineId);
  const data=activeModal.data||[];
  function miniChart(vals,color,maxV) {
    if(!vals||vals.length===0) return '<span style="color:#ccc;font-size:12px">Sin datos</span>';
    const mx=maxV||Math.max(...vals,1);
    const w=Math.max(2,Math.floor(500/vals.length));
    return `<div class="mini-chart">${vals.map(v=>{
      const h=Math.max(2,(v/mx)*52);
      const c=v/mx>.9?'#F44336':v/mx>.7?'#FF9800':color;
      return `<div class="mini-bar-chart" style="width:${w}px;height:${h}px;background:${c}" title="${v}"></div>`;
    }).join('')}</div>`;
  }
  const cpuVals=data.filter(d=>d.cpu!=null).map(d=>parseFloat(d.cpu));
  const ramVals=data.filter(d=>d.ram!=null).map(d=>parseFloat(d.ram));
  const pingVals=data.filter(d=>d.ping!=null).map(d=>parseInt(d.ping));
  const ramTotal=data.find(d=>d.ram_total)?.ram_total||1;

  const diskData={};
  data.forEach(d=>{
    if(d.disks&&Array.isArray(d.disks)) d.disks.forEach(dk=>{
      if(!diskData[dk.drive])diskData[dk.drive]={vals:[],total:dk.total||1};
      diskData[dk.drive].vals.push(dk.used);
    });
  });

  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box wide">
    <div class="modal-header"><h2>📈 Métricas — ${m?.machine_name||''}</h2><button class="modal-close" onclick="closeModal()">Cerrar</button></div>
    <div class="day-tabs">
      ${[6,24,48,72,168].map(h=>`<button class="day-tab ${metricsHours===h?'active':''}" onclick="metricsHours=${h};loadMetrics(${activeModal.machineId},${h})">${h<24?h+'h':(h/24)+'d'}</button>`).join('')}
    </div>
    <p style="font-size:11px;color:#ccc;margin-bottom:14px">${data.length} puntos de datos</p>
    ${!activeModal.data?'<p style="color:#999;text-align:center">Cargando...</p>':`
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;color:#666">CPU</span><span style="font-size:12px;color:#999">${cpuVals.length>0?'Avg: '+Math.round(avgArr(cpuVals))+'% | Max: '+Math.round(Math.max(...cpuVals))+'%':'—'}</span></div>
      ${miniChart(cpuVals,'#4CAF50',100)}
    </div>
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;color:#666">RAM</span><span style="font-size:12px;color:#999">${ramVals.length>0?'Avg: '+(avgArr(ramVals)).toFixed(1)+'/'+ramTotal+' GB':'—'}</span></div>
      ${miniChart(ramVals,'#2196F3',ramTotal)}
    </div>
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;color:#666">Ping</span><span style="font-size:12px;color:#999">${pingVals.length>0?'Avg: '+Math.round(avgArr(pingVals))+'ms | Max: '+Math.max(...pingVals)+'ms':'—'}</span></div>
      ${miniChart(pingVals,'#FF9800',Math.max(...pingVals,200))}
    </div>
    ${Object.entries(diskData).map(([drive,dd])=>`<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;color:#666">Disco ${drive}</span><span style="font-size:12px;color:#999">${dd.vals.slice(-1)[0]?.toFixed?.(1)||'?'}/${dd.total} GB</span></div>
      ${miniChart(dd.vals,'#FF9800',dd.total)}
    </div>`).join('')}
    `}
  </div></div>`;
}

// ── CMD MODAL ──
function openCmd(id) {
  activeModal={type:'cmd',machineId:id,data:null,sending:false};
  render();
  api('/api/machines/'+id+'/commands').then(r=>{if(r.ok){activeModal.data=r.data;render();}});
}
async function sendCmd() {
  const inp=document.getElementById('cmd-input');
  const cmd=inp?.value?.trim();
  if(!cmd)return;
  activeModal.sending=true; render();
  await api('/api/machines/'+activeModal.machineId+'/command',{method:'POST',body:JSON.stringify({command:cmd})});
  activeModal.sending=false;
  const r=await api('/api/machines/'+activeModal.machineId+'/commands');
  if(r.ok){activeModal.data=r.data;}
  render();
}
function buildCmdModal() {
  const m=machines.find(x=>x.id===activeModal.machineId);
  const cmds=activeModal.data||[];
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box wide">
    <div class="modal-header"><h2>💻 Comando Remoto — ${m?.machine_name||''}</h2><button class="modal-close" onclick="closeModal()">Cerrar</button></div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input id="cmd-input" style="flex:1;border:2px solid #e0e0e0;border-radius:10px;padding:10px;font-size:14px;font-family:monospace;outline:none" placeholder="Ej: ipconfig /all, dir C:\, systeminfo..." onkeydown="if(event.key==='Enter')sendCmd()"/>
      <button class="modal-btn sm" onclick="sendCmd()" ${activeModal.sending?'disabled':''}>${activeModal.sending?'Enviando…':'Enviar'}</button>
    </div>
    <p style="font-size:11px;color:#ccc;margin-bottom:14px">Se ejecuta en el próximo heartbeat (~30s). Timeout: 30s. Máx output: 10KB.</p>
    ${!activeModal.data?'<p style="color:#999;text-align:center">Cargando...</p>':cmds.length===0?'<p style="color:#ccc;text-align:center;padding:20px 0">Sin comandos enviados</p>':
    cmds.map(c=>`<div class="cmd-entry ${c.status==='completed'?'done':'pending'}">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <code class="cmd-code">${c.command}</code>
        <span style="font-size:11px;font-weight:700;color:${c.status==='completed'?'#4CAF50':'#FF9800'}">${c.status==='completed'?'Completado':'Pendiente'}</span>
      </div>
      ${c.output?`<pre class="cmd-output">${c.output.replace(/</g,'&lt;')}</pre>`:''}
      <div class="cmd-meta">${new Date(c.created_at).toLocaleString('es')}${c.executed_at?' → '+new Date(c.executed_at).toLocaleString('es'):''}</div>
    </div>`).join('')}
    <button class="day-tab" style="margin-top:8px" onclick="openCmd(${activeModal.machineId})">🔄 Refrescar</button>
  </div></div>`;
}

// ── AGENT MODAL ──
function openAgentModal() {
  activeModal={type:'agent'};
  render();
}
function buildAgentModal() {
  const outdated=machines.filter(m=>m.agent_version&&agentInfo.version&&m.agent_version!==agentInfo.version);
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-header"><h2>📦 Gestión de Agente</h2><button class="modal-close" onclick="closeModal()">Cerrar</button></div>
    <p style="font-size:13px;color:#666;margin-bottom:4px">Versión configurada: <strong>${agentInfo.version||'No configurada'}</strong></p>
    ${outdated.length>0?`<p style="font-size:12px;color:#FF9800;margin-bottom:14px">⚠️ ${outdated.length} máquina(s) pendiente(s): ${outdated.map(m=>m.machine_name+' (v'+m.agent_version+')').join(', ')}</p>`:'<p style="font-size:12px;color:#4CAF50;margin-bottom:14px">✅ Todos los agentes actualizados</p>'}
    <label class="modal-label">Nueva versión</label>
    <input class="modal-input" id="ag-ver" placeholder="ej: 1.2.0" value="${agentInfo.version||''}"/>
    <label class="modal-label">URL de descarga (.exe)</label>
    <input class="modal-input" id="ag-url" placeholder="https://github.com/.../agent.exe" value="${agentInfo.url||''}" style="font-size:12px"/>
    <p style="font-size:11px;color:#ccc;margin-top:6px">Los agentes descargan la nueva versión automáticamente en el próximo heartbeat.</p>
    <button class="modal-btn" onclick="saveAgent()">Guardar</button>
    <button class="modal-btn ghost" onclick="closeModal()">Cancelar</button>
  </div></div>`;
}
async function saveAgent() {
  const version=document.getElementById('ag-ver').value.trim();
  const url=document.getElementById('ag-url').value.trim();
  if(!version||!url){alert('Completá versión y URL');return;}
  const r=await api('/api/agent/version',{method:'POST',body:JSON.stringify({version,url})});
  if(r.ok){agentInfo={version,url};closeModal();}
  else alert(r.data?.error||'Error');
}

// ── MAP FULL MODAL ──
function openMapFull() {
  activeModal={type:'mapfull'};
  render();
  setTimeout(initFullMap,120);
}
let fullMapInstance=null;
function initFullMap() {
  const el=document.getElementById('fullMap');
  if(!el)return;
  const pts=machines.filter(m=>m.geo_lat&&m.geo_lon).map(m=>({lat:parseFloat(m.geo_lat),lon:parseFloat(m.geo_lon),name:m.machine_name,online:m.is_online,ip:m.public_ip}));
  if(pts.length===0){el.innerHTML='<div style="padding:40px;text-align:center;color:#ccc">Sin datos de geolocalización</div>';return;}
  loadLeaflet(()=>{
    if(fullMapInstance){fullMapInstance.remove();fullMapInstance=null;}
    const center=[pts.reduce((a,p)=>a+p.lat,0)/pts.length,pts.reduce((a,p)=>a+p.lon,0)/pts.length];
    fullMapInstance=L.map(el).setView(center,5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(fullMapInstance);
    pts.forEach(p=>{
      const c=p.online?'#4CAF50':'#F44336';
      L.circleMarker([p.lat,p.lon],{radius:10,color:c,fillColor:c,fillOpacity:.85}).bindPopup(`<strong>${p.name}</strong><br>${p.online?'🟢 Online':'🔴 Offline'}<br><small>${p.ip||''}</small>`).addTo(fullMapInstance);
    });
    if(pts.length>1)fullMapInstance.fitBounds(pts.map(p=>[p.lat,p.lon]),{padding:[20,20]});
  });
}
function buildMapFullModal() {
  const pts=machines.filter(m=>m.geo_lat&&m.geo_lon);
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box wide">
    <div class="modal-header"><h2>🗺️ Mapa de Máquinas</h2><button class="modal-close" onclick="closeModal()">Cerrar</button></div>
    <div id="fullMap" style="height:400px;border-radius:10px;overflow:hidden;margin-bottom:14px"></div>
    ${pts.map(m=>`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px">
      <span style="width:10px;height:10px;border-radius:50%;background:${m.is_online?'#4CAF50':'#F44336'};display:inline-block;flex-shrink:0"></span>
      <strong>${m.machine_name}</strong>
      <span style="color:#999">${m.geo_city||''},${m.geo_country||''}</span>
      <span style="margin-left:auto;color:#ccc;font-size:11px">${m.public_ip||''}</span>
    </div>`).join('')}
  </div></div>`;
}

// ── ACTIONS ──
function exportCSV() {
  fetch(API+'/api/machines/export/csv',{headers:{Authorization:'Bearer '+token}})
    .then(r=>r.blob())
    .then(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='servers.csv';a.click();})
    .catch(()=>alert('Error al exportar CSV'));
}
function exportPDF() {
  window.open(API+'/api/machines/report/pdf?token='+token,'_blank');
}
function downloadRDP(id) {
  fetch(API+'/api/machines/'+id+'/rdp',{headers:{Authorization:'Bearer '+token}})
    .then(r=>r.blob())
    .then(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='connect.rdp';a.click();})
    .catch(()=>alert('Error al descargar RDP'));
}
async function requestSpeedTest(id) {
  const r=await api('/api/machines/'+id+'/speedtest',{method:'POST'});
  if(r.ok)alert('Speed test solicitado. Resultado disponible en ~30 segundos.');
  else alert(r.data?.error||'Error');
}

// ── ATTACH EVENTS (called after render) ──
function attachEvents() {
  // search input focus restore
  const si=document.getElementById('hdr-search');
  if(si&&filter){setTimeout(()=>{si.focus();si.setSelectionRange(si.value.length,si.value.length);},0);}
}

// ── DATA LOADING ──
async function loadMachines() {
  const r=await api('/api/machines');
  if(r.ok){machines=r.data;render();}
  else if(r.status===401){logout();}
}
async function loadAgentInfo() {
  const r=await api('/api/agent/version');
  if(r.ok)agentInfo=r.data;
}
async function startDashboard() {
  await Promise.all([loadMachines(),loadAgentInfo()]);
  if(refreshInterval)clearInterval(refreshInterval);
  refreshInterval=setInterval(loadMachines,10000);
}

// ── INIT ──
// ── SERVICES MODAL ──
async function openServices(id) {
  activeModal = { type: 'services', machineId: id, data: null };
  render();
  const res = await api('/api/machines/' + id + '/services');
  if (res.ok) { activeModal.data = res.data; render(); }
}
function renderServicesModal() {
  const m = machines.find(x => x.id === activeModal.machineId);
  const d = activeModal.data;
  const services = d?.services || [];
  const ports = d?.open_ports || [];
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-panel" style="max-width:600px">
    <div class="modal-header"><h2>⚙ Servicios — ${m?.machine_name||''}</h2><button class="modal-close" onclick="closeModal()">Cerrar</button></div>
    ${!d ? '<p style="color:#999;text-align:center;padding:30px">Cargando...</p>' : services.length === 0 ? '<p style="color:#999;text-align:center;padding:30px">Sin servicios detectados. Actualiza el agente.</p>' : `
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <tr><th style="text-align:left;padding:8px;border-bottom:2px solid #eee;color:#666">Servicio</th><th style="text-align:left;padding:8px;border-bottom:2px solid #eee;color:#666">Nombre</th><th style="padding:8px;border-bottom:2px solid #eee;color:#666">Estado</th></tr>
        ${services.map(s => `<tr style="border-bottom:1px solid #f5f5f5">
          <td style="padding:6px 8px;font-weight:600">${s.name}</td>
          <td style="padding:6px 8px;color:#666">${s.display}</td>
          <td style="padding:6px 8px;text-align:center"><span style="display:inline-block;padding:2px 10px;border-radius:4px;font-size:11px;font-weight:700;background:${s.state==='RUNNING'?'#E8F5E9':'#FFEBEE'};color:${s.state==='RUNNING'?'#4CAF50':'#F44336'}">${s.state}</span></td>
        </tr>`).join('')}
      </table>
    `}
  </div></div>`;
}

// ── PORTS MODAL ──
async function openPorts(id) {
  activeModal = { type: 'ports', machineId: id, data: null };
  render();
  const res = await api('/api/machines/' + id + '/services');
  if (res.ok) { activeModal.data = res.data; render(); }
}
function renderPortsModal() {
  const m = machines.find(x => x.id === activeModal.machineId);
  const ports = activeModal.data?.open_ports || [];
  const knownPorts = {21:'FTP',22:'SSH',25:'SMTP',53:'DNS',80:'HTTP',110:'POP3',135:'RPC',139:'NetBIOS',143:'IMAP',443:'HTTPS',445:'SMB',993:'IMAPS',995:'POP3S',1433:'SQL Server',1521:'Oracle',3306:'MySQL',3389:'RDP',5432:'PostgreSQL',5900:'VNC',8080:'HTTP Alt',8443:'HTTPS Alt'};
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-panel" style="max-width:500px">
    <div class="modal-header"><h2>🔌 Puertos — ${m?.machine_name||''}</h2><button class="modal-close" onclick="closeModal()">Cerrar</button></div>
    ${!activeModal.data ? '<p style="color:#999;text-align:center;padding:30px">Cargando...</p>' : ports.length === 0 ? '<p style="color:#999;text-align:center;padding:30px">Sin datos de puertos. Actualiza el agente.</p>' : `
      <p style="color:#666;font-size:12px;margin-bottom:12px">${ports.length} puertos TCP en LISTENING</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${ports.map(p => `<div style="background:${knownPorts[p]?'#E3F2FD':'#f5f5f5'};border-radius:8px;padding:6px 12px;font-size:13px">
          <strong style="color:${knownPorts[p]?'#2196F3':'#333'}">${p}</strong>
          ${knownPorts[p] ? '<span style="color:#999;font-size:10px;margin-left:4px">' + knownPorts[p] + '</span>' : ''}
        </div>`).join('')}
      </div>
    `}
  </div></div>`;
}

// ── CONFIG BACKUP MODAL ──

  render();
  const res = await api('/api/machines/' + id + '/config');

}
function renderConfigModal() {

// ── COMMAND HISTORY MODAL ──
async function openCmdHistory() {
  activeModal = { type: 'cmdhistory', data: null };
  render();
  const res = await api('/api/commands/history');
  if (res.ok) { activeModal.data = res.data; render(); }
}
function renderCmdHistoryModal() {
  const cmds = activeModal.data || [];
  return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-panel" style="max-width:700px">
    <div class="modal-header"><h2>💻 Historial de Comandos</h2><button class="modal-close" onclick="closeModal()">Cerrar</button></div>
    ${!activeModal.data ? '<p style="color:#999;text-align:center;padding:30px">Cargando...</p>' : cmds.length === 0 ? '<p style="color:#999;text-align:center;padding:30px">Sin comandos ejecutados</p>' : cmds.map(c => `
      <div style="background:#f8f9fa;border-radius:8px;padding:12px;margin-bottom:8px;border-left:3px solid ${c.status==='completed'?'#4CAF50':'#FF9800'}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">

          <span style="font-size:11px;font-weight:700;color:${c.status==='completed'?'#4CAF50':'#FF9800'}">${c.status==='completed'?'Completado':'Pendiente'}</span>
        </div>
        <code style="color:#2196F3;font-size:12px;display:block;margin-bottom:4px">${c.command}</code>
        ${c.output ? '<pre style="background:#fff;border:1px solid #eee;border-radius:4px;padding:8px;font-size:11px;color:#555;max-height:150px;overflow-y:auto;margin:4px 0 0;white-space:pre-wrap">' + c.output.replace(/</g,'&lt;') + '</pre>' : ''}
        <div style="color:#999;font-size:10px;margin-top:4px">${new Date(c.created_at).toLocaleString('es')}${c.executed_at ? ' → ' + new Date(c.executed_at).toLocaleString('es') : ''}</div>
      </div>`).join('')}
  </div></div>`;
}
