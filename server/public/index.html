    ${active.length>0?`<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:700;color:#FF9800;margin-bottom:6px">🔧 Activas ahora</div>
      ${active.map(w=>buildMwCard(w,'#FFF3E0','#FF9800')).join('')}</div>`:''}
    ${upcoming.length>0?`<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:700;color:#2196F3;margin-bottom:6px">📅 Próximas</div>
      ${upcoming.map(w=>buildMwCard(w,'#E3F2FD','#2196F3')).join('')}</div>`:''}
    ${past.length>0?`<div><div style="font-size:12px;font-weight:700;color:#999;margin-bottom:6px">📋 Pasadas</div>
      ${past.map(w=>buildMwCard(w,'#f8f9fa','#999')).join('')}</div>`:''}
    ${maintenanceWindows.length===0?'<p style="text-align:center;color:#ccc;padding:20px 0;font-size:13px">Sin ventanas de mantenimiento programadas</p>':''}
  </div>`;
}
function buildMwCard(w, bg, color) {
  const start = new Date(w.start_time).toLocaleString('es', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  const end = new Date(w.end_time).toLocaleString('es', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  return `<div style="background:${bg};border-left:3px solid ${color};border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px">
    <div style="flex:1">
      <div style="font-size:14px;font-weight:700;color:var(--text)">${w.title||'Mantenimiento'}</div>
      <div style="font-size:12px;color:#999;margin-top:2px">${w.machine_name||'Todas las máquinas'} · ${start} → ${end}</div>
    </div>
    <button style="background:none;border:none;color:#F44336;cursor:pointer;font-size:16px;padding:4px" onclick="deleteMaintenance(${w.id})">✕</button>
  </div>`;
}
function openAddMaintenance() {
  pauseRefresh();
  activeModal = { type: 'addmaintenance' };
  render();
}
async function saveMaintenance() {
  const data = {
    machine_id: document.getElementById('mw-machine')?.value || null,
    title: document.getElementById('mw-title')?.value?.trim() || 'Mantenimiento',
    start_time: document.getElementById('mw-start')?.value,
    end_time: document.getElementById('mw-end')?.value,
    repeat: document.getElementById('mw-repeat')?.value || 'none'
  };
  if (!data.start_time || !data.end_time) { alert('Horario requerido'); return; }
  const r = await api('/api/maintenance', { method: 'POST', body: JSON.stringify(data) });
  if (r.ok) { closeModal(); loadMaintenance(); render(); }
  else alert(r.data?.error || 'Error');
}
async function deleteMaintenance(id) {
  if (!confirm('¿Eliminar ventana de mantenimiento?')) return;
  await api('/api/maintenance/' + id, { method: 'DELETE' });
  loadMaintenance();
  render();
}

// ── AUDIT LOG ──
let auditLog = [];
async function loadAuditLog() {
  const r = await api('/api/audit?limit=100');
  if (r.ok) { auditLog = r.data; }
}
function buildAuditSection() {
  const actionLabels = {
    login:'🔑 Inicio de sesión', register:'📝 Registro', edit_machine:'✏️ Editar máquina',
    delete_machine:'🗑️ Eliminar máquina', remote_command:'💻 Comando remoto',
    create_maintenance:'🔧 Crear mantenimiento', create_url_monitor:'🌐 Agregar URL',
    wake_on_lan:'⚡ Wake-on-LAN'
  };
  return `<div class="panel">
    <div class="panel-title"><span class="dot" style="background:#9C27B0"></span>Log de Auditoría<button class="help-btn" onclick="event.stopPropagation();showHelp('audit',this)">?</button></div>
    <button class="modal-btn sm" onclick="loadAuditLog().then(()=>render())" style="margin-bottom:12px">🔄 Actualizar</button>
    ${auditLog.length===0?'<p style="text-align:center;color:#ccc;padding:20px 0;font-size:13px">Sin acciones registradas</p>':`
    <div style="max-height:400px;overflow-y:auto">
      ${auditLog.map(a=>{
        const date = new Date(a.created_at);
        let detailText = '';
        if (a.details) {
          try {
            const d = typeof a.details === 'string' ? JSON.parse(a.details) : a.details;
            if (a.action === 'edit_machine' && d.machine_name) { const p=[d.machine_name]; if(d.grupo)p.push('Grupo: '+d.grupo); if(d.location)p.push(d.location); detailText=p.join(' · '); }
            else if (a.action === 'remote_command' && d.command) { detailText = d.command; }
            else if (a.action === 'create_url_monitor' && (d.url||d.name)) { detailText = d.name||d.url; }
            else if (typeof d === 'object') { detailText = Object.entries(d).filter(([,v])=>v).map(([k,v])=>k+': '+v).slice(0,3).join(' · '); }
            else { detailText = String(d); }
          } catch(e) { detailText = String(a.details); }
        }
        if (a.target_type) detailText += (detailText?' ':'') + '('+a.target_type+' #'+a.target_id+')';
        const fullLabel = actionLabels[a.action]||a.action;
        return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border2);font-size:13px">
          <span style="font-size:16px">${fullLabel.split(' ')[0]}</span>
          <div style="flex:1">
            <div style="font-weight:600;color:var(--text)">${fullLabel.split(' ').slice(1).join(' ')}</div>
            <div style="font-size:11px;color:#999">${detailText}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:11px;color:#999">${date.toLocaleDateString('es',{day:'2-digit',month:'short'})}</div>
            <div style="font-size:11px;color:#ccc">${date.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`}
  </div>`;
}

// ── WAKE-ON-LAN ──
async function sendWol(id) {
  const r = await api('/api/machines/' + id + '/wol', { method: 'POST' });
  if (r.ok) alert(r.data.message || 'Magic packet enviado');
  else alert(r.data?.error || 'Error al enviar WOL');
}

function buildAddMaintenanceModal() {
  const now = new Date();
  const localNow = new Date(now.getTime() - now.getTimezoneOffset()*60000).toISOString().slice(0,16);
  const inOneHour = new Date(now.getTime() - now.getTimezoneOffset()*60000 + 3600000).toISOString().slice(0,16);
  return `<div class="modal-overlay" onmousedown="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-header"><h2>🔧 Nueva Ventana de Mantenimiento</h2><button class="modal-close" onclick="closeModal()">Cerrar</button></div>
    <label class="modal-label">Titulo</label>
    <input class="modal-input" id="mw-title" value="Mantenimiento" placeholder="Reboot nocturno"/>
    <label class="modal-label">Máquina (vacío = todas)</label>
    <select class="modal-input" id="mw-machine">
      <option value="">Todas las máquinas</option>
      ${machines.map(m=>`<option value="${m.id}">${m.machine_name}</option>`).join('')}
    </select>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
      <div><label class="modal-label">Inicio</label>
        <input class="modal-input" id="mw-start" type="datetime-local" value="${localNow}"/></div>
      <div><label class="modal-label">Fin</label>
        <input class="modal-input" id="mw-end" type="datetime-local" value="${inOneHour}"/></div>
    </div>
    <label class="modal-label">Repetir</label>
    <select class="modal-input" id="mw-repeat">
      <option value="none">No repetir</option>
      <option value="daily">Diario</option>
      <option value="weekly">Semanal</option>
      <option value="monthly">Mensual</option>
    </select>
    <p style="font-size:11px;color:#999;margin-top:8px">Las alertas se silencian durante la ventana de mantenimiento.</p>
    <button class="modal-btn" onclick="saveMaintenance()">Crear ventana</button>
    <button class="modal-btn ghost" onclick="closeModal()">Cancelar</button>
  </div></div>`;
}
