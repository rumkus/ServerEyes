<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServerEyes — NOC Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
/* Tokens. Azul de accion conservado; verde/ambar/rojo reservados para estados. */
:root{
  --bg:#f3f4f6;--bg2:#ffffff;--bg3:#f8f9fb;--text:#1f2937;--text2:#4b5563;--text3:#6b7280;
  --border:#e5e7eb;--border2:#eceef2;--shadow:rgba(15,23,42,.06);--header-bg:#ffffff;--card-bg:#ffffff;--input-bg:#f8f9fb;
  --code-bg:#111827;--code-text:#c9d1d9;
  --accent:#2196F3;--accent-hover:#1976D2;--accent-soft:#e8f2fd;
  --ok:#2e7d32;--ok-soft:#e8f5e9;--warn:#b26a00;--warn-soft:#fff4e0;--crit:#c62828;--crit-soft:#fdecea;
  --sidebar-w:224px;--topbar-h:56px;--bottomnav-h:56px;--radius:10px;
}
html.dark{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--text:#e6edf3;--text2:#b1bac4;--text3:#8b949e;
  --border:#30363d;--border2:#262c36;--shadow:rgba(0,0,0,.35);--header-bg:#161b22;--card-bg:#161b22;--input-bg:#0d1117;
  --code-bg:#0d1117;--code-text:#c9d1d9;
  --accent-soft:#12283d;--ok:#4caf50;--ok-soft:#12321a;--warn:#ffb74d;--warn-soft:#3a2a10;--crit:#ef5350;--crit-soft:#3d1a1a;
}
html{font-size:14px;}
body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;line-height:1.4;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
/* Iconos: un solo set SVG inline (trazo 2px), tamaño por contexto */
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-3px;}
.ico.sm{width:14px;height:14px;}
.ico.lg{width:22px;height:22px;}

/* ── LOGIN ── */
.login-screen{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);}
.login-card{background:var(--bg2);border-radius:16px;padding:40px 36px;width:380px;max-width:92vw;box-shadow:0 24px 64px rgba(0,0,0,0.4);}
.login-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;}
.login-logo .eye-icon{font-size:32px;}
.login-logo h1{font-size:24px;font-weight:800;color:var(--text);}
.login-sub{text-align:center;color:var(--text3);font-size:13px;margin-bottom:28px;}
.login-card input{width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;font-size:15px;color:var(--text);background:var(--input-bg);outline:none;margin-bottom:12px;transition:border-color .2s;}
.login-card input:focus{border-color:var(--accent);}
.login-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;}
.login-btn:hover{background:var(--accent-hover);}
.login-err{color:var(--crit);text-align:center;font-size:13px;margin-top:8px;}

/* ── SHELL: sidebar en escritorio, barra inferior en movil ── */
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--header-bg);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:110;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;color:var(--text);text-decoration:none;}
.sidebar-brand .eye{font-size:22px;line-height:1;}
.sidebar-brand .name{font-size:17px;font-weight:800;letter-spacing:-.2px;}
.sidebar-brand .plan{margin-left:auto;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--bg3);color:var(--text2);border:1px solid var(--border);}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;flex:1;overflow-y:auto;}
.side-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:none;background:none;color:var(--text2);font-size:13.5px;font-weight:600;text-align:left;position:relative;width:100%;}
.side-item:hover{background:var(--bg3);color:var(--text);}
.side-item.active{background:var(--accent-soft);color:var(--accent);}
.side-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent);}
.side-item .count{margin-left:auto;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--crit);color:#fff;display:inline-flex;align-items:center;justify-content:center;}
.sidebar-foot{padding:10px 12px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px;}
.sidebar-foot .side-item{padding:8px 12px;font-size:13px;}
.app-body{flex:1;min-width:0;display:flex;flex-direction:column;}

/* ── TOPBAR ── */
.topbar{background:var(--header-bg);border-bottom:1px solid var(--border);height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:100;}
.topbar .brand-mini{display:none;align-items:center;gap:8px;font-weight:800;font-size:16px;color:var(--text);}
.view-title{font-size:16px;font-weight:700;color:var(--text);white-space:nowrap;}
.view-sub{font-size:12px;color:var(--text3);white-space:nowrap;}
.header-search{flex:1;max-width:380px;position:relative;margin-left:8px;}
.header-search input{width:100%;height:36px;border:1px solid var(--border);border-radius:8px;padding:0 12px 0 34px;font-size:13px;color:var(--text);outline:none;background:var(--input-bg);}
.header-search input:focus{border-color:var(--accent);background:var(--bg2);}
.header-search .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);display:flex;}
.header-spacer{flex:1;}
.header-actions{display:flex;align-items:center;gap:4px;}
.icon-btn{background:none;border:none;cursor:pointer;width:36px;height:36px;border-radius:8px;color:var(--text2);display:inline-flex;align-items:center;justify-content:center;position:relative;}
.icon-btn:hover{background:var(--bg3);color:var(--text);}
.badge-dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;background:var(--crit);color:#fff;border-radius:8px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;border:none;margin-left:4px;}

/* ── MAIN ── */
.noc-main{flex:1;padding:18px 20px 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;grid-auto-rows:max-content;align-content:start;}
/* Los hijos del grid deben poder achicarse al ancho del track: sin esto, un
   contenido ancho (tabla, texto largo) desborda el padding-right y se mete
   debajo del FAB en pantallas angostas. */
.noc-main>*{min-width:0;}

/* ── STATS: altura fija y compacta, no crecen para llenar ── */
.stats-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start;}
.stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;height:64px;display:flex;align-items:center;gap:12px;}
.stat-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text2);background:var(--bg3);}
.stat-icon.blue{background:var(--accent-soft);color:var(--accent);}
.stat-icon.green{background:var(--ok-soft);color:var(--ok);}
.stat-icon.red{background:var(--crit-soft);color:var(--crit);}
.stat-icon.orange{background:var(--warn-soft);color:var(--warn);}
.stat-info{flex:1;min-width:0;}
.stat-num{font-size:22px;font-weight:800;line-height:1.1;color:var(--text);font-variant-numeric:tabular-nums;}
.stat-num.blue{color:var(--accent);}
.stat-num.green{color:var(--ok);}
.stat-num.red{color:var(--crit);}
.stat-num.orange{color:var(--warn);}
.stat-label{font-size:11.5px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-extra{font-size:11px;color:var(--text3);white-space:nowrap;}
.sparkline{width:56px;height:24px;}

/* ── GRID SECTIONS ── */
.noc-grid-problemas{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start;}
.noc-grid-top{display:grid;grid-template-columns:200px 1fr 280px;gap:14px;align-items:start;}
.noc-grid-mid{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start;}

/* ── PANEL ── */
.panel{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;min-width:0;}
.panel-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.panel-title .dot{width:8px;height:8px;border-radius:50%;}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.panel-head .panel-title{margin:0;}
.panel-head .spacer{flex:1;}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn:hover{background:var(--bg3);color:var(--text);border-color:var(--text3);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
.btn.sm{height:28px;padding:0 10px;font-size:12px;}
.help-btn{width:18px;height:18px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--text3);font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin-left:4px;flex-shrink:0;}
.help-btn.clicked{animation:none;}
.help-btn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.help-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:center;z-index:600;padding:20px;}
.help-modal{background:var(--card-bg,#fff);border-radius:16px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2);}
.help-modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border2,#eee);}
.help-modal-header h3{font-size:16px;font-weight:700;color:var(--text,#333);}
.help-modal-close{background:none;border:none;font-size:20px;color:#999;cursor:pointer;padding:4px 8px;}
.help-modal-close:hover{color:var(--text,#333);}
.help-modal-body{padding:20px;}
.help-modal-body p{font-size:14px;color:var(--text,#333);line-height:1.6;margin-bottom:12px;}
.help-modal-body ul,.help-modal-body ol{padding-left:20px;margin-bottom:12px;}
.help-modal-body li{font-size:13px;color:#666;line-height:1.6;margin-bottom:4px;}
.help-modal-body strong{color:var(--text,#333);}
.help-modal-body .help-tip{background:var(--bg,#f8f9fa);border-left:3px solid var(--accent,#2196F3);border-radius:0 8px 8px 0;padding:10px 14px;font-size:12px;color:#666;margin-top:12px;}
.notif-wrap{position:relative;display:inline-block;}
.notif-badge{position:absolute;top:-4px;right:-4px;background:#9C27B0;color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.notif-dropdown{position:fixed;top:60px;right:20px;width:340px;max-height:400px;overflow-y:auto;background:var(--card-bg,#fff);border:1px solid var(--border2,#eee);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:10000;}
.notif-dropdown-header{padding:14px 16px;border-bottom:1px solid var(--border2,#eee);font-size:14px;font-weight:700;color:var(--text,#333);}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border2,#eee);cursor:pointer;transition:background .2s;}
.notif-item:hover{background:var(--bg,#f8f9fa);}
.notif-item.unread{border-left:3px solid #9C27B0;}
.notif-item .ni-title{font-size:13px;font-weight:700;color:var(--text,#333);}
.notif-item .ni-msg{font-size:12px;color:#888;margin-top:2px;line-height:1.4;}
.notif-item .ni-time{font-size:10px;color:#bbb;margin-top:4px;}
.notif-empty{padding:30px;text-align:center;color:#999;font-size:13px;}
/* SUPPORT CHAT */
.support-fab{position:fixed;bottom:20px;right:20px;width:48px;height:48px;border-radius:50%;background:#9C27B0;color:#fff;border:none;font-size:22px;cursor:pointer;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;transition:transform .2s;}
.support-fab:hover{transform:scale(1.1);}
.support-panel{position:fixed;bottom:80px;right:20px;width:380px;height:500px;background:var(--card-bg,#fff);border:1px solid var(--border2);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.2);z-index:10000;display:flex;flex-direction:column;overflow:hidden;}
.support-header{padding:14px 16px;background:#9C27B0;color:#fff;display:flex;align-items:center;justify-content:space-between;}
.support-header h4{font-size:15px;font-weight:700;margin:0;}
.support-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.support-msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;word-break:break-word;}
.support-msg.user{align-self:flex-end;background:#9C27B0;color:#fff;border-bottom-right-radius:4px;}
.support-msg.admin{align-self:flex-start;background:var(--bg,#f0f2f5);color:var(--text,#333);border-bottom-left-radius:4px;}
.support-msg .msg-time{font-size:10px;opacity:.6;margin-top:4px;}
.support-msg .msg-attach{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.support-msg .msg-attach a{font-size:11px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:4px;color:inherit;text-decoration:none;}
.support-input-area{padding:10px;border-top:1px solid var(--border2);display:flex;gap:8px;align-items:end;}
.support-input-area textarea{flex:1;border:1px solid var(--border2);border-radius:10px;padding:8px 12px;font-size:13px;resize:none;max-height:60px;color:var(--text);background:var(--input-bg);outline:none;font-family:inherit;}
.support-input-area button{background:#9C27B0;color:#fff;border:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;}
.support-tickets-list{flex:1;overflow-y:auto;padding:12px;}
.support-ticket-item{padding:12px;border:1px solid var(--border2);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:background .2s;}
.support-ticket-item:hover{background:var(--bg);}

.notif-toast{position:fixed;top:20px;right:20px;background:#9C27B0;color:#fff;border-radius:14px;padding:14px 20px;box-shadow:0 6px 24px rgba(156,39,176,.4);z-index:700;max-width:360px;cursor:pointer;animation:toastIn .4s ease-out;display:flex;align-items:start;gap:12px;}
.notif-toast .nt-icon{font-size:22px;flex-shrink:0;}
.notif-toast .nt-title{font-size:14px;font-weight:700;}
.notif-toast .nt-msg{font-size:12px;opacity:.9;margin-top:2px;line-height:1.4;}
.notif-toast .nt-close{position:absolute;top:8px;right:12px;font-size:16px;opacity:.6;cursor:pointer;}
.notif-toast .nt-close:hover{opacity:1;}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── DONUT (legado, otras vistas) ── */
.donut-wrap{display:flex;flex-direction:column;align-items:center;}
.donut-svg{width:120px;height:120px;}
.donut-pct{font-size:22px;font-weight:800;text-anchor:middle;dominant-baseline:middle;}
.donut-sub{font-size:13px;color:var(--text3);margin-top:6px;text-align:center;}

/* ── MAP (secundario) ── */
.map-panel{position:relative;z-index:0;}
#nocMap{width:100%;height:220px;border-radius:8px;overflow:hidden;position:relative;z-index:0;background:var(--bg3);}
.map-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text3);font-size:12.5px;text-align:center;padding:16px;border:1px dashed var(--border);border-radius:8px;}
.map-empty strong{color:var(--text2);font-size:13px;}

/* ── PROBLEMAS / ALERTAS ── */
.alert-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;}
.alert-item{display:flex;align-items:flex-start;gap:10px;background:var(--crit-soft);border-left:3px solid var(--crit);border-radius:0 8px 8px 0;padding:8px 12px;cursor:pointer;}
.alert-item.warn{background:var(--warn-soft);border-left-color:var(--warn);}
.alert-item .alert-ico{color:var(--crit);margin-top:1px;}
.alert-item.warn .alert-ico{color:var(--warn);}
.alert-item .alert-body{flex:1;min-width:0;}
.alert-item .alert-name{font-size:13px;font-weight:700;color:var(--text);}
.alert-item .alert-time{font-size:11.5px;color:var(--text2);margin-top:1px;}
.alert-item .alert-ip{font-size:11.5px;color:var(--text2);}
.no-alerts{display:flex;align-items:center;gap:8px;padding:14px 4px;color:var(--ok);font-size:13px;font-weight:600;}
.no-alerts .sub{color:var(--text3);font-weight:400;font-size:12px;}
.prob-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.prob-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:14px;background:var(--bg3);color:var(--text2);border:1px solid var(--border);}
.prob-chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent;}
.prob-chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent;}
.prob-chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent;}

/* ── RECURSOS (legado) ── */
.recursos-wrap{display:flex;align-items:center;gap:16px;}
.recursos-list{flex:1;display:flex;flex-direction:column;gap:8px;}
.rec-row{display:flex;align-items:center;gap:8px;}
.rec-label{font-size:12px;color:var(--text2);width:50px;}
.rec-bar-bg{flex:1;height:6px;background:var(--border2);border-radius:3px;overflow:hidden;}
.rec-bar-fg{height:100%;border-radius:3px;transition:width .4s;}
.rec-pct{font-size:12px;font-weight:700;width:34px;text-align:right;}

/* ── SERVER TABLE: amplia y legible ── */
.table-wrap{overflow-x:auto;}
.server-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
.server-table th{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
.server-table th.num,.server-table td.num{text-align:right;}
.server-table td{padding:9px 10px;border-bottom:1px solid var(--border2);vertical-align:middle;font-size:13px;color:var(--text);}
.server-table tbody tr{cursor:pointer;}
.server-table tbody tr:hover td{background:var(--bg3);}
.server-table tr:last-child td{border-bottom:none;}
.status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}
.status-dot.on{background:var(--ok);}
.status-dot.off{background:var(--crit);}
.srv-name{font-size:13.5px;font-weight:700;color:var(--text);}
.srv-meta{font-size:11.5px;color:var(--text3);margin-top:1px;}
.srv-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px;white-space:nowrap;}
.srv-badge.on{background:var(--ok-soft);color:var(--ok);}
.srv-badge.off{background:var(--crit-soft);color:var(--crit);}
.metric{display:inline-flex;flex-direction:column;align-items:flex-end;min-width:52px;}
.mini-bar{width:56px;height:5px;background:var(--border2);border-radius:3px;overflow:hidden;margin-top:3px;}
.mini-bar-fg{height:100%;border-radius:3px;}
.val-num{font-size:13px;font-weight:700;}
.val-num.ok{color:var(--ok);}
.val-num.warn{color:var(--warn);}
.val-num.crit{color:var(--crit);}
.val-num.muted{color:var(--text3);font-weight:500;}
.row-actions{display:flex;gap:4px;justify-content:flex-end;}
.empty-state{text-align:center;color:var(--text3);padding:24px 0;font-size:13px;}

/* ── ACCIONES (legado, otras vistas) ── */
.actions-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.action-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:11px;font-weight:700;color:var(--text2);}
.action-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.action-btn .ab-icon{font-size:20px;}

/* ── BOTTOM NAV (solo movil) ── */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--header-bg);border-top:1px solid var(--border);height:var(--bottomnav-h);z-index:99;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.bottom-nav::-webkit-scrollbar{display:none;}
.nav-item{flex:1;min-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:600;position:relative;border:none;background:none;padding:0 4px;}
.nav-item:hover,.nav-item.active{color:var(--accent);}
.nav-badge{position:absolute;top:6px;right:calc(50% - 20px);background:var(--crit);color:#fff;border-radius:8px;min-width:16px;height:16px;padding:0 4px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700;}

/* ── MODALS ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;z-index:500;overflow-y:auto;}
.modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:560px;margin:auto;box-shadow:0 16px 40px rgba(0,0,0,.25);}
.modal-box.wide{max-width:720px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-header h2{font-size:18px;font-weight:800;color:var(--text);}
.modal-close{background:var(--bg);border:none;border-radius:8px;padding:6px 14px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:600;}
.modal-close:hover{background:var(--border);color:var(--text);}
.modal-label{font-size:12px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:14px;margin-bottom:4px;display:block;}
.modal-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--text);background:var(--input-bg);outline:none;transition:border-color .2s;}
.modal-input:focus{border-color:#2196F3;}
.modal-textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--text);background:var(--input-bg);outline:none;resize:vertical;min-height:70px;}
.modal-textarea:focus{border-color:#2196F3;}
select.modal-input{appearance:auto;cursor:pointer;}
.modal-btn{width:100%;background:#2196F3;color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px;transition:background .2s;}
.modal-btn:hover{background:#1976D2;}
.modal-btn.danger{background:#F44336;}
.modal-btn.danger:hover{background:#D32F2F;}
.modal-btn.ghost{background:var(--bg);color:var(--text2);margin-top:8px;}
.modal-btn.ghost:hover{background:var(--border);}
.modal-btn.sm{width:auto;padding:8px 18px;font-size:13px;margin-top:0;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.chip{background:var(--accent-soft);color:var(--accent);border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;}
.chip:hover{background:#BBDEFB;}
.day-tabs{display:flex;gap:8px;margin-bottom:16px;}
.day-tab{background:var(--bg2);color:var(--text2);border:1px solid var(--border);border-radius:8px;height:32px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;}
.day-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* uptime bars */
.uptime-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.uptime-day{font-size:11px;color:#999;width:80px;flex-shrink:0;}
.uptime-bg{flex:1;height:16px;background:#f0f2f5;border-radius:4px;overflow:hidden;}
.uptime-fg{height:100%;border-radius:4px;}
.uptime-pct{font-size:12px;font-weight:700;width:36px;text-align:right;flex-shrink:0;}
.uptime-avg{text-align:center;margin-bottom:20px;}
.uptime-avg .big{font-size:48px;font-weight:800;line-height:1;}

/* ip history */
.ip-entry{background:#f8f9fa;border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
.ip-entry .ip-date{color:#999;font-size:11px;width:130px;}
.ip-old{color:#FF9800;font-weight:700;font-size:13px;}
.ip-arrow{color:#ccc;}
.ip-new{color:#4CAF50;font-weight:700;font-size:13px;}

/* metrics mini chart */
.mini-chart{display:flex;align-items:flex-end;height:60px;gap:1px;background:#f8f9fa;border-radius:8px;padding:4px;overflow:hidden;}
.mini-bar-chart{border-radius:1px;transition:height .3s;}

/* logs */
.log-pre{background:var(--code-bg);color:var(--code-text);border-radius:10px;padding:14px;font-size:11px;font-family:monospace;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto;line-height:1.7;}

/* cmd */
.cmd-entry{background:#f8f9fa;border-radius:10px;padding:12px;margin-bottom:8px;border-left:3px solid #ccc;}
.cmd-entry.done{border-left-color:#4CAF50;}
.cmd-entry.pending{border-left-color:#FF9800;}
.cmd-code{font-family:monospace;color:#2196F3;font-size:13px;}
.cmd-output{background:#1a1a2e;color:#aaa;border-radius:6px;padding:8px;font-size:11px;font-family:monospace;white-space:pre-wrap;max-height:180px;overflow-y:auto;margin-top:6px;}
.cmd-meta{font-size:10px;color:#999;margin-top:4px;}

/* disk detail */
.disk-card{background:var(--bg3);border-radius:10px;padding:14px;margin-bottom:10px;}
.disk-card-header{display:flex;align-items:center;margin-bottom:8px;}
.disk-drive-name{flex:1;font-size:16px;font-weight:800;}
.disk-pct-big{font-size:20px;font-weight:800;}
.disk-stat-row{display:flex;justify-content:space-between;font-size:12px;color:#999;margin-bottom:2px;}
.disk-stat-val{color:#333;font-weight:600;}
.disk-bar{height:8px;background:#e8e8e8;border-radius:4px;overflow:hidden;margin:6px 0 10px;}
.disk-bar-fg{height:100%;border-radius:4px;}
.disk-controls{display:flex;align-items:center;gap:10px;padding-top:8px;border-top:1px solid #e8e8e8;}

/* checkbox */
.checkbox-row{display:flex;align-items:center;gap:8px;cursor:pointer;}
.checkbox-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;}

/* update banner */
.update-banner{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.update-banner .ub-msg{color:var(--warn);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;}
.update-banner .ub-sub{color:var(--text2);font-size:11px;font-weight:400;margin-top:2px;}
.ub-dismiss{background:none;border:none;color:#999;cursor:pointer;font-size:18px;padding:2px 6px;}

/* pulse animation */
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.pulse{animation:pulse 2s infinite;}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* ── MONITORES: pestañas HTTP / SSL ── */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.subtab{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:none;background:none;color:var(--text2);font-size:13.5px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.subtab:hover{color:var(--text);}
.subtab.active{color:var(--accent);border-bottom-color:var(--accent);}
.subtab .tab-count{font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;background:var(--bg3);color:var(--text2);}
.subtab.active .tab-count{background:var(--accent-soft);color:var(--accent);}
.subtab .tab-count.crit{background:var(--crit-soft);color:var(--crit);}

/* Indicadores por tipo: compactos, altura fija */
.mon-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px;}
.mon-tile{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;height:56px;display:flex;flex-direction:column;justify-content:center;gap:1px;}
.mon-tile .mt-num{font-size:19px;font-weight:800;line-height:1.1;color:var(--text);font-variant-numeric:tabular-nums;}
.mon-tile .mt-num.ok{color:var(--ok);}.mon-tile .mt-num.warn{color:var(--warn);}.mon-tile .mt-num.crit{color:var(--crit);}.mon-tile .mt-num.muted{color:var(--text3);}
.mon-tile .mt-label{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Barra de herramientas: buscar + filtros */
.mon-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.mon-search{position:relative;flex:1;min-width:180px;max-width:320px;}
.mon-search input{width:100%;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 12px 0 32px;font-size:13px;color:var(--text);background:var(--input-bg);outline:none;}
.mon-search input:focus{border-color:var(--accent);background:var(--bg2);}
.mon-search .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);display:flex;}
.filter-group{display:inline-flex;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:2px;}
.filter-chip{height:28px;padding:0 11px;border:none;background:none;color:var(--text2);font-size:12.5px;font-weight:600;border-radius:6px;cursor:pointer;white-space:nowrap;}
.filter-chip:hover{color:var(--text);}
.filter-chip.active{background:var(--card-bg);color:var(--accent);box-shadow:0 1px 2px var(--shadow);}
.filter-chip .fc-n{opacity:.7;font-weight:700;}

/* Menu de acciones secundarias por fila (details/summary, accesible) */
.rowmenu{position:relative;display:inline-block;}
.rowmenu>summary{list-style:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;border:1px solid var(--border);border-radius:7px;background:var(--bg2);color:var(--text2);cursor:pointer;}
.rowmenu>summary::-webkit-details-marker{display:none;}
.rowmenu>summary:hover{background:var(--bg3);color:var(--text);}
.rowmenu[open]>summary{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.menu-pop{position:absolute;right:0;top:32px;z-index:50;min-width:170px;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px var(--shadow);padding:5px;display:flex;flex-direction:column;gap:1px;}
.menu-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:none;background:none;color:var(--text);font-size:13px;font-weight:500;text-align:left;border-radius:6px;cursor:pointer;}
.menu-item:hover{background:var(--bg3);}
.menu-item .ico{color:var(--text3);}
.menu-item.danger{color:var(--crit);}
.menu-item.danger .ico{color:var(--crit);}
.menu-sep{height:1px;background:var(--border2);margin:4px 2px;}
.btn.danger{color:var(--crit);border-color:transparent;background:var(--crit-soft);}
.btn.danger:hover{background:var(--crit);color:#fff;}

/* Chips de estado de fila (texto legible, tokens) */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap;}
.pill.ok{background:var(--ok-soft);color:var(--ok);}
.pill.crit{background:var(--crit-soft);color:var(--crit);}
.pill.warn{background:var(--warn-soft);color:var(--warn);}
.pill.muted{background:var(--bg3);color:var(--text3);}
.pill.paused{background:var(--bg3);color:var(--text2);}

/* Tarjeta de certificado SSL */
.cert-list{display:flex;flex-direction:column;gap:8px;}
.cert-card{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:0 var(--radius) var(--radius) 0;padding:10px 14px;}
.cert-card.st-expired{border-left-color:var(--crit);}
.cert-card.st-warning{border-left-color:var(--warn);}
.cert-card.st-ok{border-left-color:var(--ok);}
.cert-card.st-error{border-left-color:var(--text3);}
.cert-card.st-pending{border-left-color:var(--border);}
.cert-days{flex-shrink:0;width:64px;text-align:center;}
.cert-days .cd-num{font-size:20px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
.cert-days .cd-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;margin-top:2px;}
.cert-main{flex:1;min-width:0;}
.cert-main .cm-name{font-size:13.5px;font-weight:700;color:var(--text);}
.cert-main .cm-host{font-size:12px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cert-main .cm-meta{font-size:11px;color:var(--text3);margin-top:2px;}
.cert-actions{display:flex;gap:4px;align-items:center;flex-shrink:0;}

/* Estados carga / vacio / error */
.state-block{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:32px 20px;color:var(--text3);}
.state-block .sb-ico{color:var(--text3);}
.state-block strong{color:var(--text2);font-size:14px;font-weight:700;}
.state-block span{font-size:12.5px;max-width:360px;}
.state-block.error .sb-ico{color:var(--crit);}
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:760px){
  .mon-summary{grid-template-columns:repeat(2,minmax(0,1fr));}
  .col-hide-sm{display:none;}
  .mon-search{max-width:none;}
}

/* ── ETAPA 3: incidentes, reportes, inventario ── */
/* Gutter permanente para el FAB de soporte: reserva la banda derecha en la
   que flota, asi nunca tapa filas ni acciones en ningun scroll. */
.noc-main{padding-right:76px;}
.support-fab{bottom:22px;right:22px;width:46px;height:46px;font-size:20px;}

/* Lista de incidentes */
.inc-row{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:0 var(--radius) var(--radius) 0;padding:11px 14px;cursor:pointer;}
.inc-row:hover{background:var(--bg3);}
.inc-row.sev-crit{border-left-color:var(--crit);}
.inc-row.sev-warn{border-left-color:var(--warn);}
.inc-row.sev-ok{border-left-color:var(--ok);}
.inc-row .inc-ico{flex-shrink:0;color:var(--text3);}
.inc-row.sev-crit .inc-ico{color:var(--crit);}
.inc-row.sev-warn .inc-ico{color:var(--warn);}
.inc-row .inc-main{flex:1;min-width:0;}
.inc-row .inc-title{font-size:13.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.inc-row .inc-meta{font-size:11.5px;color:var(--text3);margin-top:1px;}
.inc-row .inc-dur{flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums;}
.inc-row .inc-dur .d-num{font-size:14px;font-weight:800;}
.inc-row .inc-dur .d-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;}

/* Timeline de detalle */
.tl{border-left:2px solid var(--border);margin-left:8px;padding-left:20px;}
.tl-item{position:relative;margin-bottom:16px;}
.tl-item .tl-dot{position:absolute;left:-27px;top:2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card-bg);}
.tl-item .tl-type{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px;}
.tl-item .tl-msg{font-size:13px;color:var(--text);margin-top:2px;}
.tl-item .tl-time{font-size:11px;color:var(--text3);margin-top:2px;}

/* Reportes: tarjetas por proposito */
.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.report-card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg2);}
.report-card .rc-head{display:flex;align-items:center;gap:10px;}
.report-card .rc-ico{width:38px;height:38px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.report-card .rc-title{font-size:14px;font-weight:700;color:var(--text);}
.report-card .rc-tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--bg3);color:var(--text2);border:1px solid var(--border);text-transform:uppercase;}
.report-card .rc-desc{font-size:12.5px;color:var(--text3);line-height:1.5;flex:1;}
.report-card .rc-foot{display:flex;align-items:center;gap:8px;}
.report-card .rc-period{font-size:11px;color:var(--text3);}

/* Inventario: detalle por categorias */
.inv-detail{display:flex;flex-direction:column;gap:14px;}
.inv-cat{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.inv-cat-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg3);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);}
.inv-cat-h .ico{color:var(--text3);}
.inv-kv{display:grid;grid-template-columns:150px 1fr;gap:2px 12px;padding:10px 12px;font-size:12.5px;}
.inv-kv dt{color:var(--text3);}
.inv-kv dd{color:var(--text);font-weight:600;word-break:break-word;}
.inv-kv dd.unknown{color:var(--text3);font-weight:400;font-style:italic;}
.inv-mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--text2);background:var(--bg3);border-radius:6px;padding:8px 10px;line-height:1.6;max-height:140px;overflow:auto;}
/* Dato ausente en la tabla: se ve distinto de un valor real. */
.inv-unk{color:var(--text3);font-style:italic;}
.server-table tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.inc-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

@media(max-width:600px){
  /* Gutter derecho tambien en movil: mas angosto, pero el FAB sigue sin tapar
     filas ni acciones en ningun punto del scroll. */
  .noc-main{padding-right:52px;}
  .support-fab{bottom:calc(var(--bottomnav-h) + 8px);right:6px;width:44px;height:44px;}
  .inv-kv{grid-template-columns:1fr;}
  .inv-kv dt{margin-top:4px;}
  /* Que ninguna tabla ancha empuje el ancho de la pagina y meta contenido bajo
     el FAB. Dos estrategias segun la tabla:
     - Tablas de datos anchas (servidores, NOC, etc.): scrollean dentro de su
       panel, con columnas legibles; el cuadro queda recortado a la izquierda
       del FAB. Se excluye la mon-table para no recortar su menu contextual.
     - mon-table (monitores HTTP): en vez de scroll, deja cortar el texto de las
       celdas para entrar sola en el ancho, y asi su menu ⋯ no se recorta. */
  .noc-main table:not(.mon-table){display:block;overflow-x:auto;}
  .mon-table td,.mon-table th{white-space:normal;overflow-wrap:anywhere;}
  .filter-group{flex-wrap:wrap;}
}

/* responsive */
@media(max-width:1180px){
  .noc-grid-problemas{grid-template-columns:minmax(0,1fr) 280px;}
  .noc-grid-top{grid-template-columns:180px 1fr 240px;}
}
@media(max-width:960px){
  .sidebar{display:none;}
  .topbar .brand-mini{display:flex;}
  .topbar .view-sub{display:none;}
  .bottom-nav{display:flex;}
  .app-body{padding-bottom:var(--bottomnav-h);}
  .stats-row{grid-template-columns:repeat(2,minmax(0,1fr));}
  .noc-grid-problemas{grid-template-columns:1fr;}
  .noc-grid-top{grid-template-columns:1fr 1fr;}
  .noc-grid-mid{grid-template-columns:1fr;}
  .actions-grid{grid-template-columns:repeat(3,1fr);}
  .support-fab{bottom:calc(var(--bottomnav-h) + 12px);}
  .support-panel{bottom:calc(var(--bottomnav-h) + 8px);}
}
@media(max-width:600px){
  /* El gutter derecho (52px) va en el shorthand para que no lo pise: reserva la
     banda del FAB en movil. El padding-bottom deja aire sobre la barra inferior. */
  .noc-main{padding:12px 52px 84px 12px;gap:12px;}
  .topbar{padding:0 12px;gap:8px;}
  .topbar .view-title{display:none;}
  .header-search{max-width:none;margin-left:0;}
  .header-actions .avatar{display:none;}
  .stat-card{height:60px;padding:8px 12px;gap:10px;}
  .stat-num{font-size:20px;}
  .stat-extra{display:none;}
  .server-table th,.server-table td{padding:8px 6px;}
  .row-actions{flex-direction:column;}

<body>
<div id="app"></div>
<button class="support-fab" id="support-fab" style="display:none" onclick="toggleSupport()" title="Soporte">🎧</button>

<script src="/i18n.js"></script>
<script>
// ── DARK MODE ──
function isDark() { return document.documentElement.classList.contains('dark'); }
function toggleDarkMode() {
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('se_dark', isDark() ? '1' : '0');
  render();
}
if (localStorage.getItem('se_dark') === '1') document.documentElement.classList.add('dark');

// ── STATE ──
const API = window.location.origin;
let token = localStorage.getItem('se_token');
let machines = [];
let agentInfo = { version: null, url: null };
let filter = '';
let statusFilter = 'all';
let activeModal = null;
let uptimeDays = 7;
let metricsHours = 24;
let refreshInterval = null;
let dismissedUpdate = false;
let activeNav = 'noc';

// ── API ──
async function api(path, opts={}) {
  const headers = {'Content-Type':'application/json',...opts.headers};
  if (token) headers.Authorization = 'Bearer ' + token;
  try {
    const r = await fetch(API + path, {...opts, headers});
    const d = await r.json();
    if (r.status === 401 && d && d.code === 'SESSION_REVOKED' && token) {
      // Cambio de contraseña o "cerrar todas las sesiones": se vuelve al login.
      sessionStorage.setItem('se_aviso_login', 'La sesion se cerro porque cambio la contraseña o se cerraron todas las sesiones.');
      logout();
    }
    return {ok: r.ok, status: r.status, data: d};
  } catch(e) {
    return {ok:false, status:0, data:{error:e.message}};
  }
}

// ── UTILS ──
function timeSince(ts) {
  if (!ts) return 'Nunca';
  const s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s/60) + 'min';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  return Math.floor(s/86400) + 'd';
}

function colorPct(pct, warn=70, crit=90) {
  if (pct >= crit) return '#F44336';
  if (pct >= warn) return '#FF9800';
  return '#4CAF50';
}

function classPct(pct, warn=70, crit=90) {
  if (pct >= crit) return 'crit';
  if (pct >= warn) return 'warn';
  return 'ok';
}

function avgArr(arr) {
  if (!arr || arr.length === 0) return 0;
  return arr.reduce((a,b)=>a+b,0)/arr.length;
}

function getFiltered() {
  let list = machines;
  if (statusFilter === 'online') list = list.filter(m=>m.is_online);
  if (statusFilter === 'offline') list = list.filter(m=>!m.is_online);
  if (filter) {
    const f = filter.toLowerCase();
    list = list.filter(m =>
      (m.machine_name||'').toLowerCase().includes(f) ||
      (m.public_ip||'').includes(f) ||
      (m.local_ip||'').toLowerCase().includes(f) ||
      (m.grupo||'').toLowerCase().includes(f) ||
      (m.notes||'').toLowerCase().includes(f)
    );
  }
  return list;
}

// ── LOGIN ──
function renderLogin(err) {
  // Aviso de sesion revocada (lo deja api() antes de hacer logout)
  if (!err && sessionStorage.getItem('se_aviso_login')) { err = sessionStorage.getItem('se_aviso_login'); sessionStorage.removeItem('se_aviso_login'); }
  document.getElementById('app').innerHTML = `
  <div class="login-screen">
    <div class="login-card">
      <div class="login-logo"><span class="eye-icon">👁️</span><h1>ServerEyes</h1></div>
      <p class="login-sub">NOC Dashboard</p>
      <input type="email" id="le" placeholder="${t('login_email')}" autocomplete="username"/>
      <input type="password" id="lp" placeholder="${t('login_password')}" autocomplete="current-password"/>
      ${err?`<p class="login-err">${err}</p>`:''}
      <button class="login-btn" onclick="doLogin()">${t('login_btn')}</button>
    </div>
  </div>`;
  const le = document.getElementById('le');
  const lp = document.getElementById('lp');
  le.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  lp.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

async function doLogin() {
  try {
    const le = document.getElementById('le');
    const lp = document.getElementById('lp');
    if (!le || !lp) return;
    const email = le.value.trim();
    const pass = lp.value;
    if (!email||!pass) { renderLogin('Completa todos los campos'); return; }
    const r = await api('/api/auth/login', {method:'POST', body:JSON.stringify({email, password:pass})});
    if (r.ok && r.data.token) {
      token = r.data.token;
      localStorage.setItem('se_token', token);
      render();
      startDashboard();
    } else {
      renderLogin(r.data?.error || 'Error de autenticacion');
    }
  } catch(e) {
    renderLogin('Error: ' + e.message);
  }
}

function logout() {
  token = null;
  localStorage.removeItem('se_token');
  if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
  activeModal = null;
  machines = [];
  renderLogin();
}

// ── RENDER MAIN ──
function pauseRefresh() { if(refreshInterval){clearInterval(refreshInterval);refreshInterval=null;} }
function resumeRefresh() { if(!refreshInterval){refreshInterval=setInterval(()=>{loadMachines();loadUrlMonitors(true);},10000);} }
// render() reconstruye toda la pagina con innerHTML, asi que borra cualquier
// campo a medio escribir. El refresco automatico corre cada 10s: si estabas
// tipeando una URL o un dominio SSL, se te vaciaba en la cara.
let renderPendiente = false;

function editandoAlgo() {
  const el = document.activeElement;
  if (!el) return false;
  return el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable;
}

// Los refrescos automaticos se posponen mientras haya un campo con foco.
function renderSiNoEstasEscribiendo() {
  if (editandoAlgo()) { renderPendiente = true; return; }
  render();
}

// Al salir del campo, si quedo un refresco pendiente lo aplicamos.
document.addEventListener('focusout', () => {
  setTimeout(() => {
    if (renderPendiente && !editandoAlgo()) { renderPendiente = false; render(); }
  }, 200);
});

// Red de seguridad: si igual hay que redibujar (por ejemplo porque el usuario
// hizo click en un boton), conservamos lo tipeado y donde estaba el cursor.
function capturarCampos() {
  const estado = {};
  document.querySelectorAll('#app input[id], #app textarea[id], #app select[id]').forEach(el => {
    if (el.type === 'hidden') return;
    estado[el.id] = {
      valor: el.value,
      foco: el === document.activeElement,
      inicio: el.selectionStart,
      fin: el.selectionEnd
    };
  });
  return estado;
}
function restaurarCampos(estado) {
  for (const id of Object.keys(estado)) {
    const c = estado[id];
    const el = document.getElementById(id);
    // Solo reponemos si el redibujado lo dejo vacio: no pisamos valores nuevos.
    if (!el || !c.valor || el.value) continue;
    el.value = c.valor;
    if (c.foco) {
      el.focus();
      try { el.setSelectionRange(c.inicio, c.fin); } catch (e) {}
    }
  }
}

// Reemplazar todo el HTML cada 10 segundos hacia parpadear la pagina, perder
// la posicion del scroll y reiniciar el mapa. En vez de eso recorremos el arbol
// y tocamos solo lo que cambio: los nodos que quedan igual ni se enteran.
function sincronizarAtributos(viejo, nuevo) {
  for (const a of Array.from(nuevo.attributes)) {
    if (viejo.getAttribute(a.name) !== a.value) viejo.setAttribute(a.name, a.value);
  }
  for (const a of Array.from(viejo.attributes)) {
    if (!nuevo.hasAttribute(a.name)) viejo.removeAttribute(a.name);
  }
  // El atributo no refleja lo que el usuario tipeo, asi que los campos se
  // sincronizan aparte y solo si no los esta usando en este momento.
  const tag = viejo.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
    if (document.activeElement !== viejo) {
      if (viejo.type === 'checkbox' || viejo.type === 'radio') {
        const marcado = nuevo.hasAttribute('checked');
        if (viejo.checked !== marcado) viejo.checked = marcado;
      } else {
        const v = nuevo.getAttribute('value');
        if (v !== null && viejo.value !== v) viejo.value = v;
      }
    }
  }
}

function morfar(actual, nuevo) {
  const viejos = Array.from(actual.childNodes);
  const nuevos = Array.from(nuevo.childNodes);
  const total = Math.max(viejos.length, nuevos.length);
  for (let i = 0; i < total; i++) {
    const a = viejos[i], b = nuevos[i];
    if (!b) { if (a) actual.removeChild(a); continue; }
    if (!a) { actual.appendChild(b.cloneNode(true)); continue; }
    if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) {
      actual.replaceChild(b.cloneNode(true), a);
      continue;
    }
    if (a.nodeType === 3 || a.nodeType === 8) {
      if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
      continue;
    }
    if (a.nodeType === 1) {
      sincronizarAtributos(a, b);
      // Contenedores que pinta otra funcion: buildLayout los genera vacios o con
      // un "Cargando...", asi que morfearlos les borraria el contenido real.
      if (a.id === 'nocMap' || a.id === 'ssl-list' || a.id === 'history-list' || a.id === 'history-list-client' || a.id === 'inv-list') continue;
      morfar(a, b);
    }
  }
}

let _modalOpener = null;
function render() {
  if (notifDropdownOpen) return;
  const el = document.getElementById('app');
  if (!token) { renderLogin(); return; }
  // Al pasar de "sin modal" a "con modal", recordamos quien tenia el foco para
  // devolverselo al cerrar (accesibilidad de dialogos).
  if (activeModal && !_modalOpener && document.activeElement && document.activeElement !== document.body) _modalOpener = document.activeElement;
  const campos = capturarCampos();
  const molde = document.createElement('div');
  molde.innerHTML = buildLayout();
  morfar(el, molde);
  restaurarCampos(campos);
  attachEvents();
  if (activeNav === 'noc') {
    setTimeout(initInlineMap, 120);
  }
  if (activeNav === 'ajustes') {
    setTimeout(loadSmtpConfig, 100);
    setTimeout(loadSessionDur, 150);
  }
  if (activeNav === 'urls') {
    setTimeout(loadSSLMonitors, 100);
  }
  if (activeNav === 'inventario') {
    setTimeout(loadInventario, 100);
  }
  if (activeNav === 'incidentes' && !incidentsLoaded) {
    incidentsLoaded = true;
    loadIncidents();
  }
}

// Una maquina con una version MAS NUEVA que la publicada no esta
// desactualizada. Comparando con !== se la marcaba igual, y encima decia que se
// iba a actualizar sola: el server compara bien y nunca la baja de version.
function versionAtrasada(actual, publicada) {
  if (!actual || !publicada) return false;
  const a = String(actual).split('.').map(Number);
  const b = String(publicada).split('.').map(Number);
  for (let i = 0; i < 3; i++) {
    if ((b[i] || 0) > (a[i] || 0)) return true;
    if ((b[i] || 0) < (a[i] || 0)) return false;
  }
  return false;
}

function ico(name, cls, label) {
  const attrs = label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"';
  return `<svg class="ico ${cls||''}" viewBox="0 0 24 24" ${attrs}>${label?`<title>${label}</title>`:''}${ICONS[name]||''}</svg>`;
}

const NAV_TABS = () => [
  {id:'noc',        icon:'noc',      label:t('nav_noc')},
  {id:'servidores', icon:'server',   label:t('nav_servers')},
  {id:'alertas',    icon:'bell',     label:t('nav_alerts')},
  {id:'urls',       icon:'globe',    label:'URLs'},
  {id:'incidentes', icon:'siren',    label:'Incidentes'},
  {id:'reportes',   icon:'file',     label:t('nav_reports')},
  {id:'inventario', icon:'box',      label:'Inventario'},
  {id:'ajustes',    icon:'settings', label:t('nav_settings')},
];
const VIEW_TITLES = { noc:'NOC', servidores:'Servidores', alertas:'Alertas', urls:'Monitores', incidentes:'Incidentes', reportes:'Reportes', inventario:'Inventario', ajustes:'Ajustes' };

function buildLayout() {
  const filtered = getFiltered();
  const online  = machines.filter(m=>m.is_online).length;
  const offline = machines.length - online;
  const alerts = machines.filter(m=>!m.is_online);
  const thresholdAlerts = getThresholdAlerts();
  const problemCount = alerts.length + thresholdAlerts.length;

  const updateOutdated = machines.filter(m=>versionAtrasada(m.agent_version, agentInfo.version));
  let updateBanner = '';
  if (!dismissedUpdate && updateOutdated.length>0) {
    updateBanner = `<div class="update-banner">
      <div><div class="ub-msg">${ico('warn','sm')} ${updateOutdated.length} agente(s) desactualizado(s)</div>
      <div class="ub-sub">${updateOutdated.map(m=>m.machine_name+' (v'+m.agent_version+')').join(', ')} — última: v${agentInfo.version}</div></div>
      <button class="ub-dismiss" onclick="dismissedUpdate=true;render()" aria-label="Cerrar aviso">✕</button>
    </div>`;
  }

  return `
  <div class="app-shell">
    ${buildSidebar(problemCount)}
    <div class="app-body">
      ${buildHeader()}
      <main class="noc-main" id="main">
        ${updateBanner}
        ${buildStatsRow(online, offline, problemCount)}
        ${activeNav==='noc' ? buildNocView(alerts, thresholdAlerts, filtered) : ''}
        ${activeNav==='servidores' ? buildServersView(filtered) : ''}
        ${activeNav==='alertas' ? buildAlertasView(alerts) : ''}
        ${activeNav==='urls' ? buildUrlsView() : ''}
        ${activeNav==='incidentes' ? buildIncidentesView() : ''}
        ${activeNav==='reportes' ? buildReportesView() : ''}
        ${activeNav==='inventario' ? buildInventarioView() : ''}
        ${activeNav==='ajustes' ? buildAjustesView() : ''}
      </main>
    </div>
    ${buildBottomNav(problemCount || '')}
    ${activeModal ? buildModal() : ''}
  </div>`;
}

  if (!userPlan) return '';
  const p = (userPlan.plan||'free').toUpperCase();
  const lim = userPlan.plan==='pro'||userPlan.plan==='enterprise' ? '∞' : userPlan.max_machines;
  return `<span class="plan" title="Plan ${p}: ${userPlan.current_machines} de ${lim} máquinas">${p} · ${userPlan.current_machines}/${lim}</span>`;

}

    <div class="header-search">
      <span class="search-icon">${ico('search','sm')}</span>

// Estado vacio honesto del mapa: sin ubicaciones no hay nada que mostrar.
function mapaVacio() {
  return `<div class="map-empty">${ico('pin','lg')}<strong>Sin ubicaciones</strong><span>Ninguna máquina tiene geolocalización. Se completa sola con la IP pública o desde Editar → Ubicación.</span></div>`;

function buildNocView(alerts, thresholdAlerts, filtered) {
  const urlsCaidas = (typeof urlMonitors !== 'undefined' && Array.isArray(urlMonitors)) ? urlMonitors.filter(u=>u.is_active!==false && u.is_up===false) : [];
  const conUbicacion = machines.filter(m=>m.geo_lat&&m.geo_lon).length;
  const problemas = [
    ...alerts.map(m=>({crit:true, ico:'wifioff', name:m.machine_name, detail:`Offline hace ${timeSince(m.last_heartbeat)}${m.public_ip?' · '+m.public_ip:''}`, onclick:`openMachineDetail(${m.id})`})),
    ...thresholdAlerts.map(a=>({crit:a.type==='cpu', ico:a.type==='cpu'?'cpu':a.type==='disk'?'layers':'warn', name:a.machine.machine_name, detail:a.msg, onclick:`openMachineDetail(${a.machine.id})`})),
    ...urlsCaidas.map(u=>({crit:true, ico:'globe', name:u.name||u.url, detail:`URL caída${u.last_error?' · '+u.last_error:''}`, onclick:`activeNav='urls';render()`}))
  ];
  const resumen = `<div class="prob-summary">
    <span class="prob-chip ${alerts.length?'crit':'ok'}">${ico('wifioff','sm')} ${alerts.length} offline</span>
    <span class="prob-chip ${thresholdAlerts.length?'warn':'ok'}">${ico('warn','sm')} ${thresholdAlerts.length} umbral${thresholdAlerts.length===1?'':'es'}</span>
    <span class="prob-chip ${urlsCaidas.length?'crit':''}" title="Monitores HTTP caídos. Solo cuenta los que ya fueron chequeados.">${ico('globe','sm')} ${urlsCaidas.length} URL${urlsCaidas.length===1?'':'s'} caída${urlsCaidas.length===1?'':'s'}</span>
  </div>`;

  // Salud por grupo solo cuando hay mas de un grupo
  const groups = {};
  filtered.forEach(m => { const g = m.grupo || 'Sin grupo'; if (!groups[g]) groups[g] = { total: 0, online: 0 }; groups[g].total++; if (m.is_online) groups[g].online++; });
  const gNames = Object.keys(groups).sort();
  const grupos = gNames.length > 1 ? `<div class="prob-summary" style="margin:0 0 10px" aria-label="Disponibilidad por grupo">
      ${gNames.map(g=>{ const d=groups[g]; const pct=Math.round(d.online/d.total*100); return `<span class="prob-chip ${pct>=80?'ok':pct>=50?'warn':'crit'}" title="${g}: ${d.online} de ${d.total} online">${g} · ${d.online}/${d.total}</span>`; }).join('')}
    </div>` : '';

  return `
  <div class="noc-grid-problemas">
    <!-- Problemas primero -->
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title"><span class="dot" style="background:${problemas.length?'var(--crit)':'var(--ok)'}"></span>Problemas activos<button class="help-btn" onclick="event.stopPropagation();showHelp('alerts',this)" aria-label="Ayuda sobre problemas">?</button></div>
        <div class="spacer"></div>
        <button class="btn sm" onclick="activeNav='alertas';render()">Ver alertas</button>
      </div>
      ${resumen}
      <div class="alert-list">
        ${problemas.length===0
          ? `<div class="no-alerts">${ico('check')} Sin problemas activos <span class="sub">· ${machines.filter(m=>m.is_online).length}/${machines.length} servidores online</span></div>`
          : problemas.map(p=>`<div class="alert-item ${p.crit?'':'warn'}" onclick="${p.onclick}" role="button" tabindex="0" onkeydown="if(event.key==='Enter'){${p.onclick}}">
              <span class="alert-ico">${ico(p.ico)}</span>
              <div class="alert-body"><div class="alert-name">${p.name}</div><div class="alert-time">${p.detail}</div></div>
            </div>`).join('')}
      </div>
    </div>
    <!-- Mapa secundario -->
    <div class="panel map-panel">
      <div class="panel-head">
        <div class="panel-title"><span class="dot" style="background:var(--accent)"></span>Mapa</div>
        <div class="spacer"></div>
        <span class="view-sub">${conUbicacion}/${machines.length} con ubicación</span>
      </div>
      <div id="nocMap">${conUbicacion===0?mapaVacio():''}</div>
    </div>
  </div>

  <!-- Tabla amplia -->
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title"><span class="dot" style="background:var(--accent)"></span>Servidores<button class="help-btn" onclick="event.stopPropagation();showHelp('servers',this)" aria-label="Ayuda sobre servidores">?</button></div>
      <span class="view-sub">${filtered.length===machines.length?`${machines.length} en total`:`${filtered.length} de ${machines.length}`}</span>
      <div class="spacer"></div>
      <button class="btn sm" onclick="exportCSV()" title="Exportar CSV">${ico('download','sm')}CSV</button>
      <button class="btn sm" onclick="exportPDF()" title="Informe PDF">${ico('file','sm')}Informe</button>
      <button class="btn sm" onclick="openCmdHistory()" title="Historial de comandos">${ico('terminal','sm')}Comandos</button>
      ${filtered.length>12?`<button class="btn sm primary" onclick="activeNav='servidores';render()">Ver todos</button>`:''}
    </div>
    ${grupos}
    <div class="table-wrap">${buildServerTable(filtered.slice(0,12))}</div>
  </div>`;
}

function buildServerTable(list) {
  if (list.length===0) return '<p class="empty-state">Sin servidores que coincidan</p>';
  const met = (pct, warn, crit, txt) => pct==null ? '<span class="val-num muted">—</span>'
    : `<span class="metric"><span class="val-num ${classPct(pct,warn,crit)}">${txt||pct+'%'}</span><span class="mini-bar"><span class="mini-bar-fg" style="display:block;width:${Math.min(pct,100)}%;background:${colorPct(pct,warn,crit)}"></span></span></span>`;
  return `<table class="server-table">
    <thead><tr>
      <th style="width:28px"><span class="sr-only">Estado</span></th><th>Nombre</th><th class="num">CPU</th><th class="num">RAM</th><th class="num">Disco</th><th class="num">Ping</th><th class="num">Mbps</th><th>Estado</th><th>Último latido</th><th style="width:1%"><span class="sr-only">Acciones</span></th>
    </tr></thead>
    <tbody>
    ${list.map(m=>{
      const cpu = m.cpu_usage!=null ? Math.round(m.cpu_usage) : null;
      const ramPct = m.ram_usage&&m.ram_total ? Math.round(m.ram_usage/m.ram_total*100) : null;
      const disks = m.disks||[];
      const diskPct = disks.length>0 ? Math.max(...disks.map(d=>d.total>0?Math.round(d.used/d.total*100):0)) : (m.disk_usage&&m.disk_total?Math.round(m.disk_usage/m.disk_total*100):null);
      const ping = m.is_online && m.ping_ms ? m.ping_ms : null;
      return `<tr onclick="openMachineDetail(${m.id})" tabindex="0" onkeydown="if(event.key==='Enter')openMachineDetail(${m.id})">
        <td><span class="status-dot ${m.is_online?'on':'off'}" role="img" aria-label="${m.is_online?'Online':'Offline'}"></span></td>
        <td>
          <div class="srv-name">${m.machine_name}</div>
          <div class="srv-meta">${[m.grupo,m.os_info?m.os_info.split(' ')[0]:'',m.public_ip].filter(Boolean).join(' · ')}</div>
        </td>
        <td class="num">${met(cpu,70,90)}</td>
        <td class="num">${met(ramPct,75,90, ramPct!=null&&m.ram_total?`${ramPct}% <span class="val-num muted" style="font-size:11px">${m.ram_usage}/${m.ram_total} GB</span>`:null)}</td>
        <td class="num">${met(diskPct,80,92)}</td>
        <td class="num">${ping!=null?`<span class="val-num ${classPct(ping,50,150)}">${ping} ms</span>`:'<span class="val-num muted">—</span>'}</td>
        <td class="num">${m.download_mbps?`<span class="val-num">${m.download_mbps}</span>`:'<span class="val-num muted">—</span>'}</td>
        <td><span class="srv-badge ${m.is_online?'on':'off'}">${m.is_online?'ONLINE':'OFFLINE'}</span></td>
        <td style="color:var(--text3);font-size:12px;white-space:nowrap">${timeSince(m.last_heartbeat)}</td>
        <td onclick="event.stopPropagation()"><div class="row-actions">
          <button class="btn sm" onclick="openUptime(${m.id})" aria-label="Uptime de ${m.machine_name}">Uptime</button>
          <button class="btn sm" onclick="openEditModal(${m.id})" aria-label="Editar ${m.machine_name}">Editar</button>
        </div></td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;
}

        <td>${ramPct!=null?`<span class="val-num ${classPct(ramPct,75,90)}">${ramPct}%</span>`:'—'}</td>

          </div>
        </td>

function getThresholdAlerts() {
  const alerts = [];
  machines.forEach(m => {
    if (!m.is_online) return;
    if (m.alert_cpu && m.cpu_usage != null && m.cpu_usage >= m.alert_cpu)
      alerts.push({ machine: m, type: 'cpu', icon: '🔥', color: '#F44336', msg: `CPU al ${m.cpu_usage}% (umbral: ${m.alert_cpu}%)` });
    if (m.alert_ram && m.ram_usage != null && m.ram_total) {
      const ramPct = Math.round(m.ram_usage / m.ram_total * 100);
      if (ramPct >= m.alert_ram)
        alerts.push({ machine: m, type: 'ram', icon: '💾', color: '#FF9800', msg: `RAM al ${ramPct}% (umbral: ${m.alert_ram}%)` });
    }
    if (m.alert_disk && m.disk_usage != null && m.disk_total) {
      const diskPct = Math.round(m.disk_usage / m.disk_total * 100);
      if (diskPct >= m.alert_disk)
        alerts.push({ machine: m, type: 'disk', icon: '💿', color: '#FF9800', msg: `Disco al ${diskPct}% (umbral: ${m.alert_disk}%)` });
    }
    if (m.alert_ping && m.ping_ms && m.ping_ms >= m.alert_ping)
      alerts.push({ machine: m, type: 'ping', icon: '📡', color: '#FF9800', msg: `Ping ${m.ping_ms}ms (umbral: ${m.alert_ping}ms)` });
  });
  return alerts;
}

        </div>`).join('')}</div>
    </div>`:''}
  </div>`;
}

let reportesFiltro = 'todos';
function setReportesFiltro(f){ reportesFiltro = f; render(); }

function buildReportesView() {
  // proposito: agrupa por para-que-sirve. formato: lo que produce el backend.

    { grupo:'parque', tag:'CSV', icon:'server', titulo:'Servidores (CSV)',
      desc:'Planilla con todas las máquinas y sus datos actuales, para abrir en Excel o cruzar con otra información.',
      accion:`onclick="exportCSV()"`, boton:'Descargar CSV' },
    { grupo:'parque', tag:'PDF', icon:'file', titulo:'Informe del parque (PDF)',
      desc:'Reporte presentable con el estado de todos los servidores en este momento.',
      accion:`onclick="exportPDF()"`, boton:'Generar PDF' },
    { grupo:'incidentes', tag:'PDF', icon:'siren', titulo:'Incidentes (PDF)',

      accion:`onclick="exportIncidentesPDF()"`, boton:'Generar PDF' },
    { grupo:'inventario', tag:'CSV', icon:'box', titulo:'Inventario del parque (CSV)',
      desc:'Relevamiento de hardware, red y proxy de cada máquina. Solo incluye las máquinas ya relevadas.',
      accion:`onclick="bajarInventario(this)"`, boton:'Descargar CSV' },
  ];
  const grupos = [
    { id:'todos', label:'Todos' },
    { id:'parque', label:'Estado del parque' },
    { id:'incidentes', label:'Incidentes' },
    { id:'inventario', label:'Inventario' },
  ];
  const visibles = reportesFiltro==='todos' ? reportes : reportes.filter(r=>r.grupo===reportesFiltro);
  const cuenta = g => g==='todos' ? reportes.length : reportes.filter(r=>r.grupo===g).length;

  return `<div class="panel">
    <div class="panel-head">
      <div class="panel-title" style="margin:0"><span class="dot" style="background:var(--accent)"></span>Reportes<button class="help-btn" onclick="event.stopPropagation();showHelp('reports',this)" aria-label="Ayuda sobre reportes">?</button></div>

    <div class="filter-group" role="tablist" aria-label="Filtrar reportes por propósito">
      ${grupos.map(g=>`<button class="filter-chip ${reportesFiltro===g.id?'active':''}" role="tab" aria-selected="${reportesFiltro===g.id}" onclick="setReportesFiltro('${g.id}')">${g.label} <span class="fc-n">${cuenta(g.id)}</span></button>`).join('')}
    </div>
    <div class="report-grid">
      ${visibles.map(r=>`<div class="report-card">
        <div class="rc-head">
          <div class="rc-ico">${ico(r.icon)}</div>
          <div style="min-width:0"><div class="rc-title">${r.titulo}</div><span class="rc-tag">${r.tag}</span></div>
        </div>
        <div class="rc-desc">${r.desc}</div>
        <div class="rc-foot">
          <span class="rc-period">${ico('refresh','sm')} Estado actual</span>
          <div class="spacer" style="flex:1"></div>
          <button class="btn primary sm" ${r.accion} aria-label="${r.boton}: ${r.titulo}">${ico('download','sm')}${r.boton}</button>

function addCompRule() {
  const cont = document.getElementById('compound-rules');
  if (!cont) return;
  const i = cont.children.length;
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:6px;margin-bottom:6px;align-items:center';
  div.innerHTML = `<select class="modal-input comp-metric" style="width:80px;font-size:12px;padding:6px" data-i="${i}"><option value="cpu">CPU</option><option value="ram">RAM</option><option value="ping">Ping</option></select><span style="color:#888;font-size:12px">>=</span><input class="modal-input comp-threshold" type="number" placeholder="90" style="width:70px;font-size:12px;padding:6px" data-i="${i}"/><span style="color:#888;font-size:12px">%</span><button style="background:none;border:none;color:#ff5252;cursor:pointer;font-size:14px" onclick="this.parentElement.remove()">✕</button>`;
  cont.appendChild(div);
}
function removeCompRule(i) {
  const cont = document.getElementById('compound-rules');
  if (cont && cont.children[i]) cont.children[i].remove();
}
function getCompoundAlert() {
  const metrics = document.querySelectorAll('.comp-metric');
  const thresholds = document.querySelectorAll('.comp-threshold');
  const conditions = [];
  metrics.forEach((sel, i) => {
    const th = thresholds[i]?.value;
    if (th) conditions.push({ metric: sel.value, threshold: parseInt(th) });
  });
  if (conditions.length === 0) return null;
  return { conditions, duration: parseInt(document.getElementById('ed-comp-duration')?.value) || 5 };
}

// ── INVENTARIO ──
//
// Relevamiento del parque de un cliente: que maquina es, que tiene adentro y
// como esta conectada. Lo junta el agente una vez por dia y lo manda con el
// latido; aca solo se muestra y se baja.
let inventario = [];
let _ultimoInvJson = '';
let invDetailId = null;              // maquina abierta en detalle (o null: tabla)
const INV_STALE_DIAS = 3;           // el agente releva 1 vez/dia: +3 dias = viejo

function buildInventarioView() {
  const total = inventario.length;
  return `<div class="panel">
    <div class="panel-head">
      <div class="panel-title" style="margin:0"><span class="dot" style="background:var(--accent)"></span>Inventario del parque</div>
      <div class="spacer"></div>
      <div class="header-search" style="flex:0 1 300px;margin-left:0">
        <span class="search-icon">${ico('search','sm')}</span><input id="inv-search" type="search" placeholder="Buscar máquina, IP, serie…" oninput="renderInventario()" aria-label="Buscar en el inventario">
      </div>
      <button class="btn sm" onclick="bajarInventario(this)" aria-label="Descargar planilla del inventario en CSV">${ico('download','sm')}Descargar CSV</button>
    </div>
    <p style="font-size:12px;color:var(--text3);line-height:1.5;margin:-4px 0 12px">
      Cada agente releva su máquina una vez por día: hardware, red, proxy y archivo hosts.
      Los datos que faltan se muestran distinto de los relevados; un relevamiento de hace más de ${INV_STALE_DIAS} días se marca como desactualizado.
    </p>
    <div id="inv-list"><div class="state-block"><div class="spinner"></div><span>Cargando inventario…</span></div></div>
  </div>`;
}

async function loadInventario() {
  const el = document.getElementById('inv-list');
  if (!el) return;
  const r = await api('/api/machines/inventory');
  if (!r.ok) { pintar(el, `<div class="state-block error">${ico('warn','lg')}<strong>No se pudo leer el inventario</strong><span>Reintentá en unos segundos.</span></div>`); return; }
  inventario = Array.isArray(r.data) ? r.data : [];
  // Igual que la lista de certificados: solo repintar si algo cambio, para que
  // el refresco automatico no haga parpadear la pantalla.
  const json = JSON.stringify(inventario);
  if (json === _ultimoInvJson) return;
  _ultimoInvJson = json;
  renderInventario();
}

function invEstado(m){
  if (m.inventory && m.inventory.no_relevado) return 'noaplica';
  if (m.inventory) return 'relevada';
  return 'sinrelevar';
}
// Dias desde el relevamiento; null si no hay fecha. Sirve para marcar lo viejo.
function invDias(m){
  if (!m.inventory_at) return null;
  return Math.floor((Date.now() - new Date(m.inventory_at).getTime())/86400000);
}
function openInvDetail(id){ invDetailId = id; renderInventario(); }
function cerrarInvDetail(){ invDetailId = null; renderInventario(); }

function renderInventario() {
  const el = document.getElementById('inv-list');
  if (!el) return;

  if (invDetailId != null) {
    const m = inventario.find(x => x.id === invDetailId);
    if (m) { pintar(el, invDetalle(m)); return; }
    invDetailId = null; // desaparecio: caer a la tabla
  }

  if (inventario.length === 0) {
    pintar(el, `<div class="state-block">${ico('box','lg')}<strong>Sin máquinas todavía</strong><span>Cuando vincules servidores y sus agentes releven, el inventario aparece acá.</span></div>`);
    return;
  }

  const relevadas = inventario.filter(m => invEstado(m)==='relevada');
  const noAplican = inventario.filter(m => invEstado(m)==='noaplica');
  const sinDatos  = inventario.filter(m => invEstado(m)==='sinrelevar');

  const q = (document.getElementById('inv-search')?.value || '').trim().toLowerCase();
  const coincide = m => {
    if (!q) return true;
    const i = m.inventory || {};
    return [m.machine_name, i.hostname, m.public_ip, i.ip_interna, i.serie, i.modelo, i.cpu, i.so]
      .filter(Boolean).some(v => String(v).toLowerCase().includes(q));
  };
  const filas = inventario.filter(coincide);

  const tiles = `<div class="mon-summary">
    <div class="mon-tile"><div class="mt-num ok">${relevadas.length}</div><div class="mt-label">Relevadas</div></div>
    <div class="mon-tile"><div class="mt-num muted">${noAplican.length}</div><div class="mt-label">No se relevan</div></div>
    <div class="mon-tile"><div class="mt-num ${sinDatos.length?'warn':'muted'}">${sinDatos.length}</div><div class="mt-label">Sin relevar</div></div>
    <div class="mon-tile"><div class="mt-num muted">${inventario.length}</div><div class="mt-label">Total</div></div>
  </div>`;

  if (filas.length === 0) {
    pintar(el, tiles + `<div class="empty-state">Ninguna máquina coincide con “${escHtml(q)}”.</div>`);
    return;
  }

  const filaHtml = m => {
    const est = invEstado(m);
    const i = m.inventory || {};
    const dias = invDias(m);
    const stale = est==='relevada' && dias != null && dias > INV_STALE_DIAS;
    const online = `<span class="dot" style="width:8px;height:8px;border-radius:50%;display:inline-block;background:${m.is_online?'var(--ok)':'var(--text3)'}"></span>`;
    if (est !== 'relevada') {
      const pill = est==='noaplica'
        ? `<span class="pill muted">No se releva</span>`
        : `<span class="pill warn">Sin relevar</span>`;
      return `<tr onclick="openInvDetail(${m.id})" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openInvDetail(${m.id})}">
        <td>${online} ${escHtml(m.machine_name || i.hostname || '')}</td>
        <td colspan="4" style="color:var(--text3)">${pill}${est==='noaplica' && i.motivo ? ' '+escHtml(i.motivo) : est==='sinrelevar' ? ' El agente aún no envió datos' : ''}</td>
        <td class="inv-unk">—</td>
      </tr>`;
    }
    const ram = i.ram_gb ? i.ram_gb+' GB'+(i.ram_tipo?' '+i.ram_tipo:'') : '';
    const amp = i.ram_ampliable===true ? `<span style="color:var(--ok);font-weight:700">Sí</span>`
      : i.ram_ampliable===false ? `<span style="color:var(--warn);font-weight:700">No</span>`
      : `<span class="inv-unk">—</span>`;
    const cel = v => v ? escHtml(String(v)) : `<span class="inv-unk">—</span>`;
    return `<tr onclick="openInvDetail(${m.id})" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openInvDetail(${m.id})}" aria-label="Ver inventario de ${escHtml(m.machine_name||'')}">
      <td>${online} ${escHtml(m.machine_name || i.hostname || '')}</td>
      <td>${cel([i.so, i.so_arch].filter(Boolean).join(' '))}</td>
      <td>${cel(i.cpu)}</td>
      <td>${cel(ram)} ${amp!=='' && ram? '':''}</td>
      <td>${cel(m.public_ip)}</td>
      <td>${stale ? `<span class="pill warn" title="Relevado hace ${dias} días">hace ${dias} d</span>` : (dias!=null ? `<span style="color:var(--text3)">hace ${dias===0?'hoy':dias+' d'}</span>` : `<span class="inv-unk">—</span>`)}</td>
    </tr>`;
  };

  const aviso = sinDatos.length ? `<div style="background:var(--warn-soft);border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:12px;color:var(--text2);line-height:1.5">
    ${ico('warn','sm')} ${sinDatos.length} máquina(s) sin relevar: <strong>${sinDatos.map(m=>escHtml(m.machine_name)).join(', ')}</strong>. Aparecen cuando actualicen el agente y manden el primer latido.</div>` : '';

  pintar(el, tiles + aviso + `<div style="overflow-x:auto"><table class="server-table">
    <thead><tr><th>Máquina</th><th>Sistema</th><th>CPU</th><th>Memoria</th><th>IP internet</th><th>Relevado</th></tr></thead>
    <tbody>${filas.map(filaHtml).join('')}</tbody>
  </table></div>`);
}

// dt/dd por categoria; lo que falta se muestra distinto de un dato real.
function kv(label, val){
  const vacio = val === null || val === undefined || val === '' || (Array.isArray(val) && val.length===0);
  return `<dt>${escHtml(label)}</dt><dd class="${vacio?'unknown':''}">${vacio ? 'Sin dato' : escHtml(String(val))}</dd>`;
}

function invDetalle(m){
  const i = m.inventory || {};
  const est = invEstado(m);
  const dias = invDias(m);
  const stale = est==='relevada' && dias != null && dias > INV_STALE_DIAS;
  const grupo = i.en_dominio ? `${i.dominio||''} (dominio)` : (i.grupo_trabajo || i.dominio) ? `${i.grupo_trabajo || i.dominio} (grupo de trabajo)` : '';
  const ram = i.ram_gb ? i.ram_gb+' GB'+(i.ram_tipo?' '+i.ram_tipo:'') : '';
  const amp = i.ram_ampliable===true ? `${i.ram_slots_libres} slot(s) libre(s) de ${i.ram_slots_total} — se puede ampliar`
    : i.ram_ampliable===false ? `${i.ram_slots_total} slot(s), todos ocupados — reemplazar módulos` : '';

  const head = `<div class="panel-head" style="margin-bottom:14px">
    <button class="btn sm" onclick="cerrarInvDetail()" aria-label="Volver a la tabla">← Volver</button>
    <div class="spacer"></div>
    ${est==='relevada'
      ? (stale ? `<span class="pill warn">${ico('warn','sm')}Desactualizado · hace ${dias} d</span>` : `<span class="pill ok">${ico('check','sm')}Relevado ${dias===0?'hoy':'hace '+dias+' d'}</span>`)
      : est==='noaplica' ? `<span class="pill muted">No se releva</span>` : `<span class="pill warn">Sin relevar</span>`}
  </div>
  <div style="font-size:18px;font-weight:800;color:var(--text)">${escHtml(m.machine_name || i.hostname || '')}</div>
  <div style="font-size:12.5px;color:var(--text3);margin-top:2px">${escHtml(i.hostname||'')}${grupo?' · '+escHtml(grupo):''}</div>`;

  if (est !== 'relevada') {
    const msg = est==='noaplica'
      ? `No se releva — ${escHtml(i.motivo || 'sistema no soportado')}. El agente informa que esta máquina no aplica al relevamiento (por ejemplo, Windows anterior a 10 o Server 2016).`
      : `Todavía sin relevar. Aparece cuando el agente se actualice y mande su primer latido con el inventario.`;

async function bajarInventario(boton) {
  // Antes se bajaba igual y llegaba un archivo con solo el encabezado, sin
  // ninguna pista de por que. Es mejor decirlo aca.
  const relevadas = inventario.filter(m => m.inventory).length;
  if (relevadas === 0) {
    await avisar('Todavia no hay nada que exportar',
      'Ninguna maquina relevo su inventario, asi que la planilla saldria vacia.', '📋',
      { detalle: 'El relevamiento lo hace el agente: aparece cuando las maquinas actualicen a la version nueva y manden su primer latido. '
        + 'Las que tengan Windows anterior a 10 o Server 2016 no se relevan.' });
    return;
  }

  const original = boton.textContent;
  boton.disabled = true;
  boton.textContent = 'Generando...';
  try {
    // Con fetch y no con un enlace directo: la descarga necesita el token en la
    // cabecera, y un <a href> no lo manda.
    const r = await fetch(API + '/api/machines/inventory.csv', { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) { avisar('No se pudo generar', 'El servidor rechazo el pedido de la planilla.', '⚠️'); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'inventario-servereyes-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) {
    avisar('No se pudo descargar', e.message, '⚠️');
  } finally {
    boton.disabled = false;
    boton.textContent = original;
  }
}
