<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServerEyes — NOC Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f0f2f5;--bg2:#fff;--bg3:#f8f9fa;--text:#333;--text2:#666;--text3:#999;--border:#e8e8e8;--border2:#f0f2f5;--shadow:rgba(0,0,0,0.06);--header-bg:#fff;--card-bg:#fff;--input-bg:#f8f9fa;--code-bg:#1a1a2e;--code-text:#aaa;}
html.dark{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--text:#e6edf3;--text2:#8b949e;--text3:#6e7681;--border:#30363d;--border2:#21262d;--shadow:rgba(0,0,0,0.3);--header-bg:#161b22;--card-bg:#161b22;--input-bg:#0d1117;--code-bg:#0d1117;--code-text:#8b949e;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;transition:background .3s,color .3s;}

/* ── LOGIN ── */
.login-screen{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);}
.login-card{background:var(--bg2);border-radius:20px;padding:48px 40px;width:380px;max-width:92vw;box-shadow:0 24px 64px rgba(0,0,0,0.4);}
.login-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;}
.login-logo .eye-icon{font-size:36px;}
.login-logo h1{font-size:26px;font-weight:800;color:#1a1a2e;}
.login-sub{text-align:center;color:#999;font-size:13px;margin-bottom:32px;}
.login-card input{width:100%;border:2px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--text);background:var(--input-bg);outline:none;margin-bottom:12px;transition:border-color .2s;}
.login-card input:focus{border-color:#2196F3;}
.login-btn{width:100%;background:#2196F3;color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .2s;}
.login-btn:hover{background:#1976D2;}
.login-err{color:#F44336;text-align:center;font-size:13px;margin-top:8px;}

/* ── LAYOUT ── */
.app-layout{display:flex;flex-direction:column;min-height:100vh;padding-bottom:64px;}

/* ── HEADER ── */
.noc-header{background:var(--header-bg);padding:0 20px;height:60px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px var(--shadow);position:sticky;top:0;z-index:100;}
.hamburger{background:none;border:none;cursor:pointer;padding:8px;border-radius:8px;color:#666;font-size:20px;line-height:1;}
.hamburger:hover{background:var(--bg);}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;}
.brand .eye{font-size:22px;}
.brand .name{font-size:18px;font-weight:800;color:#1a1a2e;}
.noc-badge{background:#2196F3;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.5px;}
.header-search{flex:1;max-width:400px;position:relative;}
.header-search input{width:100%;border:2px solid var(--border);border-radius:10px;padding:8px 14px 8px 36px;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;background:var(--input-bg);}
.header-search input:focus{border-color:#2196F3;background:var(--bg2);}
.header-search .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#999;font-size:14px;}
.header-spacer{flex:1;}
.header-actions{display:flex;align-items:center;gap:6px;}
.icon-btn{background:none;border:none;cursor:pointer;padding:8px;border-radius:8px;color:#666;font-size:18px;position:relative;transition:background .2s;}
.icon-btn:hover{background:var(--bg);color:var(--text);}
.badge-dot{position:absolute;top:4px;right:4px;width:16px;height:16px;background:#F44336;color:#fff;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.avatar{width:34px;height:34px;border-radius:50%;background:#2196F3;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;}

/* ── MAIN CONTENT ── */
.noc-main{flex:1;padding:20px;display:grid;gap:16px;}

/* ── STATS ROW ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.stat-card{background:var(--card-bg);border-radius:14px;padding:16px 18px;box-shadow:0 2px 8px var(--shadow);display:flex;align-items:center;gap:14px;}
.stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.stat-icon.blue{background:#E3F2FD;}
.stat-icon.green{background:#E8F5E9;}
.stat-icon.red{background:#FFEBEE;}
.stat-icon.orange{background:#FFF3E0;}
.stat-info{flex:1;}
.stat-num{font-size:28px;font-weight:800;line-height:1;}
.stat-num.blue{color:#2196F3;}
.stat-num.green{color:#4CAF50;}
.stat-num.red{color:#F44336;}
.stat-num.orange{color:#FF9800;}
.stat-label{font-size:12px;color:#999;margin-top:2px;}
.sparkline{width:60px;height:30px;}

/* ── GRID SECTIONS ── */
.noc-grid-top{display:grid;grid-template-columns:200px 1fr 280px;gap:16px;align-items:start;}
.noc-grid-mid{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start;}

/* ── PANEL CARD ── */
.panel{background:var(--card-bg);border-radius:14px;padding:16px;box-shadow:0 2px 8px var(--shadow);}
.panel-title{font-size:13px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.panel-title .dot{width:8px;height:8px;border-radius:50%;}
.help-btn{width:18px;height:18px;border-radius:50%;background:#e8f5e9;border:none;color:#66bb6a;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin-left:6px;transition:all .2s;flex-shrink:0;animation:helpPulse 1s ease-in-out infinite;}
.help-btn.clicked{animation:none;}
.help-btn:hover{background:#66bb6a;color:#fff;animation:none;transform:scale(1.15);}
@keyframes helpPulse{0%,100%{transform:scale(1);background:#e8f5e9;color:#66bb6a;}50%{transform:scale(1.18);background:#c8e6c9;color:#43a047;}}
.help-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:center;z-index:600;padding:20px;}
.help-modal{background:var(--card-bg,#fff);border-radius:16px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2);}
.help-modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border2,#eee);}
.help-modal-header h3{font-size:16px;font-weight:700;color:var(--text,#333);}
.help-modal-close{background:none;border:none;font-size:20px;color:#999;cursor:pointer;padding:4px 8px;}
.help-modal-close:hover{color:var(--text,#333);}
.help-modal-body{padding:20px;}
.help-modal-body p{font-size:14px;color:var(--text,#333);line-height:1.6;margin-bottom:12px;}
.help-modal-body ul,.help-modal-body ol{padding-left:20px;margin-bottom:12px;}
.help-modal-body li{font-size:13px;color:#666;line-height:1.6;margin-bottom:4px;}
.help-modal-body strong{color:var(--text,#333);}
.help-modal-body .help-tip{background:var(--bg,#f8f9fa);border-left:3px solid var(--accent,#2196F3);border-radius:0 8px 8px 0;padding:10px 14px;font-size:12px;color:#666;margin-top:12px;}
.notif-wrap{position:relative;display:inline-block;}
.notif-badge{position:absolute;top:-4px;right:-4px;background:#9C27B0;color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.notif-dropdown{position:fixed;top:64px;right:20px;width:340px;max-height:400px;overflow-y:auto;background:var(--card-bg,#fff);border:1px solid var(--border2,#eee);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:10000;}
.notif-dropdown-header{padding:14px 16px;border-bottom:1px solid var(--border2,#eee);font-size:14px;font-weight:700;color:var(--text,#333);}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border2,#eee);cursor:pointer;transition:background .2s;}
.notif-item:hover{background:var(--bg,#f8f9fa);}
.notif-item.unread{border-left:3px solid #9C27B0;}
.notif-item .ni-title{font-size:13px;font-weight:700;color:var(--text,#333);}
.notif-item .ni-msg{font-size:12px;color:#888;margin-top:2px;line-height:1.4;}
.notif-item .ni-time{font-size:10px;color:#bbb;margin-top:4px;}
.notif-empty{padding:30px;text-align:center;color:#999;font-size:13px;}
/* SUPPORT CHAT */
.support-fab{position:fixed;bottom:84px;right:20px;width:52px;height:52px;border-radius:50%;background:#9C27B0;color:#fff;border:none;font-size:24px;cursor:pointer;z-index:90;box-shadow:0 4px 16px rgba(156,39,176,.4);display:flex;align-items:center;justify-content:center;transition:transform .2s;}
.support-fab:hover{transform:scale(1.1);}
.support-panel{position:fixed;bottom:80px;right:20px;width:380px;height:500px;background:var(--card-bg,#fff);border:1px solid var(--border2);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.2);z-index:10000;display:flex;flex-direction:column;overflow:hidden;}
.support-header{padding:14px 16px;background:#9C27B0;color:#fff;display:flex;align-items:center;justify-content:space-between;}
.support-header h4{font-size:15px;font-weight:700;margin:0;}
.support-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.support-msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;word-break:break-word;}
.support-msg.user{align-self:flex-end;background:#9C27B0;color:#fff;border-bottom-right-radius:4px;}
.support-msg.admin{align-self:flex-start;background:var(--bg,#f0f2f5);color:var(--text,#333);border-bottom-left-radius:4px;}
.support-msg .msg-time{font-size:10px;opacity:.6;margin-top:4px;}
.support-msg .msg-attach{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.support-msg .msg-attach a{font-size:11px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:4px;color:inherit;text-decoration:none;}
.support-input-area{padding:10px;border-top:1px solid var(--border2);display:flex;gap:8px;align-items:end;}
.support-input-area textarea{flex:1;border:1px solid var(--border2);border-radius:10px;padding:8px 12px;font-size:13px;resize:none;max-height:60px;color:var(--text);background:var(--input-bg);outline:none;font-family:inherit;}
.support-input-area button{background:#9C27B0;color:#fff;border:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;}
.support-tickets-list{flex:1;overflow-y:auto;padding:12px;}
.support-ticket-item{padding:12px;border:1px solid var(--border2);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:background .2s;}
.support-ticket-item:hover{background:var(--bg);}

.notif-toast{position:fixed;top:20px;right:20px;background:#9C27B0;color:#fff;border-radius:14px;padding:14px 20px;box-shadow:0 6px 24px rgba(156,39,176,.4);z-index:700;max-width:360px;cursor:pointer;animation:toastIn .4s ease-out;display:flex;align-items:start;gap:12px;}
.notif-toast .nt-icon{font-size:22px;flex-shrink:0;}
.notif-toast .nt-title{font-size:14px;font-weight:700;}
.notif-toast .nt-msg{font-size:12px;opacity:.9;margin-top:2px;line-height:1.4;}
.notif-toast .nt-close{position:absolute;top:8px;right:12px;font-size:16px;opacity:.6;cursor:pointer;}
.notif-toast .nt-close:hover{opacity:1;}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── DONUT SALUD ── */
.donut-wrap{display:flex;flex-direction:column;align-items:center;}
.donut-svg{width:120px;height:120px;}
.donut-pct{font-size:22px;font-weight:800;text-anchor:middle;dominant-baseline:middle;}
.donut-sub{font-size:13px;color:#999;margin-top:6px;text-align:center;}

/* ── MAP ── */
.map-panel{min-height:280px;position:relative;z-index:0;}
#nocMap{width:100%;height:260px;border-radius:10px;overflow:hidden;position:relative;z-index:0;}

/* ── ALERTAS SIDE ── */
.alert-list{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;}
.alert-item{background:#FFF3F3;border-left:3px solid #F44336;border-radius:0 8px 8px 0;padding:8px 12px;}
.alert-item .alert-name{font-size:13px;font-weight:700;color:#333;}
.alert-item .alert-time{font-size:11px;color:#999;margin-top:2px;}
.alert-item .alert-ip{font-size:11px;color:#F44336;font-weight:600;}
.no-alerts{text-align:center;padding:24px 0;color:#ccc;font-size:13px;}

/* ── RECURSOS GLOBALES ── */
.recursos-wrap{display:flex;align-items:center;gap:16px;}
.recursos-list{flex:1;display:flex;flex-direction:column;gap:8px;}
.rec-row{display:flex;align-items:center;gap:8px;}
.rec-label{font-size:12px;color:#666;width:50px;}
.rec-bar-bg{flex:1;height:6px;background:#f0f2f5;border-radius:3px;overflow:hidden;}
.rec-bar-fg{height:100%;border-radius:3px;transition:width .4s;}
.rec-pct{font-size:12px;font-weight:700;width:34px;text-align:right;}

/* ── SERVER TABLE ── */
.server-table{width:100%;border-collapse:collapse;}
.server-table th{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;padding:8px 12px;text-align:left;border-bottom:2px solid var(--border2);}
.server-table td{padding:10px 12px;border-bottom:1px solid var(--border2);vertical-align:middle;}
.server-table tr:hover td{background:var(--bg3);cursor:pointer;}
.server-table tr:last-child td{border-bottom:none;}
.status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}
.status-dot.on{background:#4CAF50;box-shadow:0 0 6px rgba(76,175,80,.5);}
.status-dot.off{background:#F44336;}
.srv-name{font-size:14px;font-weight:700;color:var(--text);}
.srv-meta{font-size:11px;color:#999;margin-top:1px;}
.srv-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.srv-badge.on{background:#E8F5E9;color:#4CAF50;}
.srv-badge.off{background:#FFEBEE;color:#F44336;}
.mini-bar{width:60px;height:6px;background:#f0f2f5;border-radius:3px;overflow:hidden;margin-top:2px;}
.mini-bar-fg{height:100%;border-radius:3px;}
.val-num{font-size:13px;font-weight:700;}
.val-num.ok{color:#4CAF50;}
.val-num.warn{color:#FF9800;}
.val-num.crit{color:#F44336;}

/* ── ACCIONES RAPIDAS ── */
.actions-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.action-btn{background:var(--bg3);border:2px solid var(--border2);border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .2s;font-size:11px;font-weight:700;color:var(--text2);}
.action-btn:hover{background:#E3F2FD;border-color:#2196F3;color:#2196F3;}
.action-btn .ab-icon{font-size:22px;}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--header-bg);border-top:1px solid var(--border2);display:flex;height:64px;z-index:99;box-shadow:0 -4px 16px var(--shadow);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:#999;font-size:10px;font-weight:700;transition:color .2s;position:relative;border:none;background:none;}
.nav-item:hover,.nav-item.active{color:#2196F3;}
.nav-item .nav-icon{font-size:20px;}
.nav-badge{position:absolute;top:8px;right:calc(50% - 18px);background:#F44336;color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700;}

/* ── MODALS ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;z-index:500;overflow-y:auto;}
.modal-box{background:var(--bg2);border-radius:16px;padding:28px;width:100%;max-width:560px;margin:auto;box-shadow:0 24px 64px rgba(0,0,0,.3);}
.modal-box.wide{max-width:720px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-header h2{font-size:18px;font-weight:800;color:var(--text);}
.modal-close{background:var(--bg);border:none;border-radius:8px;padding:6px 14px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:600;}
.modal-close:hover{background:var(--border);color:var(--text);}
.modal-label{font-size:12px;color:#999;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:14px;margin-bottom:4px;display:block;}
.modal-input{width:100%;border:2px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--text);background:var(--input-bg);outline:none;transition:border-color .2s;}
.modal-input:focus{border-color:#2196F3;}
.modal-textarea{width:100%;border:2px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--text);background:var(--input-bg);outline:none;resize:vertical;min-height:70px;}
.modal-textarea:focus{border-color:#2196F3;}
select.modal-input{appearance:auto;cursor:pointer;}
.modal-btn{width:100%;background:#2196F3;color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px;transition:background .2s;}
.modal-btn:hover{background:#1976D2;}
.modal-btn.danger{background:#F44336;}
.modal-btn.danger:hover{background:#D32F2F;}
.modal-btn.ghost{background:var(--bg);color:var(--text2);margin-top:8px;}
.modal-btn.ghost:hover{background:var(--border);}
.modal-btn.sm{width:auto;padding:8px 18px;font-size:13px;margin-top:0;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.chip{background:#E3F2FD;color:#2196F3;border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;}
.chip:hover{background:#BBDEFB;}
.day-tabs{display:flex;gap:8px;margin-bottom:16px;}
.day-tab{background:var(--bg);color:var(--text2);border:none;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;}
.day-tab.active{background:#2196F3;color:#fff;}

/* uptime bars */
.uptime-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.uptime-day{font-size:11px;color:#999;width:80px;flex-shrink:0;}
.uptime-bg{flex:1;height:16px;background:#f0f2f5;border-radius:4px;overflow:hidden;}
.uptime-fg{height:100%;border-radius:4px;}
.uptime-pct{font-size:12px;font-weight:700;width:36px;text-align:right;flex-shrink:0;}
.uptime-avg{text-align:center;margin-bottom:20px;}
.uptime-avg .big{font-size:48px;font-weight:800;line-height:1;}

/* ip history */
.ip-entry{background:#f8f9fa;border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
.ip-entry .ip-date{color:#999;font-size:11px;width:130px;}
.ip-old{color:#FF9800;font-weight:700;font-size:13px;}
.ip-arrow{color:#ccc;}
.ip-new{color:#4CAF50;font-weight:700;font-size:13px;}

/* metrics mini chart */
.mini-chart{display:flex;align-items:flex-end;height:60px;gap:1px;background:#f8f9fa;border-radius:8px;padding:4px;overflow:hidden;}
.mini-bar-chart{border-radius:1px;transition:height .3s;}

/* logs */
.log-pre{background:var(--code-bg);color:var(--code-text);border-radius:10px;padding:14px;font-size:11px;font-family:monospace;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto;line-height:1.7;}

/* cmd */
.cmd-entry{background:#f8f9fa;border-radius:10px;padding:12px;margin-bottom:8px;border-left:3px solid #ccc;}
.cmd-entry.done{border-left-color:#4CAF50;}
.cmd-entry.pending{border-left-color:#FF9800;}
.cmd-code{font-family:monospace;color:#2196F3;font-size:13px;}
.cmd-output{background:#1a1a2e;color:#aaa;border-radius:6px;padding:8px;font-size:11px;font-family:monospace;white-space:pre-wrap;max-height:180px;overflow-y:auto;margin-top:6px;}
.cmd-meta{font-size:10px;color:#999;margin-top:4px;}

/* disk detail */
.disk-card{background:var(--bg3);border-radius:10px;padding:14px;margin-bottom:10px;}
.disk-card-header{display:flex;align-items:center;margin-bottom:8px;}
.disk-drive-name{flex:1;font-size:16px;font-weight:800;}
.disk-pct-big{font-size:20px;font-weight:800;}
.disk-stat-row{display:flex;justify-content:space-between;font-size:12px;color:#999;margin-bottom:2px;}
.disk-stat-val{color:#333;font-weight:600;}
.disk-bar{height:8px;background:#e8e8e8;border-radius:4px;overflow:hidden;margin:6px 0 10px;}
.disk-bar-fg{height:100%;border-radius:4px;}
.disk-controls{display:flex;align-items:center;gap:10px;padding-top:8px;border-top:1px solid #e8e8e8;}

/* checkbox */
.checkbox-row{display:flex;align-items:center;gap:8px;cursor:pointer;}
.checkbox-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;}

/* update banner */
.update-banner{background:#FFF8E1;border:1px solid #FF9800;border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.update-banner .ub-msg{color:#E65100;font-weight:700;font-size:13px;}
.update-banner .ub-sub{color:#999;font-size:11px;font-weight:400;margin-top:2px;}
.ub-dismiss{background:none;border:none;color:#999;cursor:pointer;font-size:18px;padding:2px 6px;}

/* pulse animation */
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.pulse{animation:pulse 2s infinite;}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:#f0f2f5;}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px;}

/* responsive */
@media(max-width:1100px){
  .noc-grid-top{grid-template-columns:180px 1fr 240px;}
}
@media(max-width:880px){
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .noc-grid-top{grid-template-columns:1fr 1fr;}
  .noc-grid-mid{grid-template-columns:1fr;}
  .actions-grid{grid-template-columns:repeat(3,1fr);}
}
@media(max-width:600px){
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .noc-grid-top{grid-template-columns:1fr;}
  .actions-grid{grid-template-columns:repeat(3,1fr);}
  .noc-main{padding:12px;}
  .header-search{max-width:160px;}
}
</style>
</head>
<body>
<div id="app"></div>

<script src="/i18n.js"></script>
<script>
// ── DARK MODE ──
function isDark() { return document.documentElement.classList.contains('dark'); }
function toggleDarkMode() {
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('se_dark', isDark() ? '1' : '0');
  render();
}
if (localStorage.getItem('se_dark') === '1') document.documentElement.classList.add('dark');

// ── STATE ──
const API = window.location.origin;
let token = localStorage.getItem('se_token');
let machines = [];
let agentInfo = { version: null, url: null };
let filter = '';
let statusFilter = 'all';
let activeModal = null;
let uptimeDays = 7;
let metricsHours = 24;
let refreshInterval = null;
let dismissedUpdate = false;
let activeNav = 'noc';

// ── API ──
async function api(path, opts={}) {
  const headers = {'Content-Type':'application/json',...opts.headers};
  if (token) headers.Authorization = 'Bearer ' + token;
  try {
    const r = await fetch(API + path, {...opts, headers});
    const d = await r.json();
    return {ok: r.ok, status: r.status, data: d};
  } catch(e) {
    return {ok:false, status:0, data:{error:e.message}};
  }
}

// ── UTILS ──
function timeSince(ts) {
  if (!ts) return 'Nunca';
  const s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s/60) + 'min';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  return Math.floor(s/86400) + 'd';
}

function colorPct(pct, warn=70, crit=90) {
  if (pct >= crit) return '#F44336';
  if (pct >= warn) return '#FF9800';
  return '#4CAF50';
}

function classPct(pct, warn=70, crit=90) {
  if (pct >= crit) return 'crit';
  if (pct >= warn) return 'warn';
  return 'ok';
}

function avgArr(arr) {
  if (!arr || arr.length === 0) return 0;
  return arr.reduce((a,b)=>a+b,0)/arr.length;
}

function getFiltered() {
  let list = machines;
  if (statusFilter === 'online') list = list.filter(m=>m.is_online);
  if (statusFilter === 'offline') list = list.filter(m=>!m.is_online);
  if (filter) {
    const f = filter.toLowerCase();
    list = list.filter(m =>
      (m.machine_name||'').toLowerCase().includes(f) ||
      (m.public_ip||'').includes(f) ||
      (m.local_ip||'').toLowerCase().includes(f) ||
      (m.grupo||'').toLowerCase().includes(f) ||
      (m.notes||'').toLowerCase().includes(f)
    );
  }
  return list;
}

// ── LOGIN ──
function renderLogin(err) {
  document.getElementById('app').innerHTML = `
  <div class="login-screen">
    <div class="login-card">
      <div class="login-logo"><span class="eye-icon">👁️</span><h1>ServerEyes</h1></div>
      <p class="login-sub">NOC Dashboard</p>
      <input type="email" id="le" placeholder="${t('login_email')}" autocomplete="username"/>
      <input type="password" id="lp" placeholder="${t('login_password')}" autocomplete="current-password"/>
      ${err?`<p class="login-err">${err}</p>`:''}
      <button class="login-btn" onclick="doLogin()">${t('login_btn')}</button>
    </div>
  </div>`;
  const le = document.getElementById('le');
  const lp = document.getElementById('lp');
  le.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  lp.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

async function doLogin() {
  try {
    const le = document.getElementById('le');
    const lp = document.getElementById('lp');
    if (!le || !lp) return;
    const email = le.value.trim();
    const pass = lp.value;
    if (!email||!pass) { renderLogin('Completa todos los campos'); return; }
    const r = await api('/api/auth/login', {method:'POST', body:JSON.stringify({email, password:pass})});
    if (r.ok && r.data.token) {
      token = r.data.token;
      localStorage.setItem('se_token', token);
      render();
      startDashboard();
    } else {
      renderLogin(r.data?.error || 'Error de autenticacion');
    }
  } catch(e) {
    renderLogin('Error: ' + e.message);
  }
}

function logout() {
  token = null;
  localStorage.removeItem('se_token');
  if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
  activeModal = null;
  machines = [];
  renderLogin();
}

// ── RENDER MAIN ──
function pauseRefresh() { if(refreshInterval){clearInterval(refreshInterval);refreshInterval=null;} }
function resumeRefresh() { if(!refreshInterval){refreshInterval=setInterval(()=>{loadMachines();loadUrlMonitors(true);},10000);} }
function render() {
  if (notifDropdownOpen) return;
  const el = document.getElementById('app');
  if (!token) { renderLogin(); return; }
  el.innerHTML = buildLayout();
  attachEvents();
  if (activeNav === 'noc') {
    setTimeout(initInlineMap, 120);
  }
  if (activeNav === 'ajustes') {
    setTimeout(loadSmtpConfig, 100);
    setTimeout(loadSessionDur, 150);
  }
  if (activeNav === 'urls') {
    setTimeout(loadSSLMonitors, 100);
  }
  if (activeNav === 'incidentes' && !incidentsLoaded) {
    incidentsLoaded = true;
    loadIncidents();
  }
}

function buildLayout() {
  const filtered = getFiltered();
  const online  = machines.filter(m=>m.is_online).length;
  const offline = machines.length - online;
  const healthPct = machines.length > 0 ? Math.round((online/machines.length)*100) : 0;
  const alerts = machines.filter(m=>!m.is_online);
  const thresholdCount = getThresholdAlerts().length;
  const offlineBadge = (alerts.length + thresholdCount) > 0 ? (alerts.length + thresholdCount) : '';

  // avg resources
  const cpus  = machines.filter(m=>m.cpu_usage!=null).map(m=>m.cpu_usage);
  const rams  = machines.filter(m=>m.ram_usage!=null&&m.ram_total).map(m=>Math.round(m.ram_usage/m.ram_total*100));
  const pings = machines.filter(m=>m.ping_ms!=null&&m.is_online).map(m=>m.ping_ms);
  const disks = machines.filter(m=>m.disk_usage!=null&&m.disk_total).map(m=>Math.round(m.disk_usage/m.disk_total*100));
  const avgCpu  = Math.round(avgArr(cpus));
  const avgRam  = Math.round(avgArr(rams));
  const avgDisk = Math.round(avgArr(disks));
  const avgPing = Math.round(avgArr(pings));

  const updateOutdated = machines.filter(m=>m.agent_version&&agentInfo.version&&m.agent_version!==agentInfo.version);

  let updateBanner = '';
  if (!dismissedUpdate && updateOutdated.length>0) {
    updateBanner = `<div class="update-banner">
      <div><div class="ub-msg">⚠️ ${updateOutdated.length} agente(s) desactualizado(s)</div>
      <div class="ub-sub">${updateOutdated.map(m=>m.machine_name+' (v'+m.agent_version+')').join(', ')} — última: v${agentInfo.version}</div></div>
      <button class="ub-dismiss" onclick="dismissedUpdate=true;render()">✕</button>
    </div>`;
  }

  return `
  <div class="app-layout">
    ${buildHeader()}
    <div class="noc-main">
      ${updateBanner}
      ${buildStatsRow(online, offline, alerts.length)}
      ${activeNav==='noc' ? buildNocView(healthPct, alerts, avgCpu, avgRam, avgDisk, avgPing, filtered) : ''}
      ${activeNav==='servidores' ? buildServersView(filtered) : ''}
      ${activeNav==='alertas' ? buildAlertasView(alerts) : ''}
      ${activeNav==='urls' ? buildUrlsView() : ''}
      ${activeNav==='incidentes' ? buildIncidentesView() : ''}
      ${activeNav==='reportes' ? buildReportesView() : ''}
      ${activeNav==='ajustes' ? buildAjustesView() : ''}
    </div>
    ${buildBottomNav(offlineBadge)}
    ${activeModal ? buildModal() : ''}
  </div>`;
}

function buildHeader() {
  return `<header class="noc-header">
    <button class="hamburger" onclick="render()">☰</button>
    <div class="brand">
      <span class="eye">👁️</span>
      <span class="name">ServerEyes</span>
      <span class="noc-badge">NOC MODE</span>
      ${userPlan ? `<span class="noc-badge" style="background:${userPlan.plan==='pro'?'#4CAF50':userPlan.plan==='enterprise'?'#2196F3':'#666'}">${(userPlan.plan||'free').toUpperCase()} · ${userPlan.current_machines}/${userPlan.plan==='pro'||userPlan.plan==='enterprise'?'∞':userPlan.max_machines}</span>` : ''}
    </div>
    <div class="header-search">
      <span class="search-icon">🔍</span>
      <input id="hdr-search" type="text" placeholder="Buscar servidor..." value="${filter}" oninput="filter=this.value;render()"/>
    </div>
    <div class="header-spacer"></div>
    <div class="header-actions">
      <button class="icon-btn" onclick="notifClick()" title="Alertas">
        🔔
        ${(machines.filter(m=>!m.is_online).length + getThresholdAlerts().length) > 0 ? `<span class="badge-dot">${machines.filter(m=>!m.is_online).length + getThresholdAlerts().length}</span>` : ''}
      </button>
      <div class="notif-wrap">
        <button class="icon-btn" onclick="toggleNotifDropdown()" title="Notificaciones">
          💬
          ${getUnreadCount() > 0 ? `<span class="notif-badge" id="notif-count-badge">${getUnreadCount()}</span>` : '<span class="notif-badge" id="notif-count-badge" style="display:none">0</span>'}
        </button>
        <div class="notif-dropdown" id="notif-dropdown" style="display:${notifDropdownOpen?'block':'none'}"></div>
      </div>
      <button class="icon-btn" onclick="toggleDarkMode()" title="Modo oscuro">${isDark()?'☀️':'🌙'}</button>
      <button class="icon-btn" onclick="activeNav='ajustes';render()" title="Ajustes">⚙️</button>
      <button class="icon-btn pulse" onclick="loadMachines()" title="Refrescar">🔄</button>
      <div class="avatar" onclick="logout()" title="Cerrar sesión">SE</div>
    </div>
  </header>`;
}

function buildStatsRow(online, offline, alertCount) {
  function sparkSVG(values, color) {
    if (!values||values.length<2) return '';
    const max=Math.max(...values,1), w=60, h=30;
    const pts = values.map((v,i)=>`${Math.round(i/(values.length-1)*w)},${Math.round(h - (v/max)*h)}`).join(' ');
    return `<svg class="sparkline" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/></svg>`;
  }
  const cpuHist = machines.filter(m=>m.cpu_usage!=null).map(m=>m.cpu_usage);
  return `<div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon blue">🖥️</div>
      <div class="stat-info"><div class="stat-num blue">${machines.length}</div><div class="stat-label">${t('total_servers')}</div></div>
      ${sparkSVG(machines.map((_,i)=>i+1).slice(-8),'#2196F3')}
    </div>
    <div class="stat-card">
      <div class="stat-icon green">✅</div>
      <div class="stat-info"><div class="stat-num green">${online}</div><div class="stat-label">${t('online')}</div></div>
      ${sparkSVG(cpuHist.slice(-8),'#4CAF50')}
    </div>
    <div class="stat-card">
      <div class="stat-icon red">❌</div>
      <div class="stat-info"><div class="stat-num red">${offline}</div><div class="stat-label">${t('offline')}</div></div>
      ${sparkSVG([0,0,offline,offline,offline].slice(-8),'#F44336')}
    </div>
    <div class="stat-card">
      <div class="stat-icon orange">⚠️</div>
      <div class="stat-info"><div class="stat-num orange">${alertCount}</div><div class="stat-label">${t('alerts')}</div></div>
      ${sparkSVG([0,alertCount],'#FF9800')}
    </div>
  </div>`;
}

function buildNocView(healthPct, alerts, avgCpu, avgRam, avgDisk, avgPing, filtered) {
  const hColor = healthPct>=80?'#4CAF50':healthPct>=50?'#FF9800':'#F44336';
  const circ = 2*Math.PI*44;
  const dash = circ * (1 - healthPct/100);
  return `
  <div class="noc-grid-top">
    <!-- Salud Global -->
    <div class="panel">
      <div class="panel-title"><span class="dot" style="background:#4CAF50"></span>Estado General<button class="help-btn" onclick="event.stopPropagation();showHelp('noc',this)">?</button></div>
      <div class="donut-wrap">
        <svg class="donut-svg" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="44" fill="none" stroke="#f0f2f5" stroke-width="10"/>
          <circle cx="50" cy="50" r="44" fill="none" stroke="${hColor}" stroke-width="10"
            stroke-dasharray="${circ}" stroke-dashoffset="${dash}"
            stroke-linecap="round" transform="rotate(-90 50 50)" style="transition:stroke-dashoffset .6s"/>
          <text x="50" y="47" class="donut-pct" style="fill:${hColor};font-size:18px;font-weight:800">${healthPct}%</text>
          <text x="50" y="60" text-anchor="middle" style="fill:#999;font-size:9px">Salud Global</text>
        </svg>
        <div class="donut-sub">${machines.filter(m=>m.is_online).length}/${machines.length} online</div>
      </div>
    </div>

    <!-- Mapa -->
    <div class="panel map-panel">
      <div class="panel-title"><span class="dot" style="background:#2196F3"></span>Mapa Global</div>
      <div id="nocMap"></div>
    </div>

    <!-- Alertas side -->
    <div class="panel">
      <div class="panel-title"><span class="dot" style="background:#F44336"></span>Alertas Activas<button class="help-btn" onclick="event.stopPropagation();showHelp('alerts',this)">?</button></div>
      <div class="alert-list">
        ${alerts.length===0
          ? '<div class="no-alerts">🎉 Sin alertas activas</div>'
          : alerts.map(m=>`<div class="alert-item">
              <div class="alert-name">${m.machine_name}</div>
              <div class="alert-ip">${m.public_ip||'---'}</div>
              <div class="alert-time">Offline hace ${timeSince(m.last_heartbeat)}</div>
            </div>`).join('')}
      </div>
    </div>
  </div>

  <!-- Mid row -->
  <div class="noc-grid-mid">
    <div style="display:flex;flex-direction:column;gap:16px;">
      <!-- Recursos por Maquina -->
      <div class="panel">
        <div class="panel-title"><span class="dot" style="background:#9C27B0"></span>Recursos por Maquina<button class="help-btn" onclick="event.stopPropagation();showHelp('resources',this)">?</button></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;max-height:420px;overflow-y:auto;padding:4px 0">
          ${filtered.map(m=>{
            const cpu = m.cpu_usage!=null ? m.cpu_usage : null;
            const ramPct = m.ram_usage&&m.ram_total ? Math.round(m.ram_usage/m.ram_total*100) : null;
            const disks = m.disks||[];
            const maxDisk = disks.length>0 ? Math.max(...disks.map(d=>d.total>0?Math.round(d.used/d.total*100):0)) : null;
            return `<div style="background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:10px 12px;cursor:pointer" onclick="openMachineDetail(${m.id})">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                <span class="status-dot ${m.is_online?'on':'off'}" style="width:8px;height:8px"></span>
                <span style="font-weight:700;font-size:13px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.machine_name}</span>
                <span id="spark-${m.id}" style="opacity:0.7">${sparkData[m.id]?miniSparkSVG(sparkData[m.id].map(p=>p.cpu!=null?parseFloat(p.cpu):0),'#4CAF50'):''}</span>
                ${m.grupo?`<span style="font-size:10px;color:#888;background:var(--border2);padding:1px 6px;border-radius:4px">${m.grupo}</span>`:''}
              </div>
              ${[
                {label:'CPU', val:cpu, warn:70, crit:90, txt:cpu!=null?cpu+'%':'—'},
                {label:'RAM', val:ramPct, warn:75, crit:90, txt:ramPct!=null?ramPct+'% ('+m.ram_usage+'/'+m.ram_total+'GB)':'—'},
                {label:'Disco', val:maxDisk, warn:80, crit:92, txt:maxDisk!=null?maxDisk+'%':'—'},
                {label:'Ping', val:m.ping_ms?Math.min(m.ping_ms,200):null, warn:80, crit:160, txt:m.ping_ms?m.ping_ms+'ms':'—'}
              ].map(r=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
                <span style="font-size:10px;color:#888;width:36px">${r.label}</span>
                <div style="flex:1;height:6px;background:var(--border2);border-radius:3px;overflow:hidden">
                  ${r.val!=null?`<div style="width:${r.val}%;height:100%;background:${colorPct(r.val,r.warn||70,r.crit||90)};border-radius:3px"></div>`:''}
                </div>
                <span style="font-size:10px;color:${r.val!=null?colorPct(r.val,r.warn||70,r.crit||90):'#555'};width:60px;text-align:right;font-weight:600">${r.txt}</span>
              </div>`).join('')}
            </div>`;
          }).join('')}
        </div>
      </div>

      <!-- Acciones rápidas -->
      <div class="panel">
        <div class="panel-title"><span class="dot" style="background:#FF9800"></span>Acciones Rapidas</div>
        <div class="actions-grid">
          <button class="action-btn" onclick="activeNav='servidores';render()"><span class="ab-icon">🖥️</span>Servidores</button>
          <button class="action-btn" onclick="exportCSV()"><span class="ab-icon">📄</span>CSV Export</button>
          <button class="action-btn" onclick="exportPDF()"><span class="ab-icon">📋</span>Informe PDF</button>
          <button class="action-btn" onclick="openAgentModal()"><span class="ab-icon">📦</span>Agente</button>
          <button class="action-btn" onclick="openCmdHistory()"><span class="ab-icon">💻</span>Historial CMD</button>
          <button class="action-btn" onclick="activeNav='alertas';render()"><span class="ab-icon">🔔</span>Alertas</button>
          <button class="action-btn" onclick="activeNav='urls';render()"><span class="ab-icon">🌐</span>URLs ${urlMonitors.filter(u=>!u.is_up).length>0?'('+urlMonitors.filter(u=>!u.is_up).length+' ⚠)':''}</button>
        </div>
      </div>
    </div>

    <!-- Salud por Grupo -->
    ${(() => {
      const groups = {};
      filtered.forEach(m => { const g = m.grupo || 'Sin grupo'; if (!groups[g]) groups[g] = { total: 0, online: 0, avgCpu: [], avgRam: [] }; groups[g].total++; if (m.is_online) groups[g].online++; if (m.cpu_usage != null) groups[g].avgCpu.push(m.cpu_usage); if (m.ram_usage && m.ram_total) groups[g].avgRam.push(Math.round(m.ram_usage / m.ram_total * 100)); });
      const gNames = Object.keys(groups).sort();
      if (gNames.length <= 1) return '';
      return `<div class="panel">
        <div class="panel-title"><span class="dot" style="background:#2196F3"></span>Salud por Grupo</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">
          ${gNames.map(g => { const d = groups[g]; const pct = d.total > 0 ? Math.round(d.online / d.total * 100) : 0; const cpu = d.avgCpu.length > 0 ? Math.round(d.avgCpu.reduce((a,b) => a+b, 0) / d.avgCpu.length) : null; const ram = d.avgRam.length > 0 ? Math.round(d.avgRam.reduce((a,b) => a+b, 0) / d.avgRam.length) : null;
            return `<div style="background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:12px;border-left:3px solid ${pct >= 80 ? '#4CAF50' : pct >= 50 ? '#FF9800' : '#F44336'}">
              <div style="font-weight:700;font-size:13px;color:var(--text);margin-bottom:6px">${g}</div>
              <div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px"><span>${d.online}/${d.total} online</span><span style="font-weight:700;color:${pct >= 80 ? '#4CAF50' : pct >= 50 ? '#FF9800' : '#F44336'}">${pct}%</span></div>
              ${cpu != null ? `<div style="font-size:11px;color:#888">CPU: <span style="color:${colorPct(cpu)};font-weight:600">${cpu}%</span> · RAM: <span style="color:${colorPct(ram||0,75,90)};font-weight:600">${ram||0}%</span></div>` : ''}
            </div>`;
          }).join('')}
        </div>
      </div>`;
    })()}

    <!-- Tabla servidores -->
    <div class="panel" style="overflow-x:auto;">
      <div class="panel-title"><span class="dot" style="background:#2196F3"></span>Estado de Servidores<button class="help-btn" onclick="event.stopPropagation();showHelp('servers',this)">?</button></div>
      ${buildServerTable(filtered.slice(0,12))}
    </div>
  </div>`;
}

function buildServerTable(list) {

function getThresholdAlerts() {
  const alerts = [];
  machines.forEach(m => {
    if (!m.is_online) return;
    if (m.alert_cpu && m.cpu_usage != null && m.cpu_usage >= m.alert_cpu)
      alerts.push({ machine: m, type: 'cpu', icon: '🔥', color: '#F44336', msg: `CPU al ${m.cpu_usage}% (umbral: ${m.alert_cpu}%)` });
    if (m.alert_ram && m.ram_usage != null && m.ram_total) {
      const ramPct = Math.round(m.ram_usage / m.ram_total * 100);
      if (ramPct >= m.alert_ram)
        alerts.push({ machine: m, type: 'ram', icon: '💾', color: '#FF9800', msg: `RAM al ${ramPct}% (umbral: ${m.alert_ram}%)` });
    }
    if (m.alert_disk && m.disk_usage != null && m.disk_total) {
      const diskPct = Math.round(m.disk_usage / m.disk_total * 100);
      if (diskPct >= m.alert_disk)
        alerts.push({ machine: m, type: 'disk', icon: '💿', color: '#FF9800', msg: `Disco al ${diskPct}% (umbral: ${m.alert_disk}%)` });
    }
    if (m.alert_ping && m.ping_ms && m.ping_ms >= m.alert_ping)
      alerts.push({ machine: m, type: 'ping', icon: '📡', color: '#FF9800', msg: `Ping ${m.ping_ms}ms (umbral: ${m.alert_ping}ms)` });
  });
  return alerts;
}

function addCompRule() {
  const cont = document.getElementById('compound-rules');
  if (!cont) return;
  const i = cont.children.length;
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:6px;margin-bottom:6px;align-items:center';
  div.innerHTML = `<select class="modal-input comp-metric" style="width:80px;font-size:12px;padding:6px" data-i="${i}"><option value="cpu">CPU</option><option value="ram">RAM</option><option value="ping">Ping</option></select><span style="color:#888;font-size:12px">>=</span><input class="modal-input comp-threshold" type="number" placeholder="90" style="width:70px;font-size:12px;padding:6px" data-i="${i}"/><span style="color:#888;font-size:12px">%</span><button style="background:none;border:none;color:#ff5252;cursor:pointer;font-size:14px" onclick="this.parentElement.remove()">✕</button>`;
  cont.appendChild(div);
}
function removeCompRule(i) {
  const cont = document.getElementById('compound-rules');
  if (cont && cont.children[i]) cont.children[i].remove();
}
function getCompoundAlert() {
  const metrics = document.querySelectorAll('.comp-metric');
  const thresholds = document.querySelectorAll('.comp-threshold');
  const conditions = [];
  metrics.forEach((sel, i) => {
    const th = thresholds[i]?.value;
    if (th) conditions.push({ metric: sel.value, threshold: parseInt(th) });
  });
  if (conditions.length === 0) return null;
  return { conditions, duration: parseInt(document.getElementById('ed-comp-duration')?.value) || 5 };
}

async function saveSessionDur(val) {
  const st = document.getElementById('session-status');
  const res = await api('/api/auth/session', { method: 'POST', body: JSON.stringify({ session_duration: val }) });
  if (st) st.innerHTML = res.ok ? '<span style="color:#4CAF50">✅ Guardado</span>' : '<span style="color:#F44336">Error</span>';
  setTimeout(() => { if (st) st.innerHTML = ''; }, 3000);
}

async function loadSessionDur() {
  const res = await api('/api/auth/session');
  if (res.ok) {
    const el = document.getElementById('session-dur');
    if (el) el.value = res.data.session_duration || '30d';
  }
}

let smtpLoaded = false;
async function loadSmtpConfig() {
  if (smtpLoaded) return;
  const res = await api('/api/auth/smtp');
  if (res.ok) {
    smtpLoaded = true;
    const d = res.data;
    const h = document.getElementById('smtp-host'); if(h) h.value = d.smtp_host || '';
    const p = document.getElementById('smtp-port'); if(p) p.value = d.smtp_port || 587;
    const u = document.getElementById('smtp-user'); if(u) u.value = d.smtp_user || '';
    const f = document.getElementById('smtp-from'); if(f) f.value = d.smtp_from || '';
    const e = document.getElementById('smtp-enabled'); if(e) e.checked = d.email_notifications !== false;
  }
}

    smtp_from: document.getElementById('smtp-from')?.value || null,

let nocMapInstance = null;

function initInlineMap() {
  const el = document.getElementById('nocMap');
  if (!el) return;
  const pts = machines.filter(m=>m.geo_lat&&m.geo_lon).map(m=>({
    lat:parseFloat(m.geo_lat), lon:parseFloat(m.geo_lon),
    name:m.machine_name, online:m.is_online, ip:m.public_ip
  }));
  if (pts.length===0) {
    el.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:13px;background:#f8f9fa;border-radius:10px">Sin datos de geolocalización</div>';
    return;
  }
  loadLeaflet(()=>{
    if (nocMapInstance) { nocMapInstance.remove(); nocMapInstance=null; }
    const center = [pts.reduce((a,p)=>a+p.lat,0)/pts.length, pts.reduce((a,p)=>a+p.lon,0)/pts.length];
    nocMapInstance = L.map(el, {zoomControl:true}).setView(center, 5);
    L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{attribution:'© Google Maps',maxZoom:20}).addTo(nocMapInstance);
    pts.forEach(p=>{
      const c = p.online?'#4CAF50':'#F44336';
      L.circleMarker([p.lat,p.lon],{radius:9,color:c,fillColor:c,fillOpacity:.85,weight:2})
        .bindPopup(`<strong>${p.name}</strong><br>${p.online?'🟢 Online':'🔴 Offline'}<br><small>${p.ip||''}</small>`)
        .addTo(nocMapInstance);
    });
    if (pts.length>1) nocMapInstance.fitBounds(pts.map(p=>[p.lat,p.lon]),{padding:[20,20]});
  });
}

function loadLeaflet(cb) {
  if (window.L) { cb(); return; }
  if (!document.getElementById('lf-css')) {
    const css = document.createElement('link');
    css.id='lf-css'; css.rel='stylesheet';
    css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
  }
  if (!document.getElementById('lf-js')) {
    const js = document.createElement('script');
    js.id='lf-js'; js.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.onload=cb; document.head.appendChild(js);
  } else {
    setTimeout(()=>{ if(window.L) cb(); else loadLeaflet(cb); }, 100);
  }
}

function loadChartJs(cb) {
  if (window.Chart) { cb(); return; }
  if (!document.getElementById('cjs')) {
    const js = document.createElement('script');
    js.id='cjs'; js.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js';
    js.onload=cb; document.head.appendChild(js);
  } else {
    setTimeout(()=>{ if(window.Chart) cb(); else loadChartJs(cb); }, 100);
  }
}

let chartInstances = {};
function createLineChart(canvasId, labels, datasets, opts={}) {
  loadChartJs(()=>{
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    if (chartInstances[canvasId]) { chartInstances[canvasId].destroy(); }
    chartInstances[canvasId] = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
          tooltip: { callbacks: { label: (c) => c.dataset.label + ': ' + c.parsed.y + (opts.unit||'') } }
        },
        scales: {
          x: { display: true, ticks: { maxTicksLimit: 8, font: { size: 10 }, color: '#999' }, grid: { display: false } },
          y: { min: opts.min||0, max: opts.max||undefined, ticks: { font: { size: 10 }, color: '#999', callback: (v)=>v+(opts.unit||'') }, grid: { color: '#f0f2f5' } }
        },
        elements: { point: { radius: 0, hitRadius: 8 }, line: { tension: 0.3, borderWidth: 2 } },
        animation: { duration: 400 }
      }
    });
  });
}

    for (const [id, pts] of Object.entries(sparkData)) {

      if (el && pts.length > 1) {
        const cpuVals = pts.map(p => p.cpu != null ? parseFloat(p.cpu) : 0);
        el.innerHTML = miniSparkSVG(cpuVals, '#4CAF50');
      }
    }
  }
}
function miniSparkSVG(values, color) {
  if (!values || values.length < 2) return '';
  const max = Math.max(...values, 1), w = 80, h = 24;
  const pts = values.map((v, i) => `${Math.round(i / (values.length - 1) * w)},${Math.round(h - (v / max) * (h - 2) - 1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:80px;height:24px"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" opacity="0.8"/></svg>`;
}

function fmtDuration(min) {
  if (!min) return '---';
  if (min < 60) return Math.round(min) + ' min';
  if (min < 1440) return Math.round(min / 60) + 'h ' + Math.round(min % 60) + 'min';
  return Math.floor(min / 1440) + 'd ' + Math.round((min % 1440) / 60) + 'h';
}

async function checkSSL(hostname) {
  const h = hostname.replace(/^https?:\/\//, '').split('/')[0];
  const res = await api('/api/ssl-check', { method: 'POST', body: JSON.stringify({ hostname: h }) });
  if (res.ok && res.data) {
    const d = res.data;
    if (d.error) { alert('SSL Error: ' + d.error); return; }
    const color = d.status === 'ok' ? '🟢' : d.status === 'warning' ? '🟡' : '🔴';
    alert(`${color} SSL: ${d.subject}\n\nEmisor: ${d.issuer}\nVence: ${new Date(d.expires_at).toLocaleDateString('es')}\nDias restantes: ${d.days_left}\nEstado: ${d.status === 'ok' ? 'Valido' : d.status === 'warning' ? 'Vence pronto!' : 'Expirado!'}`);
  } else { alert('Error al verificar SSL'); }
}

// ── USER NOTIFICATIONS ──
let userNotifs = [];
let notifDropdownOpen = false;
let knownNotifIds = new Set();

async function loadUserNotifs() {
  const res = await api('/api/notifications');
  if (!res.ok) return;
  const prev = knownNotifIds;
  const newNotifs = res.data.filter(n => !prev.has(n.id) && !n.is_read);
  userNotifs = res.data;
  knownNotifIds = new Set(res.data.map(n => n.id));
  if (prev.size > 0 && newNotifs.length > 0) {
    newNotifs.forEach(n => showNotifToast(n));
  }
  const badge = document.getElementById('notif-count-badge');
  const unread = getUnreadCount();
  if (badge) { badge.style.display = unread > 0 ? 'flex' : 'none'; badge.textContent = unread; }
  if (notifDropdownOpen) renderNotifDropdown();
}

function showNotifToast(n) {
  const toast = document.createElement('div');
  toast.className = 'notif-toast';
  toast.innerHTML = `<span class="nt-icon">💬</span><div><div class="nt-title">${n.title}</div><div class="nt-msg">${n.message}</div></div><span class="nt-close" onclick="event.stopPropagation();this.parentElement.remove()">✕</span>`;
  toast.onclick = () => { toast.remove(); toggleNotifDropdown(); };
  document.body.appendChild(toast);
  setTimeout(() => { if (toast.parentElement) toast.remove(); }, 8000);
}

function getUnreadCount() {
  return userNotifs.filter(n => !n.is_read).length;
}

function toggleNotifDropdown() {
  notifDropdownOpen = !notifDropdownOpen;
  if (notifDropdownOpen) {
    const dd = document.getElementById('notif-dropdown');
    if (dd) { dd.style.display = 'block'; }
    renderNotifDropdown();
  } else {
    render();
  }
}

function renderNotifDropdown() {
  const dd = document.getElementById('notif-dropdown');
  if (!dd) return;
  if (userNotifs.length === 0) {
    dd.innerHTML = '<div class="notif-dropdown-header">Notificaciones</div><div class="notif-empty">📭 Sin notificaciones</div>';
    return;
  }
  dd.innerHTML = '<div class="notif-dropdown-header">Notificaciones</div>' +
    userNotifs.map(n => `<div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="markNotifRead(${n.id}, this)">
      <div class="ni-title">${n.title}</div>
      <div class="ni-msg">${n.message}</div>
      <div class="ni-time">${timeSince(n.created_at)}</div>
    </div>`).join('');
}

async function markNotifRead(id, el) {
  await api('/api/notifications/' + id + '/read', { method: 'POST' });
  const n = userNotifs.find(x => x.id === id);
  if (n) n.is_read = true;
  if (el) el.classList.remove('unread');
  const badge = document.getElementById('notif-count-badge');
  const unread = getUnreadCount();
  if (badge) badge.style.display = unread > 0 ? 'flex' : 'none';
  if (badge) badge.textContent = unread;
}

document.addEventListener('click', (e) => {
  if (notifDropdownOpen && !e.target.closest('.notif-wrap')) {
    notifDropdownOpen = false;
    render();
  }
});

// ── SUPPORT CHAT ──
let supportOpen = false;
let supportTickets = [];
let supportActiveTicket = null;
let supportMessages = [];

function toggleSupport() {
  supportOpen = !supportOpen;
  let panel = document.getElementById('support-panel');
  let fab = document.getElementById('support-fab');
  if (supportOpen) {
    if (!panel) {
      panel = document.createElement('div');
      panel.id = 'support-panel';
      panel.className = 'support-panel';
      document.body.appendChild(panel);
    }
    panel.style.display = 'flex';
    if (fab) fab.style.display = 'none';
    loadSupportTickets();
  } else {
    if (panel) panel.style.display = 'none';
    if (fab) fab.style.display = 'flex';
  }
}

async function loadSupportTickets() {
  const r = await api('/api/support/tickets');
  if (r.ok) { supportTickets = r.data; renderSupportPanel(); }
}

function renderSupportPanel() {
  const panel = document.getElementById('support-panel');
  if (!panel) return;
  if (supportActiveTicket) { renderSupportChat(); return; }
  panel.innerHTML = `
    <div class="support-header"><h4>💬 Soporte</h4><button style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer" onclick="toggleSupport()">✕</button></div>
    <div style="padding:10px"><button style="width:100%;padding:10px;background:#9C27B0;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px" onclick="newSupportTicket()">+ Nueva consulta</button></div>
    <div class="support-tickets-list">
      ${supportTickets.length === 0 ? '<p style="text-align:center;color:#888;padding:30px 0">Sin conversaciones.<br>Crea una nueva consulta.</p>' :
        supportTickets.map(t => `<div class="support-ticket-item" onclick="openSupportTicket(${t.id})">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <strong style="font-size:13px;color:var(--text)">${t.subject}</strong>
            <span style="font-size:10px;padding:2px 8px;border-radius:4px;background:${t.status==='open'?'#E8F5E9':'#f5f5f5'};color:${t.status==='open'?'#4CAF50':'#999'}">${t.status==='open'?'Abierto':'Cerrado'}</span>
          </div>
          <div style="font-size:11px;color:#888;margin-top:4px">${timeSince(t.updated_at)}</div>
        </div>`).join('')}
    </div>`;
}

async function newSupportTicket() {
  const subject = prompt('Asunto de tu consulta:');
  if (!subject) return;
  const r = await api('/api/support/tickets', { method: 'POST', body: JSON.stringify({ subject }) });
  if (r.ok) { supportActiveTicket = r.data.id; loadSupportMessages(); }
}

async function openSupportTicket(id) {
  supportActiveTicket = id;
  loadSupportMessages();
}

async function loadSupportMessages() {
  const r = await api('/api/support/tickets/' + supportActiveTicket + '/messages');
  if (r.ok) { supportMessages = r.data; renderSupportChat(); }
}

function renderSupportChat() {
  const panel = document.getElementById('support-panel');
  if (!panel) return;
  const ticket = supportTickets.find(t => t.id === supportActiveTicket);
  panel.innerHTML = `
    <div class="support-header">
      <div style="display:flex;align-items:center;gap:8px">
        <button style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer" onclick="supportActiveTicket=null;renderSupportPanel()">←</button>
        <h4>${ticket?.subject || 'Soporte'}</h4>
      </div>
      <button style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer" onclick="toggleSupport()">✕</button>
    </div>
    <div class="support-messages" id="support-msgs">
      ${supportMessages.length === 0 ? '<p style="text-align:center;color:#888;padding:20px;font-size:13px">Envia tu primer mensaje</p>' :
        supportMessages.map(m => {
          const isUser = m.sender_type === 'user';
          const attachs = m.attachments || [];
          return `<div class="support-msg ${isUser ? 'user' : 'admin'}">
            ${!isUser ? '<div style="font-size:10px;font-weight:600;margin-bottom:2px">Soporte</div>' : ''}
            ${m.message || ''}
            ${attachs.length > 0 ? `<div class="msg-attach">${attachs.map(a => `<a href="data:${a.type};base64,${a.data}" download="${a.name}">📎 ${a.name}</a>`).join('')}</div>` : ''}
            <div class="msg-time">${new Date(m.created_at).toLocaleString('es',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
          </div>`;
        }).join('')}
    </div>
    <div class="support-input-area">
      <label style="cursor:pointer;font-size:18px;padding:4px" title="Adjuntar archivo">📎<input type="file" id="support-files" multiple accept="image/*,.pdf,.txt" style="display:none" onchange="updateFileLabel()"/></label>
      <textarea id="support-msg-input" placeholder="Escribe tu mensaje..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendSupportMsg()}"></textarea>
      <button onclick="sendSupportMsg()">Enviar</button>
    </div>
    <div id="support-file-label" style="padding:0 10px 6px;font-size:11px;color:#888"></div>`;
  const msgs = document.getElementById('support-msgs');
  if (msgs) setTimeout(() => msgs.scrollTop = msgs.scrollHeight, 50);
}

function updateFileLabel() {
  const input = document.getElementById('support-files');
  const label = document.getElementById('support-file-label');
  if (!input || !label) return;
  const files = Array.from(input.files || []);
  if (files.length === 0) { label.textContent = ''; return; }
  if (files.length > 4) { label.innerHTML = '<span style="color:#F44336">Maximo 4 adjuntos</span>'; return; }
  const tooLarge = files.find(f => f.size > 3 * 1024 * 1024);
  if (tooLarge) { label.innerHTML = '<span style="color:#F44336">' + tooLarge.name + ' supera 3MB</span>'; return; }
  label.textContent = files.map(f => f.name).join(', ');
}

async function sendSupportMsg() {
  const msg = document.getElementById('support-msg-input')?.value?.trim();
  const fileInput = document.getElementById('support-files');
  const files = Array.from(fileInput?.files || []);
  if (!msg && files.length === 0) return;
  if (files.length > 4) { alert('Maximo 4 adjuntos'); return; }
  if (files.find(f => f.size > 3 * 1024 * 1024)) { alert('Cada adjunto no puede superar 3MB'); return; }

  const formData = new FormData();
  formData.append('message', msg || '');
  files.forEach(f => formData.append('files', f));

  const r = await fetch('/api/support/tickets/' + supportActiveTicket + '/messages', {
    method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: formData
  });
  if (r.ok) {
    document.getElementById('support-msg-input').value = '';
    if (fileInput) fileInput.value = '';
    updateFileLabel();
    loadSupportMessages();
  }
}

setInterval(() => { if (supportOpen && supportActiveTicket) loadSupportMessages(); }, 5000);

function showHelp(key, btn) {
  const h = helpContent[key];
  if (!h) return;
  if (btn) btn.classList.add('clicked');
  const overlay = document.createElement('div');
  overlay.className = 'help-modal-overlay';
  overlay.onmousedown = function(e) { if (e.target === this) this.remove(); };
  overlay.innerHTML = `<div class="help-modal">
    <div class="help-modal-header"><h3>❓ ${h.title}</h3><button class="help-modal-close" onclick="this.closest('.help-modal-overlay').remove()">✕</button></div>
    <div class="help-modal-body">${h.body}</div>
  </div>`;
  document.body.appendChild(overlay);
}

async function loadOutages(id,days) {

function fmtDuration(min) {
  if (min < 1) return '<1 min';
  if (min < 60) return min + ' min';
  const h = Math.floor(min/60);
  const m = min % 60;
  if (h < 24) return h + 'h ' + (m>0?m+'m':'');
  const d = Math.floor(h/24);
  const rh = h % 24;
  return d + 'd ' + (rh>0?rh+'h':'');
}

let editMapInstance = null;
let editMapMarker = null;
function openEditModal(id) {
  const m=machines.find(x=>x.id===id);
  if(!m)return;
  pauseRefresh();
  activeModal={type:'edit',machineId:id,data:{...m}};
  render();
  setTimeout(initEditMap, 150);
}
function initEditMap() {
  const el = document.getElementById('edit-map');
  if (!el) return;
  loadLeaflet(() => {
    if (editMapInstance) { editMapInstance.remove(); editMapInstance = null; }
    const d = activeModal?.data;
    const lat = d?.geo_lat ? parseFloat(d.geo_lat) : -34.48;
    const lon = d?.geo_lon ? parseFloat(d.geo_lon) : -58.62;
    const hasCoords = d?.geo_lat && d?.geo_lon;
    editMapInstance = L.map(el, {zoomControl: true}).setView([lat, lon], hasCoords ? 15 : 10);
    L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {attribution:'© Google Maps', maxZoom:20}).addTo(editMapInstance);
    if (hasCoords) {
      editMapMarker = L.marker([lat, lon], {draggable: true}).addTo(editMapInstance);
      editMapMarker.on('dragend', function() {
        const p = editMapMarker.getLatLng();
        setEditGeoFromMap(p.lat, p.lng);
      });
    }
    editMapInstance.on('click', function(e) {
      setEditGeoFromMap(e.latlng.lat, e.latlng.lng);
    });
  });
}
function setEditGeoFromMap(lat, lng) {
  const flatLat = parseFloat(lat).toFixed(6);
  const flatLon = parseFloat(lng).toFixed(6);
  document.getElementById('ed-geo-lat').value = flatLat;
  document.getElementById('ed-geo-lon').value = flatLon;
  activeModal.data.geo_lat = flatLat;
  activeModal.data.geo_lon = flatLon;
  if (editMapMarker) { editMapMarker.setLatLng([lat, lng]); }
  else { editMapMarker = L.marker([lat, lng], {draggable: true}).addTo(editMapInstance); editMapMarker.on('dragend', function() { const p = editMapMarker.getLatLng(); setEditGeoFromMap(p.lat, p.lng); }); }
  fetch('https://photon.komoot.io/reverse?lon='+flatLon+'&lat='+flatLat+'&lang=es')
    .then(r=>r.json()).then(rj=>{
      const p = rj.features?.[0]?.properties || {};
      const city = p.city||p.town||p.village||p.district||p.suburb||'';
      const region = p.state||'';
      const country = p.country||'';
      document.getElementById('ed-geo-city').value = city;
      document.getElementById('ed-geo-region').value = region;
      document.getElementById('ed-geo-country').value = country;
      activeModal.data.geo_city = city;
      activeModal.data.geo_region = region;
      activeModal.data.geo_country = country;
      const res = document.getElementById('geocode-result');
      if (res) res.innerHTML = '<span style="color:#4CAF50">📍 ' + [city,region,country].filter(Boolean).join(', ') + '</span>';
    }).catch(()=>{});
}

function buildMetricsModal() {
  const m=machines.find(x=>x.id===activeModal.machineId);
  const data=activeModal.data||[];
  const cpuVals=data.filter(d=>d.cpu!=null).map(d=>parseFloat(d.cpu));
  const ramVals=data.filter(d=>d.ram!=null).map(d=>parseFloat(d.ram));
  const pingVals=data.filter(d=>d.ping!=null).map(d=>parseInt(d.ping));
  const ramTotal=data.find(d=>d.ram_total)?.ram_total||1;
  const timeLabels=data.map(d=>{ const dt=new Date(d.time); return dt.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}); });

  const diskData={};
  data.forEach(d=>{
    if(d.disks&&Array.isArray(d.disks)) d.disks.forEach(dk=>{
      if(!diskData[dk.drive])diskData[dk.drive]={vals:[],total:dk.total||1};
      diskData[dk.drive].vals.push(dk.used);
    });
  });

  const diskCharts = Object.entries(diskData).map(([drive,dd],i)=>`
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;font-weight:700;color:#666">Disco ${drive}</span><span style="font-size:12px;color:#999">${dd.vals.slice(-1)[0]?.toFixed?.(1)||'?'}/${dd.total} GB</span></div>
      <div style="height:140px"><canvas id="chart-disk-${i}"></canvas></div>
    </div>`).join('');

  const html = `<div class="modal-overlay" onmousedown="if(event.target===this)closeModal()">
  <div class="modal-box wide">
    <div class="modal-header"><h2>📈 Metricas — ${m?.machine_name||''}</h2><button class="modal-close" onclick="closeModal()">Cerrar</button></div>
    <div class="day-tabs">
      ${[6,24,48,72,168].map(h=>`<button class="day-tab ${metricsHours===h?'active':''}" onclick="metricsHours=${h};loadMetrics(${activeModal.machineId},${h})">${h<24?h+'h':(h/24)+'d'}</button>`).join('')}
    </div>
    <p style="font-size:11px;color:#ccc;margin-bottom:14px">${data.length} puntos de datos</p>
    ${!activeModal.data?'<p style="color:#999;text-align:center">Cargando...</p>':`
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;font-weight:700;color:#666">CPU / RAM</span><span style="font-size:12px;color:#999">${cpuVals.length>0?'CPU avg: '+Math.round(avgArr(cpuVals))+'% | RAM avg: '+(avgArr(ramVals)).toFixed(1)+'/'+ramTotal+' GB':'—'}</span></div>
      <div style="height:200px"><canvas id="chart-cpu-ram"></canvas></div>
    </div>
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;font-weight:700;color:#666">Ping</span><span style="font-size:12px;color:#999">${pingVals.length>0?'Avg: '+Math.round(avgArr(pingVals))+'ms | Max: '+Math.max(...pingVals)+'ms':'—'}</span></div>
      <div style="height:140px"><canvas id="chart-ping"></canvas></div>
    </div>
    ${diskCharts}
    `}
  </div></div>`;

  if (activeModal.data && data.length > 0) {
    setTimeout(()=>{
      const ramPctVals = ramVals.map(v=>Math.round(v/ramTotal*100));
      createLineChart('chart-cpu-ram', timeLabels, [
        { label:'CPU %', data:cpuVals, borderColor:'#4CAF50', backgroundColor:'rgba(76,175,80,0.08)', fill:true },
        { label:'RAM %', data:ramPctVals, borderColor:'#2196F3', backgroundColor:'rgba(33,150,243,0.08)', fill:true }
      ], {unit:'%', max:100});
      createLineChart('chart-ping', timeLabels, [
        { label:'Ping', data:pingVals, borderColor:'#FF9800', backgroundColor:'rgba(255,152,0,0.08)', fill:true }
      ], {unit:'ms'});
      Object.entries(diskData).forEach(([drive,dd],i)=>{
        const pctVals = dd.vals.map(v=>Math.round(v/dd.total*100));
        createLineChart('chart-disk-'+i, timeLabels, [
          { label:drive+' %', data:pctVals, borderColor:'#9C27B0', backgroundColor:'rgba(156,39,176,0.08)', fill:true }
        ], {unit:'%', max:100});
      });
    }, 150);
  }

  return html;
}

let fullMapInstance=null;
function initFullMap() {
  const el=document.getElementById('fullMap');
  if(!el)return;
  const pts=machines.filter(m=>m.geo_lat&&m.geo_lon).map(m=>({lat:parseFloat(m.geo_lat),lon:parseFloat(m.geo_lon),name:m.machine_name,online:m.is_online,ip:m.public_ip}));
  if(pts.length===0){el.innerHTML='<div style="padding:40px;text-align:center;color:#ccc">Sin datos de geolocalización</div>';return;}
  loadLeaflet(()=>{
    if(fullMapInstance){fullMapInstance.remove();fullMapInstance=null;}
    const center=[pts.reduce((a,p)=>a+p.lat,0)/pts.length,pts.reduce((a,p)=>a+p.lon,0)/pts.length];
    fullMapInstance=L.map(el).setView(center,5);
    L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{attribution:'© Google Maps',maxZoom:20}).addTo(fullMapInstance);
    pts.forEach(p=>{
      const c=p.online?'#4CAF50':'#F44336';
      L.circleMarker([p.lat,p.lon],{radius:10,color:c,fillColor:c,fillOpacity:.85}).bindPopup(`<strong>${p.name}</strong><br>${p.online?'🟢 Online':'🔴 Offline'}<br><small>${p.ip||''}</small>`).addTo(fullMapInstance);
    });
    if(pts.length>1)fullMapInstance.fitBounds(pts.map(p=>[p.lat,p.lon]),{padding:[20,20]});
  });
}

  const pts=machines.filter(m=>m.geo_lat&&m.geo_lon);

// ── DATA LOADING ──
let _lastMachinesJson = '';
async function loadMachines() {
  const r=await api('/api/machines');
  if(r.ok){
    const newJson = JSON.stringify(r.data);
    const changed = newJson !== _lastMachinesJson;
    _lastMachinesJson = newJson;
    machines=r.data;
    if (activeModal || notifDropdownOpen || activeNav === 'ajustes') { if (changed) updateHeaderBadge(); }
    else if (changed) render();
  }
  else if(r.status===401){logout();}
}
function updateHeaderBadge() {
  const badge = document.querySelector('.badge-dot');
  const count = machines.filter(m=>!m.is_online).length + getThresholdAlerts().length;
  if (badge) badge.textContent = count > 0 ? count : '';
}

  const r=await api('/api/agent/version');

let sslMonitors = [];
async function loadSSLMonitors() {
  const r = await api('/api/ssl-monitors');
  if (r.ok) { sslMonitors = r.data; renderSSLList(); }
}
function renderSSLList() {
  const el = document.getElementById('ssl-list');
  if (!el) return;
  if (sslMonitors.length === 0) { el.innerHTML = '<p style="color:#888;text-align:center;font-size:13px">Sin certificados monitoreados</p>'; return; }
  el.innerHTML = sslMonitors.map(s => {
    const color = s.last_status === 'ok' ? '#4CAF50' : s.last_status === 'warning' ? '#FF9800' : s.last_status === 'expired' ? '#F44336' : '#888';
    const icon = s.last_status === 'ok' ? '🟢' : s.last_status === 'warning' ? '🟡' : s.last_status === 'expired' ? '🔴' : '⏳';
    const days = s.alert_days || [30,14,7,1];
    return `<div style="background:var(--bg);border-left:3px solid ${color};border-radius:0 10px 10px 0;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px">
      <span style="font-size:16px">${icon}</span>
      <div style="flex:1">
        <div style="font-weight:700;font-size:13px;color:var(--text)">${s.name || s.hostname}</div>
        <div style="font-size:11px;color:#888">${s.hostname} · ${s.last_issuer || '?'} · ${s.last_days_left != null ? s.last_days_left + ' dias restantes' : 'Sin chequear'}</div>
        <div style="font-size:10px;color:#999;margin-top:2px">Alertas: ${days.map(d => `<span style="background:var(--border2);padding:1px 6px;border-radius:3px;margin-right:3px">${d}d</span>`).join('')}</div>
      </div>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="modal-btn sm" style="padding:4px 8px;font-size:11px;margin-top:0;border-radius:6px" onclick="checkSSL('${s.hostname}')">Verificar</button>
        <button class="modal-btn sm" style="padding:4px 8px;font-size:11px;margin-top:0;border-radius:6px" onclick="editSSLDays(${s.id})">⚙ Dias</button>
        <button class="modal-btn sm" style="background:#FFEBEE;color:#F44336;padding:4px 8px;font-size:11px;margin-top:0;border-radius:6px" onclick="deleteSSLMonitor(${s.id})">✕</button>
      </div>
    </div>`;
  }).join('');
}
async function addSSLMonitor() {
  const hostname = document.getElementById('ssl-hostname')?.value?.trim();
  const name = document.getElementById('ssl-name')?.value?.trim();
  if (!hostname) { alert('Ingresa el dominio'); return; }
  const r = await api('/api/ssl-monitors', { method: 'POST', body: JSON.stringify({ hostname, name }) });
  if (r.ok) { document.getElementById('ssl-hostname').value = ''; document.getElementById('ssl-name').value = ''; loadSSLMonitors(); }
  else alert(r.data?.error || 'Error');
}
async function deleteSSLMonitor(id) {
  if (!confirm('Eliminar monitor SSL?')) return;
  await api('/api/ssl-monitors/' + id, { method: 'DELETE' });
  loadSSLMonitors();
}
function editSSLDays(id) {
  const mon = sslMonitors.find(s => s.id === id);
  const current = (mon?.alert_days || [30,14,7,1]).join(', ');
  const input = prompt('Dias antes del vencimiento para alertar (separados por coma):', current);
  if (input === null) return;
  const days = input.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n > 0).sort((a,b) => b-a);
  if (days.length === 0) { alert('Ingresa al menos un numero'); return; }
  api('/api/ssl-monitors/' + id, { method: 'PUT', body: JSON.stringify({ alert_days: days }) }).then(() => loadSSLMonitors());
}

function openAddUrlMonitor() {
  pauseRefresh();
  activeModal = { type: 'addurl' };
  render();
}
async function saveUrlMonitor() {
  const data = {
    url: document.getElementById('um-url')?.value?.trim(),
    name: document.getElementById('um-name')?.value?.trim() || null,
    method: document.getElementById('um-method')?.value || 'GET',
    expected_status: parseInt(document.getElementById('um-status')?.value) || 200,
    timeout_ms: parseInt(document.getElementById('um-timeout')?.value) || 10000,
    interval_seconds: parseInt(document.getElementById('um-interval')?.value) || 300
  };
  if (!data.url) { alert('URL requerida'); return; }
  const r = await api('/api/url-monitors', { method: 'POST', body: JSON.stringify(data) });

  else alert(r.data?.error || 'Error');
}
async function toggleUrlMonitor(id, currentActive) {
  await api('/api/url-monitors/' + id, { method: 'PUT', body: JSON.stringify({ is_active: !currentActive }) });

}
async function deleteUrlMonitor(id) {
  if (!confirm('¿Eliminar este monitor?')) return;
  await api('/api/url-monitors/' + id, { method: 'DELETE' });
  loadUrlMonitors();
}

let maintenanceWindows = [];

function buildMaintenanceSection() {
  const now = new Date();
  const active = maintenanceWindows.filter(w => new Date(w.start_time) <= now && new Date(w.end_time) >= now);

  return `<div class="panel">
    <div class="panel-title"><span class="dot" style="background:#FF9800"></span>Ventanas de Mantenimiento<button class="help-btn" onclick="event.stopPropagation();showHelp('maintenance',this)">?</button></div>
