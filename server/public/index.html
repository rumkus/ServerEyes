      ${[[60,'1 min'],[300,'5 min'],[600,'10 min'],[1800,'30 min']].map(([v,t]) => `
        <button class="chip chip-intervalo" style="font-size:12px;${intervalo === v ? 'background:#2196F3;color:#fff' : ''}"
          onclick="document.getElementById('um-interval').value=${v};document.querySelectorAll('.chip-intervalo').forEach(c=>{c.style.background='';c.style.color=''});this.style.background='#2196F3';this.style.color='#fff'">${t}</button>`).join('')}
    </div>
    <input type="hidden" id="um-interval" value="${intervalo}"/>
    <input type="hidden" id="um-method" value="${m ? escHtml(m.method || 'GET') : 'GET'}"/>
    <input type="hidden" id="um-status" value="${m ? (m.expected_status || 200) : 200}"/>
    <label class="modal-label">Avisar tambien a (opcional)</label>
    <input class="modal-input" id="um-correos" placeholder="cliente@empresa.com, soporte@empresa.com" value="${m ? escHtml((m.destinatarios || []).filter(d => d.estado !== 'baja').map(d => d.email).join(', ')) : ''}"/>
    <p style="font-size:11px;color:#888;margin:2px 0 16px;line-height:1.5">A cada uno le llega un mail pidiendole permiso, con tu nombre y que se vigila. <strong>No recibe alertas hasta que acepta</strong>, y puede darse de baja solo. Separados por coma.</p>
    ${m ? detalleDestinatarios('url', m.id, m.destinatarios) : ''}
    <input type="hidden" id="um-timeout" value="${m ? (m.timeout_ms || 10000) : 10000}"/>
    ${m ? '' : `<label style="display:flex;align-items:flex-start;gap:8px;margin:4px 0 12px;cursor:pointer">
      <input type="checkbox" id="um-ssl" checked style="margin-top:2px"/>
      <span style="font-size:13px;color:var(--text);line-height:1.4">Vigilar tambien su certificado SSL
        <span style="display:block;font-size:11px;color:#888">El chequeo de URL ignora los problemas de certificado a proposito, asi que sin esto un certificado vencido no dispara ninguna alerta.</span>
      </span>
    </label>`}
    <button class="modal-btn" onclick="saveUrlMonitor()">${m ? 'Guardar cambios' : 'Agregar monitor'}</button>
    ${m ? `<button class="modal-btn ghost" onclick="crearSslDesdeUrl(${m.id})">🔒 Vigilar tambien su certificado SSL</button>` : ''}
    <button class="modal-btn ghost" onclick="closeModal()">Cancelar</button>
  </div></div>`;
}

function openEditUrlMonitor(id) {
  pauseRefresh();
  activeModal = { type: 'addurl', editId: id };
  render();
}

// ── Modal de SSL: editar dominio, nombre y dias de aviso ─────────────────────
function openEditSsl(id) {
  pauseRefresh();
  activeModal = { type: 'editssl', id };
  render();
}
function buildEditSslModal() {
  const m = sslMonitors.find(x => x.id === activeModal.id);
  if (!m) return '';
  const dias = (m.alert_days || [30,14,7,1]).join(', ');
  return `<div class="modal-overlay" onmousedown="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-header"><h2>🔒 Editar Monitor SSL</h2><button class="modal-close" onclick="closeModal()">Cerrar</button></div>
    <label class="modal-label">Dominio</label>
    <input class="modal-input" id="sm-hostname" placeholder="ejemplo.com" value="${escHtml(m.hostname)}"/>
    <p style="font-size:11px;color:#888;margin:-6px 0 10px">Si cambias el dominio, lo chequeado hasta ahora se descarta y se vuelve a verificar.</p>
    <label class="modal-label">Nombre (opcional)</label>
    <input class="modal-input" id="sm-name" placeholder="Mi sitio" value="${escHtml(m.name || '')}"/>
    <label class="modal-label">Avisar estos dias antes de vencer</label>
    <input class="modal-input" id="sm-dias" placeholder="30, 14, 7, 1" value="${escHtml(dias)}"/>
    <label class="modal-label">Avisar tambien a (opcional)</label>
    <input class="modal-input" id="sm-correos" placeholder="cliente@empresa.com" value="${escHtml((m.destinatarios || []).filter(d => d.estado !== 'baja').map(d => d.email).join(', '))}"/>
    <p style="font-size:11px;color:#888;margin:2px 0 16px;line-height:1.5">A cada uno le llega un mail pidiendole permiso. <strong>No recibe alertas hasta que acepta</strong>, y puede darse de baja solo.</p>
    ${detalleDestinatarios('ssl', m.id, m.destinatarios)}
    <button class="modal-btn" onclick="saveSslMonitor()">Guardar cambios</button>
    <button class="modal-btn ghost" onclick="crearUrlDesdeSsl(${m.id})">🌐 Vigilar tambien que el sitio responda</button>
    <button class="modal-btn ghost" onclick="closeModal()">Cancelar</button>
  </div></div>`;
}
async function saveSslMonitor() {
  const hostname = document.getElementById('sm-hostname')?.value?.trim();
  const name = document.getElementById('sm-name')?.value?.trim();
  const diasTxt = document.getElementById('sm-dias')?.value || '';
  if (!hostname) { avisar('Error', 'Ingresa el dominio', '⚠️'); return; }
  const alert_days = diasTxt.split(',').map(x => parseInt(x.trim())).filter(n => !isNaN(n) && n > 0).sort((a,b) => b-a);
  if (alert_days.length === 0) { avisar('Error', 'Ingresa al menos un numero de dias', '⚠️'); return; }
  const r = await api('/api/ssl-monitors/' + activeModal.id, {
    method: 'PUT', body: JSON.stringify({ hostname, name: name || null, alert_days, notify_emails: correosDelCampo('sm-correos') })
  });
  if (r.ok) { closeModal(); loadSSLMonitors(); }
  else avisar('Error', r.data?.error || 'Error', '⚠️');
}

// ── Pasar de una lista a la otra ─────────────────────────────────────────────
// Crean el monitor equivalente sin borrar el original: si despues no lo queres,
// lo eliminas de la otra lista.
// Aceptan uno o varios ids: el boton de la fila manda uno, el de la barra de
// seleccion manda todos los tildados.
async function crearSslDesdeUrl(ids) {
  const lista = (Array.isArray(ids) ? ids : [ids]).map(id => urlMonitors.find(x => x.id === id)).filter(Boolean);
  const nuevos = [], yaEstaban = [], sinDominio = [];
  for (const u of lista) {
    let hostname;
    try { hostname = new URL(u.url).hostname; } catch (e) { sinDominio.push(u.url); continue; }
    if (sslMonitors.some(x => x.hostname === hostname) || nuevos.some(x => x.hostname === hostname)) { yaEstaban.push(hostname); continue; }
    nuevos.push({ hostname, name: u.name || hostname });
  }
  if (nuevos.length === 0) {
    await avisar('Nada para agregar',
      yaEstaban.length ? 'Ya tenes monitor SSL de ' + yaEstaban.join(', ') : 'No pude sacar el dominio de ' + sinDominio.join(', '), '🔒');
    return;
  }
  const ok = await confirmar({
    icono: '🔒', titulo: nuevos.length === 1 ? 'Vigilar su certificado' : `Vigilar ${nuevos.length} certificados`,
    mensaje: 'Se agregan a Monitoreo de Certificados SSL. Los monitores de URL quedan como estan.',
    detalle: nuevos.map(n => escHtml(n.hostname)).join('<br>') +
      (yaEstaban.length ? `<div style="margin-top:8px;color:#FF9800">Ya estaban: ${escHtml(yaEstaban.join(', '))}</div>` : ''),
    ok: 'Agregar'
  });
  if (!ok) return;
  let fallaron = 0;
  for (const n of nuevos) {
    const r = await api('/api/ssl-monitors', { method: 'POST', body: JSON.stringify(n) });
    if (!r.ok) fallaron++;
  }
  urlsSeleccionadas.clear();
  await loadSSLMonitors();
  render();
  if (fallaron) await avisar('Algunos no se pudieron agregar', `${fallaron} de ${nuevos.length} fallaron`, '⚠️');
}

async function crearUrlDesdeSsl(ids) {
  const lista = (Array.isArray(ids) ? ids : [ids]).map(id => sslMonitors.find(x => x.id === id)).filter(Boolean);
  const nuevos = [], yaEstaban = [];
  for (const m of lista) {
    const url = 'https://' + m.hostname + '/';
    if (urlMonitors.some(u => u.url === url) || nuevos.some(n => n.url === url)) { yaEstaban.push(m.hostname); continue; }
    nuevos.push({ url, name: m.name || m.hostname, method: 'GET', expected_status: 200, timeout_ms: 10000, interval_seconds: 300 });
  }
  if (nuevos.length === 0) {
    await avisar('Nada para agregar', 'Ya tenes monitor de URL de ' + yaEstaban.join(', '), '🌐');
    return;
  }
  const ok = await confirmar({
    icono: '🌐', titulo: nuevos.length === 1 ? 'Vigilar que responda' : `Vigilar ${nuevos.length} sitios`,
    mensaje: 'Se agregan a Monitoreo de URLs, chequeando cada 5 minutos. Los monitores SSL quedan como estan.',
    detalle: nuevos.map(n => escHtml(n.url)).join('<br>') +
      (yaEstaban.length ? `<div style="margin-top:8px;color:#FF9800">Ya estaban: ${escHtml(yaEstaban.join(', '))}</div>` : ''),
    ok: 'Agregar'
  });
  if (!ok) return;
  let fallaron = 0;
  for (const n of nuevos) {
    const r = await api('/api/url-monitors', { method: 'POST', body: JSON.stringify(n) });
    if (!r.ok) fallaron++;
  }
  sslSeleccionados.clear();
  await loadUrlMonitors();
  render();
  if (fallaron) await avisar('Algunos no se pudieron agregar', `${fallaron} de ${nuevos.length} fallaron`, '⚠️');
}

// ── Seleccion multiple ──────────────────────────────────────────────────────
let urlsSeleccionadas = new Set();
let sslSeleccionados = new Set();
function marcarUrl(id, tildado) { tildado ? urlsSeleccionadas.add(id) : urlsSeleccionadas.delete(id); render(); }
function marcarSsl(id, tildado) { tildado ? sslSeleccionados.add(id) : sslSeleccionados.delete(id); render(); }
function marcarTodasUrls(tildado) {
  urlsSeleccionadas.clear();
  if (tildado) urlMonitors.forEach(u => urlsSeleccionadas.add(u.id));
  render();
}
function marcarTodosSsl(tildado) {
  sslSeleccionados.clear();
  if (tildado) sslMonitors.forEach(m => sslSeleccionados.add(m.id));
  render();
}
function barraSeleccion(cantidad, texto, accion, limpiar) {
  // Devolvemos siempre un nodo, vacio cuando no hay nada seleccionado: si
  // aparece y desaparece, cambia la cantidad de hermanos y el morfeo termina
  // reemplazando la tabla entera en vez de solo lo que cambio.
  if (cantidad === 0) return '<div></div>';
  return `<div style="display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:8px;padding:8px 12px;margin-bottom:10px">
    <strong style="font-size:13px;color:var(--text)">${cantidad} seleccionada${cantidad > 1 ? 's' : ''}</strong>
    <button class="modal-btn sm" style="margin-top:0;padding:5px 12px;font-size:12px;border-radius:6px" onclick="${accion}">${texto}</button>
    <button class="modal-btn sm ghost" style="margin-top:0;padding:5px 10px;font-size:12px;border-radius:6px" onclick="${limpiar}">Limpiar</button>
  </div>`;
}

  const inOneHour = new Date(now.getTime() - now.getTimezoneOffset()*60000 + 3600000).toISOString().slice(0,16);
  return `<div class="modal-overlay" onmousedown="if(event.target===this)closeModal()">

    </div>

    <select class="modal-input" id="mw-repeat">
      <option value="none">No repetir</option>

      <option value="monthly">Mensual</option>
    </select>
    <p style="font-size:11px;color:#999;margin-top:8px">Las alertas se silencian durante la ventana de mantenimiento.</p>
    <button class="modal-btn" onclick="saveMaintenance()">Crear ventana</button>
    <button class="modal-btn ghost" onclick="closeModal()">Cancelar</button>
  </div></div>`;
}
