let nocMapInstance = null;

let _firmaMapa = null;
function initInlineMap() {
  const el = document.getElementById('nocMap');
  if (!el) return;
  const pts = machines.filter(m=>m.geo_lat&&m.geo_lon).map(m=>({
    lat:parseFloat(m.geo_lat), lon:parseFloat(m.geo_lon),
    name:m.machine_name, online:m.is_online, ip:m.public_ip
  }));
  // Rearmarlo en cada refresco te devolvia el zoom y el centro al inicio.
  const firma = JSON.stringify(pts);
  if (firma === _firmaMapa && nocMapInstance) return;
  _firmaMapa = firma;
  if (pts.length===0) {
    if (nocMapInstance) { nocMapInstance.remove(); nocMapInstance=null; }
    el.innerHTML = mapaVacio();
    return;
  }
  loadLeaflet(()=>{
    if (nocMapInstance) { nocMapInstance.remove(); nocMapInstance=null; }
    const center = [pts.reduce((a,p)=>a+p.lat,0)/pts.length, pts.reduce((a,p)=>a+p.lon,0)/pts.length];
    nocMapInstance = L.map(el, {zoomControl:true}).setView(center, 5);
    L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{attribution:'© Google Maps',maxZoom:20}).addTo(nocMapInstance);
    pts.forEach(p=>{
      const c = p.online?'#4CAF50':'#F44336';
      L.circleMarker([p.lat,p.lon],{radius:9,color:c,fillColor:c,fillOpacity:.85,weight:2})
        .bindPopup(`<strong>${p.name}</strong><br>${p.online?'🟢 Online':'🔴 Offline'}<br><small>${p.ip||''}</small>`)
        .addTo(nocMapInstance);
    });
    if (pts.length>1) nocMapInstance.fitBounds(pts.map(p=>[p.lat,p.lon]),{padding:[20,20]});
  });
}

function loadLeaflet(cb) {
  if (window.L) { cb(); return; }
  if (!document.getElementById('lf-css')) {
    const css = document.createElement('link');
    css.id='lf-css'; css.rel='stylesheet';
    css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
  }
  if (!document.getElementById('lf-js')) {
    const js = document.createElement('script');
    js.id='lf-js'; js.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.onload=cb; document.head.appendChild(js);
  } else {
    setTimeout(()=>{ if(window.L) cb(); else loadLeaflet(cb); }, 100);
  }
}

function loadChartJs(cb) {
  if (window.Chart) { cb(); return; }
  if (!document.getElementById('cjs')) {
    const js = document.createElement('script');
    js.id='cjs'; js.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js';
    js.onload=cb; document.head.appendChild(js);
  } else {
    setTimeout(()=>{ if(window.Chart) cb(); else loadChartJs(cb); }, 100);
  }
}

let chartInstances = {};
function createLineChart(canvasId, labels, datasets, opts={}) {
  loadChartJs(()=>{
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    if (chartInstances[canvasId]) { chartInstances[canvasId].destroy(); }
    chartInstances[canvasId] = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
          tooltip: { callbacks: { label: (c) => c.dataset.label + ': ' + c.parsed.y + (opts.unit||'') } }
        },
        scales: {
          x: { display: true, ticks: { maxTicksLimit: 8, font: { size: 10 }, color: '#999' }, grid: { display: false } },
          y: { min: opts.min||0, max: opts.max||undefined, ticks: { font: { size: 10 }, color: '#999', callback: (v)=>v+(opts.unit||'') }, grid: { color: '#f0f2f5' } }
        },
        elements: { point: { radius: 0, hitRadius: 8 }, line: { tension: 0.3, borderWidth: 2 } },
        animation: { duration: 400 }
      }
    });
  });
}

let sparkData = {};
async function loadSparklines() {
  const r = await api('/api/machines/sparklines');
  if (r.ok) {
    sparkData = r.data;
    // Update sparkline SVGs in NOC cards without full render
    for (const [id, pts] of Object.entries(sparkData)) {
      const el = document.getElementById('spark-' + id);
      if (el && pts.length > 1) {
        const cpuVals = pts.map(p => p.cpu != null ? parseFloat(p.cpu) : 0);
        el.innerHTML = miniSparkSVG(cpuVals, '#4CAF50');
      }
    }
  }
}
function miniSparkSVG(values, color) {
  if (!values || values.length < 2) return '';
  const max = Math.max(...values, 1), w = 80, h = 24;
  const pts = values.map((v, i) => `${Math.round(i / (values.length - 1) * w)},${Math.round(h - (v / max) * (h - 2) - 1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:80px;height:24px"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" opacity="0.8"/></svg>`;
}
setInterval(loadSparklines, 30000);

function fmtDuration(min) {
  if (!min) return '---';
  if (min < 60) return Math.round(min) + ' min';
  if (min < 1440) return Math.round(min / 60) + 'h ' + Math.round(min % 60) + 'min';
  return Math.floor(min / 1440) + 'd ' + Math.round((min % 1440) / 60) + 'h';
}

function buildIncidentesView() {
  return `<div id="incidents-container">${buildIncidentesContent()}</div>`;
}

// Gravedad derivada SOLO de datos existentes (tiempo abierto): no hay un campo
// de severidad en el backend, asi que se ordena por duracion y se marca el
// acento visual segun cuanto lleva abierto. No inventa un estado nuevo.
let incidentsFetched = false;
function incSeveridad(min){ return min>=120?'crit':min>=30?'warn':'ok'; }

function buildIncidentesContent() {
  if (incidentDetail) return buildIncidentDetail(incidentDetail);

  const open = incidentsList.filter(i => i.status === 'open')
    .map(i => ({...i, _min:(Date.now()-new Date(i.started_at).getTime())/60000}))
    .sort((a,b)=>b._min-a._min);   // el que lleva mas tiempo abierto, primero
  const resolved = incidentsList.filter(i => i.status === 'resolved');
  const graves = open.filter(i=>incSeveridad(i._min)==='crit').length;
  const loaded = incidentsFetched;

  return `<div class="panel">
    <div class="panel-head">
      <div class="panel-title" style="margin:0"><span class="dot" style="background:${open.length?'var(--crit)':'var(--ok)'}"></span>Incidentes<button class="help-btn" onclick="event.stopPropagation();showHelp('incidents',this)" aria-label="Ayuda sobre incidentes">?</button></div>
      <div class="spacer"></div>
      <button class="btn sm" onclick="incidentsLoaded=false;loadIncidents()" aria-label="Actualizar incidentes">${ico('refresh','sm')}Actualizar</button>
      <button class="btn sm" onclick="exportIncidentesPDF()" aria-label="Exportar incidentes a PDF">${ico('file','sm')}Exportar PDF</button>
    </div>
    <div class="mon-summary">
      <div class="mon-tile"><div class="mt-num ${open.length?'crit':'muted'}">${open.length}</div><div class="mt-label">Abiertos</div></div>
      <div class="mon-tile"><div class="mt-num ${graves?'crit':'muted'}">${graves}</div><div class="mt-label">+2 h abiertos</div></div>
      <div class="mon-tile"><div class="mt-num muted">${resolved.length}</div><div class="mt-label">Resueltos</div></div>
      <div class="mon-tile"><div class="mt-num muted">${incidentsList.length}</div><div class="mt-label">Total</div></div>
    </div>

    <div style="font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin:6px 0 8px">Abiertos (${open.length})</div>
    ${!loaded ? `<div class="state-block"><div class="spinner"></div><span>Cargando incidentes…</span></div>`
      : open.length===0 ? `<div class="state-block">${ico('check','lg')}<strong>Sin incidentes abiertos</strong><span>Cuando una máquina deja de responder o supera un umbral, el incidente aparece acá.</span></div>`
      : `<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">
        ${open.map(i=>{const sev=incSeveridad(i._min);return `<div class="inc-row sev-${sev}" onclick="openIncident(${i.id})" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openIncident(${i.id})}" aria-label="Incidente ${escHtml(i.title)}, ${sev==='crit'?'crítico':sev==='warn'?'atención':'reciente'}">
          <span class="inc-ico">${ico('siren')}</span>
          <div class="inc-main">
            <div class="inc-title">${escHtml(i.title)}</div>
            <div class="inc-meta">${escHtml(i.machine_name||'')} · inició ${new Date(i.started_at).toLocaleString('es',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})} · ${i.event_count||0} eventos</div>
          </div>
          <div class="inc-dur"><div class="d-num" style="color:var(--${sev})">${fmtDuration(i._min)}</div><div class="d-lbl">abierto</div></div>
        </div>`;}).join('')}
      </div>`}

    <div style="font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin:6px 0 8px">Resueltos recientes</div>
    ${!loaded ? '' : resolved.length===0 ? `<p class="empty-state">Sin incidentes resueltos</p>`
      : `<div style="display:flex;flex-direction:column;gap:5px">
        ${resolved.slice(0,20).map(i=>`<div class="inc-row sev-ok" style="opacity:.85" onclick="openIncident(${i.id})" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openIncident(${i.id})}" aria-label="Incidente resuelto ${escHtml(i.title)}">
          <span class="inc-ico" style="color:var(--ok)">${ico('check')}</span>
          <div class="inc-main"><div class="inc-title" style="font-weight:600">${escHtml(i.title)}</div>
            <div class="inc-meta">${escHtml(i.machine_name||'')} · ${new Date(i.started_at).toLocaleDateString('es')} · duró ${fmtDuration(i.duration_minutes)}</div></div>
        </div>`).join('')}
      </div>`}
  </div>`;
}

async function checkSSL(hostname) {
  const h = hostname.replace(/^https?:\/\//, '').split('/')[0];
  const res = await api('/api/ssl-check', { method: 'POST', body: JSON.stringify({ hostname: h }) });
  if (!res.ok || !res.data) { await avisar('No se pudo verificar', 'El servidor no respondio al chequeo de ' + h, '🔒'); return; }
  const d = res.data;
  if (d.error) { await avisar('No se pudo verificar', d.error, '🔒'); return; }

  const color = d.status === 'ok' ? '#4CAF50' : d.status === 'warning' ? '#FF9800' : '#F44336';
  const etiqueta = d.status === 'ok' ? 'Valido' : d.status === 'warning' ? 'Vence pronto' : 'Expirado';
  const fila = (l, v) => `<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--border2)">
    <span style="color:#888">${l}</span><span style="color:var(--text);font-weight:600;text-align:right">${escHtml(v)}</span></div>`;

  await confirmar({
    icono: '🔒',
    titulo: d.subject || h,
    soloAceptar: true,
    ok: 'Cerrar',
    detalle: `
      <div style="text-align:center;margin:-2px 0 12px">
        <span style="display:inline-block;background:${color}22;color:${color};font-weight:800;font-size:13px;padding:5px 14px;border-radius:20px">${etiqueta}</span>
      </div>
      <div style="font-size:13px">
        ${fila('Dias restantes', d.days_left != null ? d.days_left + ' dias' : '—')}
        ${fila('Vence', d.expires_at ? new Date(d.expires_at).toLocaleDateString('es', { day: '2-digit', month: 'long', year: 'numeric' }) : '—')}
        ${fila('Emisor', d.issuer || '—')}
      </div>`
  });
}

// ── USER NOTIFICATIONS ──
let userNotifs = [];
let notifDropdownOpen = false;
let knownNotifIds = new Set();

async function loadUserNotifs() {
  const res = await api('/api/notifications');
  if (!res.ok) return;
  const prev = knownNotifIds;
  const newNotifs = res.data.filter(n => !prev.has(n.id) && !n.is_read);
  userNotifs = res.data;
  knownNotifIds = new Set(res.data.map(n => n.id));
  if (prev.size > 0 && newNotifs.length > 0) {
    newNotifs.forEach(n => showNotifToast(n));
  }
  const badge = document.getElementById('notif-count-badge');
  const unread = getUnreadCount();
  if (badge) { badge.style.display = unread > 0 ? 'flex' : 'none'; badge.textContent = unread; }
  if (notifDropdownOpen) renderNotifDropdown();
}

function showNotifToast(n) {
  const toast = document.createElement('div');
  toast.className = 'notif-toast';
  toast.innerHTML = `<span class="nt-icon">💬</span><div><div class="nt-title">${n.title}</div><div class="nt-msg">${n.message}</div></div><span class="nt-close" onclick="event.stopPropagation();this.parentElement.remove()">✕</span>`;
  toast.onclick = () => { toast.remove(); toggleNotifDropdown(); };
  document.body.appendChild(toast);
  setTimeout(() => { if (toast.parentElement) toast.remove(); }, 8000);
}

function getUnreadCount() {
  return userNotifs.filter(n => !n.is_read).length;
}

function toggleNotifDropdown() {
  notifDropdownOpen = !notifDropdownOpen;
  if (notifDropdownOpen) {
    const dd = document.getElementById('notif-dropdown');
    if (dd) { dd.style.display = 'block'; }
    renderNotifDropdown();
  } else {
    render();
  }
}

function renderNotifDropdown() {
  const dd = document.getElementById('notif-dropdown');
  if (!dd) return;
  if (userNotifs.length === 0) {
    dd.innerHTML = '<div class="notif-dropdown-header">Notificaciones</div><div class="notif-empty">📭 Sin notificaciones</div>';
    return;
  }
  dd.innerHTML = '<div class="notif-dropdown-header">Notificaciones</div>' +
    userNotifs.map(n => `<div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="markNotifRead(${n.id}, this)">
      <div class="ni-title">${n.title}</div>
      <div class="ni-msg">${n.message}</div>
      <div class="ni-time">${timeSince(n.created_at)}</div>
    </div>`).join('');
}

async function markNotifRead(id, el) {
  await api('/api/notifications/' + id + '/read', { method: 'POST' });
  const n = userNotifs.find(x => x.id === id);
  if (n) n.is_read = true;
  if (el) el.classList.remove('unread');
  const badge = document.getElementById('notif-count-badge');
  const unread = getUnreadCount();
  if (badge) badge.style.display = unread > 0 ? 'flex' : 'none';
  if (badge) badge.textContent = unread;
}

document.addEventListener('click', (e) => {
  if (notifDropdownOpen && !e.target.closest('.notif-wrap')) {
    notifDropdownOpen = false;
    render();
  }
});

        <textarea class="modal-input" id="support-new-msg" placeholder="Describe tu problema o consulta..." rows="3" style="font-size:13px;padding:10px;width:100%;box-sizing:border-box;resize:none;background:var(--input-bg);color:var(--text);border:1px solid var(--border2);border-radius:10px;outline:none;font-family:inherit"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px">

          <button style="padding:10px 16px;background:var(--border2);color:var(--text);border:none;border-radius:10px;cursor:pointer;font-size:13px" onclick="supportNewMode=false;renderSupportPanel()">Cancelar</button>
        </div>
      </div>
    ` : `
      <div style="padding:10px"><button style="width:100%;padding:10px;background:#9C27B0;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px" onclick="supportNewMode=true;renderSupportPanel();setTimeout(()=>document.getElementById('support-new-subject')?.focus(),50)">+ Nueva consulta</button></div>
    `}

      ${supportTickets.length === 0 ? '<p style="text-align:center;color:#888;padding:30px 0">Sin conversaciones.<br>Crea una nueva consulta.</p>' :

          <div style="display:flex;justify-content:space-between;align-items:center">
            <strong style="font-size:13px;color:var(--text)">${t.subject}</strong>
            <span style="font-size:10px;padding:2px 8px;border-radius:4px;background:${t.status==='open'?'#E8F5E9':'#f5f5f5'};color:${t.status==='open'?'#4CAF50':'#999'}">${t.status==='open'?'Abierto':'Cerrado'}</span>
          </div>

}

async function submitNewTicket() {
  const subject = document.getElementById('support-new-subject')?.value?.trim();
  const msg = document.getElementById('support-new-msg')?.value?.trim();
  if (!subject) { avisar('Error', 'Ingresa el asunto', '⚠️'); return; }
  const r = await api('/api/support/tickets', { method: 'POST', body: JSON.stringify({ subject, message: msg || undefined }) });
  if (r.ok) {
    supportNewMode = false;
    supportActiveTicket = r.data.id;
    supportMessages = [];
    loadSupportMessages();
    loadSupportTickets();
  }
}

async function openSupportTicket(id) {
  supportActiveTicket = id;
  loadSupportMessages();
}

async function loadSupportMessages() {
  const [r, t] = await Promise.all([
    api('/api/support/tickets/' + supportActiveTicket + '/messages'),
    api('/api/support/tickets')
  ]);
  if (!r.ok) return;
  if (t.ok) {
    const oldStatus = supportTickets.find(x => x.id === supportActiveTicket)?.status;
    supportTickets = t.data;
    const newStatus = supportTickets.find(x => x.id === supportActiveTicket)?.status;
    if (oldStatus !== newStatus) { supportMessages = r.data; renderSupportChat(); return; }
  }
  supportMessages = r.data;
  const msgsEl = document.getElementById('support-msgs');
  if (msgsEl) {
    msgsEl.innerHTML = buildSupportMsgsHtml();
    msgsEl.scrollTop = msgsEl.scrollHeight;
  } else {
    renderSupportChat();
  }
}

function buildSupportMsgsHtml() {
  if (supportMessages.length === 0) return '<p style="text-align:center;color:#888;padding:20px;font-size:13px">Envia tu primer mensaje</p>';
  return supportMessages.map(m => {
    const isUser = m.sender_type === 'user';
    const attachs = m.attachments || [];
    return `<div class="support-msg ${isUser ? 'user' : 'admin'}">
      ${!isUser ? '<div style="font-size:10px;font-weight:600;margin-bottom:2px">Soporte</div>' : ''}
      ${m.message || ''}
      ${attachs.length > 0 ? `<div class="msg-attach">${attachs.map(a => `<a href="data:${a.type};base64,${a.data}" download="${a.name}">📎 ${a.name}</a>`).join('')}</div>` : ''}
      <div class="msg-time">${new Date(m.created_at).toLocaleString('es',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
    </div>`;
  }).join('');
}

function renderSupportChat() {
  const panel = document.getElementById('support-panel');
  if (!panel) return;
  const ticket = supportTickets.find(t => t.id === supportActiveTicket);
  panel.innerHTML = `
    <div class="support-header">
      <div style="display:flex;align-items:center;gap:8px">
        <button style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer" onclick="supportActiveTicket=null;renderSupportPanel()">←</button>
        <h4>${ticket?.subject || 'Soporte'}</h4>
      </div>
      <button style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer" onclick="toggleSupport()">✕</button>
    </div>
    <div class="support-messages" id="support-msgs">${buildSupportMsgsHtml()}</div>
    ${ticket?.status === 'closed' ? `
      <div style="padding:14px;text-align:center;border-top:1px solid var(--border2)">
        <p style="color:#888;font-size:12px;margin-bottom:10px">Este ticket fue cerrado</p>
        <div style="display:flex;gap:8px;justify-content:center">
          <button style="padding:8px 16px;background:#9C27B0;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600" onclick="reopenTicket(${ticket.id})">Reabrir ticket</button>
          <button style="padding:8px 16px;background:var(--border2);color:var(--text);border:none;border-radius:8px;cursor:pointer;font-size:12px" onclick="supportActiveTicket=null;supportNewMode=true;renderSupportPanel()">Nuevo ticket</button>
        </div>
      </div>
    ` : `
      <div class="support-input-area">
        <label style="cursor:pointer;font-size:18px;padding:4px" title="Adjuntar archivo">📎<input type="file" id="support-files" multiple accept="image/*,.pdf,.txt" style="display:none" onchange="updateFileLabel()"/></label>
        <textarea id="support-msg-input" placeholder="Escribe tu mensaje..." rows="1" oninput="updateWordCount()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendSupportMsg()}"></textarea>
        <button onclick="sendSupportMsg()">Enviar</button>
        <button onclick="userCloseTicket()" style="background:#607d8b;color:#fff;border:none;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:11px" title="Cerrar ticket">✕</button>
      </div>
      <div style="padding:0 10px 4px;display:flex;justify-content:space-between">
        <span id="support-file-label" style="font-size:11px;color:#888"></span>
        <span id="support-word-count" style="font-size:10px;color:#888">1000</span>
      </div>
    `}`;
  const msgs = document.getElementById('support-msgs');
  if (msgs) setTimeout(() => msgs.scrollTop = msgs.scrollHeight, 50);
}

function updateFileLabel() {
  const input = document.getElementById('support-files');
  const label = document.getElementById('support-file-label');
  if (!input || !label) return;
  const files = Array.from(input.files || []);
  if (files.length === 0) { label.textContent = ''; return; }
  if (files.length > 4) { label.innerHTML = '<span style="color:#F44336">Maximo 4 adjuntos</span>'; return; }
  const tooLarge = files.find(f => f.size > 3 * 1024 * 1024);
  if (tooLarge) { label.innerHTML = '<span style="color:#F44336">' + tooLarge.name + ' supera 3MB</span>'; return; }
  label.textContent = files.map(f => f.name).join(', ');
}

async function sendSupportMsg() {
  let msg = document.getElementById('support-msg-input')?.value?.trim();
  const fileInput = document.getElementById('support-files');
  const files = Array.from(fileInput?.files || []);
  if (!msg && files.length === 0) return;
  if (files.length > 4) { avisar('Error', 'Maximo 4 adjuntos', '⚠️'); return; }
  if (files.find(f => f.size > 3 * 1024 * 1024)) { avisar('Error', 'Cada adjunto no puede superar 3MB', '⚠️'); return; }

  const formData = new FormData();
  if (msg && msg.length > 1000) {
    const blob = new Blob([msg], { type: 'text/plain' });
    if (blob.size > 1024 * 1024) { avisar('Error', 'El texto supera 1MB. Envia un email a soporte.', '⚠️'); return; }
    formData.append('files', blob, 'mensaje-completo.txt');
    formData.append('message', msg.substring(0, 100) + '... (ver adjunto)');
  } else {
    formData.append('message', msg || '');
  }
  files.forEach(f => formData.append('files', f));

  const r = await fetch('/api/support/tickets/' + supportActiveTicket + '/messages', {
    method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: formData
  });
  if (r.ok) {
    document.getElementById('support-msg-input').value = '';
    if (fileInput) fileInput.value = '';
    updateFileLabel();
    loadSupportMessages();
  }
}

async function reopenTicket(id) {
  const r = await api('/api/support/tickets/' + id + '/reopen', { method: 'POST' });
  if (r.ok) { loadSupportTickets(); loadSupportMessages(); }
}

async function userCloseTicket() {
  if (!supportActiveTicket) return;
  const r = await api('/api/support/tickets/' + supportActiveTicket + '/close', { method: 'POST' });
  if (r.ok) { loadSupportTickets(); loadSupportMessages(); }
}

function updateWordCount() {
  const el = document.getElementById('support-msg-input');
  const counter = document.getElementById('support-word-count');
  if (!el || !counter) return;
  const remaining = 1000 - el.value.length;
  counter.textContent = remaining;
  counter.style.color = remaining < 0 ? '#F44336' : remaining < 100 ? '#FF9800' : '#888';
}

setInterval(() => { if (supportOpen && supportActiveTicket) loadSupportMessages(); }, 5000);

function showHelp(key, btn) {
  const h = helpContent[key];
  if (!h) return;
  if (btn) btn.classList.add('clicked');
  const overlay = document.createElement('div');
  overlay.className = 'help-modal-overlay';
  overlay.onmousedown = function(e) { if (e.target === this) this.remove(); };
  overlay.innerHTML = `<div class="help-modal">
    <div class="help-modal-header"><h3>❓ ${h.title}</h3><button class="help-modal-close" onclick="this.closest('.help-modal-overlay').remove()">✕</button></div>
    <div class="help-modal-body">${h.body}</div>
  </div>`;
  document.body.appendChild(overlay);
}

function openUptime(id) {
  uptimeDays=7;
  activeModal={type:'uptime',machineId:id,data:null};

  loadUptime(id,7);
}
async function loadUptime(id,days) {
  const r = await api('/api/machines/'+id+'/uptime?days='+days);
  if(r.ok){activeModal.data=r.data;render();}
}
function buildUptimeModal() {
  const m=machines.find(x=>x.id===activeModal.machineId);
  const data=activeModal.data||[];
  // Disponibilidad = tiempo online / tiempo OBSERVADO, no el promedio de dias
  // (el dia del alta y el de hoy son parciales, no 1440 min).
  const obsOnline = data.reduce((a,d)=>a+(d.online_minutes||0),0);
  const obsTotal = data.reduce((a,d)=>a+(d.online_minutes||0)+(d.offline_minutes||0),0);
  const avg = obsTotal>0 ? Math.round(obsOnline/obsTotal*100) : 0;
  const hColor=avg>=95?'#4CAF50':avg>=80?'#FF9800':'#F44336';
  return `<div class="modal-overlay" onmousedown="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-header"><h2>📊 Uptime — ${m?.machine_name||''}</h2><button class="modal-close" onclick="closeModal()">Cerrar</button></div>
    <div class="day-tabs">
      ${[7,14,30].map(d=>`<button class="day-tab ${uptimeDays===d?'active':''}" onclick="uptimeDays=${d};loadUptime(${activeModal.machineId},${d})">${d} días</button>`).join('')}
    </div>
    ${!activeModal.data?'<p style="color:#999;text-align:center;padding:20px">Cargando...</p>':`
    <div class="uptime-avg"><div class="big" style="color:${hColor}">${avg}%</div><div style="color:#999;font-size:13px">Promedio últimos ${uptimeDays} días</div></div>
    ${data.map(day=>{
      const c=day.percentage>=95?'#4CAF50':day.percentage>=80?'#FF9800':'#F44336';
      const dateStr=new Date(day.date+'T12:00:00').toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'});
      return `<div class="uptime-row" style="cursor:pointer" onclick="openOutages(${activeModal.machineId})" title="Ver caidas">

        <div class="uptime-bg"><div class="uptime-fg" style="width:${day.percentage}%;background:${c}"></div></div>
        <span class="uptime-pct" style="color:${c}">${day.percentage}%</span>
      </div>`;
    }).join('')}
    <button class="modal-btn sm" onclick="openOutages(${activeModal.machineId})" style="margin-top:14px;width:100%">🔴 Ver historial de caidas</button>
    `}
  </div></div>`;
}

function openOutages(id) {

async function loadOutages(id,days) {

}
function fmtDuration(min) {
  min = Math.round(min);
  if (min < 1) return '<1 min';
  if (min < 60) return min + ' min';
  const h = Math.floor(min/60);
  const m = min % 60;
  if (h < 24) return h + 'h ' + (m>0?m+'m':'');
  const d = Math.floor(h/24);
  const rh = h % 24;
  return d + 'd ' + (rh>0?rh+'h':'');
}
function buildOutagesModal() {
  const m=machines.find(x=>x.id===activeModal.machineId);
  const d=activeModal.data;
  const outages=d?.outages||[];
  const totalDown=outages.reduce((a,o)=>a+o.duration_min,0);
  return `<div class="modal-overlay" onmousedown="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-header"><h2>🔴 Caidas — ${m?.machine_name||''}</h2><button class="modal-close" onclick="closeModal()">Cerrar</button></div>
    <div class="day-tabs">
      ${[7,14,30,90].map(dd=>`<button class="day-tab ${activeModal.days===dd?'active':''}" onclick="activeModal.days=${dd};loadOutages(${activeModal.machineId},${dd})">${dd} días</button>`).join('')}
    </div>
    ${!d?'<p style="color:#999;text-align:center;padding:20px">Cargando...</p>':`
    <div style="display:flex;gap:16px;justify-content:center;margin:16px 0;flex-wrap:wrap">
      <div style="text-align:center;padding:12px 20px;background:var(--bg3,#f8f9fa);border-radius:10px">
        <div style="font-size:28px;font-weight:800;color:#F44336">${outages.length}</div>
        <div style="font-size:12px;color:#999">Caidas</div>
      </div>
      <div style="text-align:center;padding:12px 20px;background:var(--bg3,#f8f9fa);border-radius:10px">
        <div style="font-size:28px;font-weight:800;color:#FF9800">${fmtDuration(totalDown)}</div>
        <div style="font-size:12px;color:#999">Tiempo total offline</div>

          </div>

      </div>`;
    }).join('')}
    </div>`}
    `}
  </div></div>`;
}

let editMapInstance = null;
let editMapMarker = null;
function openEditModal(id) {

function initEditMap() {
  const el = document.getElementById('edit-map');
  if (!el) return;
  loadLeaflet(() => {
    if (editMapInstance) { editMapInstance.remove(); editMapInstance = null; }
    const d = activeModal?.data;
    const lat = d?.geo_lat ? parseFloat(d.geo_lat) : -34.48;
    const lon = d?.geo_lon ? parseFloat(d.geo_lon) : -58.62;
    const hasCoords = d?.geo_lat && d?.geo_lon;
    editMapInstance = L.map(el, {zoomControl: true}).setView([lat, lon], hasCoords ? 15 : 10);
    L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {attribution:'© Google Maps', maxZoom:20}).addTo(editMapInstance);
    if (hasCoords) {
      editMapMarker = L.marker([lat, lon], {draggable: true}).addTo(editMapInstance);
      editMapMarker.on('dragend', function() {
        const p = editMapMarker.getLatLng();
        setEditGeoFromMap(p.lat, p.lng);
      });
    }
    editMapInstance.on('click', function(e) {
      setEditGeoFromMap(e.latlng.lat, e.latlng.lng);
    });
  });
}
function setEditGeoFromMap(lat, lng) {
  const flatLat = parseFloat(lat).toFixed(6);
  const flatLon = parseFloat(lng).toFixed(6);
  document.getElementById('ed-geo-lat').value = flatLat;
  document.getElementById('ed-geo-lon').value = flatLon;
  activeModal.data.geo_lat = flatLat;
  activeModal.data.geo_lon = flatLon;
  if (editMapMarker) { editMapMarker.setLatLng([lat, lng]); }
  else { editMapMarker = L.marker([lat, lng], {draggable: true}).addTo(editMapInstance); editMapMarker.on('dragend', function() { const p = editMapMarker.getLatLng(); setEditGeoFromMap(p.lat, p.lng); }); }
  fetch('https://photon.komoot.io/reverse?lon='+flatLon+'&lat='+flatLat+'&lang=es')
    .then(r=>r.json()).then(rj=>{
      const p = rj.features?.[0]?.properties || {};
      const city = p.city||p.town||p.village||p.district||p.suburb||'';
      const region = p.state||'';
      const country = p.country||'';
      document.getElementById('ed-geo-city').value = city;
      document.getElementById('ed-geo-region').value = region;
      document.getElementById('ed-geo-country').value = country;
      activeModal.data.geo_city = city;
      activeModal.data.geo_region = region;
      activeModal.data.geo_country = country;
      const res = document.getElementById('geocode-result');
      if (res) res.innerHTML = '<span style="color:#4CAF50">📍 ' + [city,region,country].filter(Boolean).join(', ') + '</span>';
    }).catch(()=>{});
}

const _reenviosEnCurso = new Set();
async function reenviarComando(id, estado) {
  if (_reenviosEnCurso.has(id)) return; // doble clic
  const desconocido = estado === 'delivered' || estado === 'indeterminate';
  let ok;
  if (desconocido) {
    // Resultado desconocido: el original puede estar ejecutandose todavia.
    // Se exige escribir la palabra para que no sea un clic al pasar.
    const texto = await pedirTexto({ icono: '⚠️', titulo: 'Resultado desconocido: reenviar igual?', peligro: true, ok: 'Crear otra ejecución',
      mensaje: (estado === 'delivered' ? 'El agente retiró este comando y no informó resultado: puede estar ejecutándose todavía o haber terminado sin que llegue el aviso.' : 'El agente se reinició mientras corría y no se sabe si terminó.') +
        ' Reenviar crea OTRA ejecución con el mismo texto: si la original corrió, el efecto se duplica (un reinicio se hace dos veces, un archivo se borra dos veces). Revisá la máquina antes. Escribí REENVIAR para confirmar.',
      marcador: 'REENVIAR' });
    ok = (texto || '').trim().toUpperCase() === 'REENVIAR';
    if (texto !== null && !ok) { avisar('No se reenvió', 'Había que escribir REENVIAR.', 'ℹ️'); return; }
  } else {
    ok = await confirmar({ icono: '↻', titulo: 'Reenviar este comando?', mensaje: 'El agente no pudo lanzarlo. Se crea otra ejecución con el mismo texto.', ok: 'Reenviar' });
  }
  if (!ok) return;
  _reenviosEnCurso.add(id);
  const btn = document.getElementById('reenviar-'+id); if (btn) btn.disabled = true;
  // Una clave por confirmación. Si la petición se pierde (sin respuesta), se
  // reintenta con la MISMA clave: el servidor devuelve el mismo comando aunque
  // el agente ya lo haya retirado. Confirmar de nuevo genera otra clave.
  const clave = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2))).replace(/[^A-Za-z0-9_-]/g,'').slice(0,64);
  try {
    let r;
    for (;;) {
      r = await api('/api/commands/'+id+'/retry', {method:'POST', headers:{'Idempotency-Key': clave}});
      // Resultado desconocido: sin respuesta (0) o error del servidor o de un
      // intermediario (5xx: el edge pudo cortar después de que el comando se
      // creara). Solo se reintenta con la MISMA clave, nunca con una nueva:
      // el servidor devuelve el comando ya creado si existe. Un 4xx sí es
      // una respuesta definitiva y se muestra tal cual.
      if (r.status !== 0 && r.status < 500) break;
      if (!await confirmar({ icono: '📡', titulo: r.status === 0 ? 'Sin respuesta del servidor' : 'Error '+r.status+' del servidor', mensaje: 'No se sabe si el reenvío se creó. Reintentar la misma petición no crea otro comando; si cancelás, revisá el historial antes de volver a reenviar.', ok: 'Reintentar', cancelar: 'Cancelar' })) return;
    }
    if (!r.ok) { avisar('Error', r.data?.error || 'No se pudo reenviar', '⚠️'); return; }
    if (r.data.duplicado) avisar('Ya estaba reenviado', 'Esta confirmación ya había creado el comando #'+r.data.id+' (estado: '+estadoComando(r.data.status).texto+'); no se creó otro.', 'ℹ️');
    if (activeModal?.type === 'cmd' && activeModal.machineId) { const l = await api('/api/machines/'+activeModal.machineId+'/commands'); if (l.ok) { activeModal.data = l.data; render(); } }
  } finally {
    _reenviosEnCurso.delete(id);
    const b = document.getElementById('reenviar-'+id); if (b) b.disabled = false;
  }
}
// Estados de un comando remoto (ver server/lib/comandos.js)
function estadoComando(st) {
  switch (st) {
    case 'completed': return {texto:'Completado', color:'#4CAF50', ayuda:'El agente lo ejecuto y mando la salida'};
    case 'delivered': return {texto:'Entregado', color:'#2196F3', ayuda:'El agente lo retiro; falta el resultado. Si no llega, el agente pudo perderlo: no se reenvia solo.'};
    case 'failed': return {texto:'Fallo', color:'#f44336', ayuda:'El agente no pudo lanzar el proceso'};
    case 'indeterminate': return {texto:'Indeterminado', color:'#9C27B0', ayuda:'El agente se reinicio mientras corria. No se sabe si termino y no se repitio.'};
    default: return {texto:'Pendiente', color:'#FF9800', ayuda:'Se entrega en el proximo latido'};
  }
}

// Valida los umbrales del formulario de edicion. Devuelve un mensaje de error
// (para mostrarselo al usuario) o null si esta todo bien. No modifica los campos.
function validarUmbralesUI() {
  const chk = (id, tipo, label) => {
    const el = document.getElementById(id);
    if (!el) return null;
    const v = el.value;
    if (v === '' || v == null) return null;         // vacio = deshabilitado
    const n = Number(v);
    if (!Number.isFinite(n)) return label + ' debe ser un numero valido.';
    if (n < 0) return label + ' no puede ser negativo.';
    if (tipo === 'pct' && n > 100) return label + ' no puede superar 100%.';
    return null;
  };
  return chk('ed-alert-cpu', 'pct', 'El umbral de CPU')
    || chk('ed-alert-ram', 'pct', 'El umbral de RAM')
    || chk('ed-alert-disk', 'pct', 'El umbral de disco')
    || chk('ed-alert-ping', 'ms', 'El umbral de ping');
}

    ${!activeModal.data?'<p style="color:#999;text-align:center">Cargando...</p>':`
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;font-weight:700;color:#666">CPU / RAM</span><span style="font-size:12px;color:#999">${cpuVals.length>0?'CPU avg: '+Math.round(avgArr(cpuVals))+'% | RAM avg: '+(avgArr(ramVals)).toFixed(1)+'/'+ramTotal+' GB':'—'}</span></div>
      <div style="height:200px"><canvas id="chart-cpu-ram"></canvas></div>
    </div>
    <div style="margin-bottom:14px">

      <div style="height:140px"><canvas id="chart-ping"></canvas></div>
    </div>
    ${diskCharts}
    `}
  </div></div>`;

  if (activeModal.data && data.length > 0) {
    setTimeout(()=>{
      const ramPctVals = ramVals.map(v=>Math.round(v/ramTotal*100));
      createLineChart('chart-cpu-ram', timeLabels, [
        { label:'CPU %', data:cpuVals, borderColor:'#4CAF50', backgroundColor:'rgba(76,175,80,0.08)', fill:true },
        { label:'RAM %', data:ramPctVals, borderColor:'#2196F3', backgroundColor:'rgba(33,150,243,0.08)', fill:true }
      ], {unit:'%', max:100});
      createLineChart('chart-ping', timeLabels, [
        { label:'Ping', data:pingVals, borderColor:'#FF9800', backgroundColor:'rgba(255,152,0,0.08)', fill:true }
      ], {unit:'ms'});
      Object.entries(diskData).forEach(([drive,dd],i)=>{
        const pctVals = dd.vals.map(v=>Math.round(v/dd.total*100));
        createLineChart('chart-disk-'+i, timeLabels, [
          { label:drive+' %', data:pctVals, borderColor:'#9C27B0', backgroundColor:'rgba(156,39,176,0.08)', fill:true }
        ], {unit:'%', max:100});
      });
    }, 150);
  }

  return html;
}

function initFullMap() {
  const el=document.getElementById('fullMap');
  if(!el)return;
  const pts=machines.filter(m=>m.geo_lat&&m.geo_lon).map(m=>({lat:parseFloat(m.geo_lat),lon:parseFloat(m.geo_lon),name:m.machine_name,online:m.is_online,ip:m.public_ip}));
  if(pts.length===0){el.innerHTML='<div style="padding:40px;text-align:center;color:#ccc">Sin datos de geolocalización</div>';return;}
  loadLeaflet(()=>{
    if(fullMapInstance){fullMapInstance.remove();fullMapInstance=null;}
    const center=[pts.reduce((a,p)=>a+p.lat,0)/pts.length,pts.reduce((a,p)=>a+p.lon,0)/pts.length];
    fullMapInstance=L.map(el).setView(center,5);
    L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{attribution:'© Google Maps',maxZoom:20}).addTo(fullMapInstance);
    pts.forEach(p=>{
      const c=p.online?'#4CAF50':'#F44336';
      L.circleMarker([p.lat,p.lon],{radius:10,color:c,fillColor:c,fillOpacity:.85}).bindPopup(`<strong>${p.name}</strong><br>${p.online?'🟢 Online':'🔴 Offline'}<br><small>${p.ip||''}</small>`).addTo(fullMapInstance);
    });
    if(pts.length>1)fullMapInstance.fitBounds(pts.map(p=>[p.lat,p.lon]),{padding:[20,20]});
  });
}

// ── MONITORES: estado de la vista (pestañas, busqueda, filtros) ──
let monitoresTab = 'http';       // 'http' | 'ssl'
let urlSearch = '';
let urlStatusFilter = 'all';     // all | up | down | paused
let urlMonitorsLoaded = false;   // para el estado de carga inicial
let sslMonitorsLoaded = false;

function setMonitoresTab(t){ monitoresTab = t; render(); }

// Estado real de un monitor HTTP segun lo que devuelve la API.
function urlEstado(u){
  if (u.is_active === false) return 'paused';
  if (u.last_check == null) return 'pending';
  return u.is_up ? 'up' : 'down';
}
function urlFiltrados(){
  const q = urlSearch.trim().toLowerCase();
  return urlMonitors.filter(u=>{
    if (q && !((u.name||'').toLowerCase().includes(q) || (u.url||'').toLowerCase().includes(q))) return false;
    if (urlStatusFilter==='all') return true;
    const e = urlEstado(u);
    if (urlStatusFilter==='up') return e==='up';
    if (urlStatusFilter==='down') return e==='down';
    if (urlStatusFilter==='paused') return e==='paused';
    return true;
  });
}

// Estado de un certificado. Distingue error de consulta y sin-chequear de un
// certificado valido: nunca se muestra "sano" sin datos.
function sslEstado(s){
  if (s.last_status==='expired') return 'expired';
  if (s.last_status==='warning') return 'warning';
  if (s.last_status==='ok') return 'ok';
  if (s.last_status==='error' || s.last_error) return 'error';
  return 'pending';
}
const SSL_ORDEN = { expired:0, warning:1, error:2, pending:3, ok:4 };
function sslOrdenados(){
  return [...sslMonitors].sort((a,b)=>{
    const ea=sslEstado(a), eb=sslEstado(b);
    if (SSL_ORDEN[ea]!==SSL_ORDEN[eb]) return SSL_ORDEN[ea]-SSL_ORDEN[eb];
    const da=a.last_days_left, db=b.last_days_left;
    if (da!=null && db!=null) return da-db;
    return String(a.name||a.hostname).localeCompare(String(b.name||b.hostname));
  });
}

function buildUrlsView() {
  const httpN = urlMonitors.length;
  const httpDown = urlMonitors.filter(u=>urlEstado(u)==='down').length;
  const sslN = sslMonitors.length;
  const sslMal = sslMonitors.filter(s=>{const e=sslEstado(s);return e==='expired'||e==='warning';}).length;
  return `<div class="panel">
    <div class="panel-head" style="margin-bottom:0">
      <div class="panel-title" style="margin:0"><span class="dot" style="background:var(--accent)"></span>Monitores<button class="help-btn" onclick="event.stopPropagation();showHelp('urls',this)" aria-label="Ayuda sobre monitores">?</button></div>
    </div>
    <div class="subtabs" role="tablist" aria-label="Tipo de monitor">
      <button class="subtab ${monitoresTab==='http'?'active':''}" role="tab" aria-selected="${monitoresTab==='http'}" onclick="setMonitoresTab('http')">
        ${ico('globe','sm')} HTTP <span class="tab-count ${httpDown?'crit':''}">${httpN}</span>
      </button>
      <button class="subtab ${monitoresTab==='ssl'?'active':''}" role="tab" aria-selected="${monitoresTab==='ssl'}" onclick="setMonitoresTab('ssl')">
        ${ico('lock','sm')} Certificados SSL <span class="tab-count ${sslMal?'crit':''}">${sslN}</span>
      </button>
    </div>
    <div role="tabpanel">${monitoresTab==='http' ? buildHttpPanel() : buildSslPanel()}</div>
  </div>`;
}

function buildHttpPanel(){
  if (!urlMonitorsLoaded) return `<div class="state-block"><div class="spinner"></div><span>Cargando monitores…</span></div>`;
  if (urlMonitors.length===0) return `<div style="margin-bottom:12px"><button class="btn primary" onclick="openAddUrlMonitor()">${ico('plus','sm')}Agregar URL</button></div>
    <div class="state-block">${ico('globe','lg')}<strong>Sin monitores HTTP</strong><span>Agregá una URL para vigilar que un sitio responda y recibir avisos cuando se caiga.</span></div>`;

  const up = urlMonitors.filter(u=>urlEstado(u)==='up').length;
  const down = urlMonitors.filter(u=>urlEstado(u)==='down').length;
  const paused = urlMonitors.filter(u=>urlEstado(u)==='paused').length;
  const conMs = urlMonitors.filter(u=>urlEstado(u)==='up' && u.last_response_ms!=null);
  const msProm = conMs.length ? Math.round(conMs.reduce((a,u)=>a+u.last_response_ms,0)/conMs.length) : null;
  const lista = urlFiltrados();
  const fchip = (val,txt,n,cls)=>`<button class="filter-chip ${urlStatusFilter===val?'active':''}" role="tab" aria-selected="${urlStatusFilter===val}" onclick="urlStatusFilter='${val}';render()">${txt} <span class="fc-n ${cls||''}">${n}</span></button>`;

  return `
  <div class="mon-summary">
    <div class="mon-tile"><div class="mt-num">${urlMonitors.length}</div><div class="mt-label">Monitores</div></div>
    <div class="mon-tile"><div class="mt-num ok">${up}</div><div class="mt-label">Respondiendo</div></div>
    <div class="mon-tile"><div class="mt-num ${down?'crit':'muted'}">${down}</div><div class="mt-label">Caídos</div></div>
    <div class="mon-tile"><div class="mt-num muted">${msProm!=null?msProm+' ms':'—'}</div><div class="mt-label">Respuesta prom.</div></div>
  </div>
  <div class="mon-toolbar">
    <button class="btn primary" onclick="openAddUrlMonitor()">${ico('plus','sm')}Agregar URL</button>
    <div class="mon-search"><span class="search-icon">${ico('search','sm')}</span>
      <input type="search" id="url-search" placeholder="Buscar por nombre o dominio…" aria-label="Buscar monitor HTTP" value="${escHtml(urlSearch)}" oninput="urlSearch=this.value;render()"></div>
    <div class="header-spacer"></div>
    <div class="filter-group" role="tablist" aria-label="Filtrar por estado">
      ${fchip('all','Todos',urlMonitors.length)}${fchip('up','Activos',up)}${fchip('down','Caídos',down,down?'':'')}${fchip('paused','Pausados',paused)}
    </div>
    <button class="btn sm" onclick="abrirAsignar()" title="Avisar a una persona de varios dominios" aria-label="Avisar a una persona de varios dominios">${ico('mail','sm')}Avisar…</button>
  </div>
  ${barraSeleccion(urlsSeleccionadas.size, 'Vigilar sus certificados SSL', 'crearSslDesdeUrl([...urlsSeleccionadas])', 'marcarTodasUrls(false)')}
  ${lista.length===0
    ? `<div class="state-block">${ico('search','lg')}<strong>Sin resultados</strong><span>Ningún monitor coincide con la búsqueda o el filtro.</span></div>`
    : `<table class="server-table mon-table">
    <thead><tr>
      <th style="width:28px"><input type="checkbox" onchange="marcarTodasUrls(this.checked)" ${urlsSeleccionadas.size===urlMonitors.length&&urlMonitors.length>0?'checked':''} aria-label="Seleccionar todos"></th>
      <th style="width:24px"><span class="sr-only">Estado</span></th><th>Nombre</th><th class="col-hide-sm">Dominio</th><th class="num">Respuesta</th><th class="col-hide-sm">Último chequeo</th><th>Estado</th><th style="width:1%"><span class="sr-only">Acciones</span></th>
    </tr></thead><tbody>
    ${lista.map(u=>buildHttpRow(u)).join('')}
    </tbody></table>`}`;
}

function buildHttpRow(u){
  const est = urlEstado(u);
  const host = (()=>{ try { return new URL(u.url).hostname; } catch(e){ return u.url; } })();
  const esHttps = /^https/i.test(u.url);
  const pill = est==='up' ? `<span class="pill ok">${ico('check','sm')}UP</span>`
    : est==='down' ? `<span class="pill crit">${ico('wifioff','sm')}DOWN</span>`
    : est==='paused' ? `<span class="pill paused">${ico('pause','sm')}Pausado</span>`
    : `<span class="pill muted">Sin chequear</span>`;
  const resp = u.last_response_ms!=null
    ? `<span class="val-num ${u.last_response_ms<500?'ok':u.last_response_ms<2000?'warn':'crit'}">${u.last_response_ms} ms</span>${u.last_status?` <span class="val-num muted" style="font-size:11px">(${u.last_status})</span>`:''}`
    : (est==='down' ? '<span class="val-num crit">sin respuesta</span>' : '<span class="val-num muted">—</span>');
  const dst = resumenDestinatarios(u.destinatarios);
  return `<tr>
    <td onclick="event.stopPropagation()"><input type="checkbox" onchange="marcarUrl(${u.id}, this.checked)" ${urlsSeleccionadas.has(u.id)?'checked':''} aria-label="Seleccionar ${escHtml(u.name||host)}"></td>
    <td><span class="status-dot ${est==='up'?'on':est==='down'?'off':''}" style="${est==='paused'||est==='pending'?'background:var(--text3)':''}" role="img" aria-label="${est}"></span></td>
    <td><div class="srv-name">${escHtml(u.name||host)}</div>${dst?`<div class="srv-meta">${dst}</div>`:''}</td>
    <td class="col-hide-sm" style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span style="color:var(--text2);font-size:12.5px">${escHtml(u.url)}</span></td>
    <td class="num">${resp}</td>
    <td class="col-hide-sm" style="color:var(--text3);font-size:12px;white-space:nowrap">${u.last_check?timeSince(u.last_check):'Nunca'}</td>
    <td>${pill}${u.last_error?`<div style="font-size:10.5px;color:var(--crit);margin-top:2px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(u.last_error)}">${escHtml(u.last_error)}</div>`:''}</td>
    <td onclick="event.stopPropagation()"><div class="row-actions">
      <button class="btn sm" onclick="openUrlHistory(${u.id})" aria-label="Historial de ${escHtml(u.name||host)}">${ico('chart','sm')}Historial</button>
      <details class="rowmenu" onkeydown="menuKeydown(event)">
        <summary aria-haspopup="true" aria-label="Más acciones de ${escHtml(u.name||host)}" title="Más acciones">${ico('dots','sm')}</summary>
        <div class="menu-pop" role="menu">
          <button class="menu-item" role="menuitem" onclick="cerrarMenu(this);openEditUrlMonitor(${u.id})">${ico('edit','sm')}Editar</button>

function buildSslPanel(){

  const errores = sslMonitors.filter(s=>sslEstado(s)==='error').length;
  const validos = sslMonitors.filter(s=>sslEstado(s)==='ok').length;

  const alta = `<div class="mon-toolbar">

function buildCertCard(s){
  const est = sslEstado(s);
  const dias = s.last_days_left;
  const diasBox = est==='expired'
    ? `<div class="cd-num" style="color:var(--crit)">${dias!=null?Math.abs(dias):'!'}</div><div class="cd-lbl">días vencido</div>`
    : est==='warning'
    ? `<div class="cd-num" style="color:var(--warn)">${dias!=null?dias:'—'}</div><div class="cd-lbl">días</div>`
    : est==='ok'
    ? `<div class="cd-num" style="color:var(--ok)">${dias!=null?dias:'—'}</div><div class="cd-lbl">días</div>`
    : est==='error'
    ? `<div class="cd-num" style="color:var(--text3)">${ico('warn','lg')}</div><div class="cd-lbl">error</div>`
    : `<div class="cd-num" style="color:var(--text3)">—</div><div class="cd-lbl">sin datos</div>`;
  const pill = est==='expired'?`<span class="pill crit">Vencido</span>`
    : est==='warning'?`<span class="pill warn">Por vencer</span>`
    : est==='ok'?`<span class="pill ok">Vigente</span>`
    : est==='error'?`<span class="pill muted" title="${escHtml(s.last_error||'')}">Error de consulta</span>`
    : `<span class="pill muted">Sin chequear</span>`;
  const meta = est==='error'
    ? `<span style="color:var(--crit)">${escHtml(s.last_error||'No se pudo consultar el certificado')}</span>`
    : est==='pending'
    ? 'Todavía sin chequear'
    : `${s.last_expiry?'Vence '+new Date(s.last_expiry).toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric'}):'—'}${s.last_issuer?' · '+escHtml(s.last_issuer):''}`;
  const dst = resumenDestinatarios(s.destinatarios);
  return `<div class="cert-card st-${est}">
    <div class="cert-days">${diasBox}</div>
    <div class="cert-main">
      <input type="checkbox" onchange="marcarSsl(${s.id}, this.checked)" ${sslSeleccionados.has(s.id)?'checked':''} aria-label="Seleccionar ${escHtml(s.name||s.hostname)}" style="float:right;margin-left:8px">
      <div class="cm-name">${escHtml(s.name||s.hostname)} ${pill}</div>
      <div class="cm-host">${escHtml(s.hostname)}</div>
      <div class="cm-meta">${meta}${dst?' · '+dst:''}</div>
    </div>
    <div class="cert-actions">
      <button class="btn sm" onclick="checkSSL('${escHtml(s.hostname)}')" aria-label="Verificar ${escHtml(s.hostname)} ahora">${ico('refresh','sm')}Verificar</button>
      <details class="rowmenu" onkeydown="menuKeydown(event)">
        <summary aria-haspopup="true" aria-label="Más acciones de ${escHtml(s.hostname)}" title="Más acciones">${ico('dots','sm')}</summary>
        <div class="menu-pop" role="menu">
          <button class="menu-item" role="menuitem" onclick="cerrarMenu(this);openEditSsl(${s.id})">${ico('edit','sm')}Editar avisos</button>
          <button class="menu-item" role="menuitem" onclick="cerrarMenu(this);crearUrlDesdeSsl(${s.id})">${ico('globe','sm')}Vigilar que responda</button>
          <div class="menu-sep"></div>
          <button class="menu-item danger" role="menuitem" onclick="cerrarMenu(this);deleteSSLMonitor(${s.id})">${ico('trash','sm')}Eliminar</button>
        </div>
      </details>
    </div>
  </div>`;
}

// Cierra el <details> que contiene al elemento (tras elegir una accion).
function cerrarMenu(el){ const d=el.closest('details'); if(d) d.open=false; }
// Escape dentro de un menu: cerrar y devolver el foco al disparador.
function menuKeydown(e){
  if (e.key==='Escape'){ const d=e.currentTarget; d.open=false; const s=d.querySelector('summary'); if(s) s.focus(); e.stopPropagation(); }
}


let sslMonitors = [];
let _ultimoSslJson = '';
async function loadSSLMonitors() {
  const r = await api('/api/ssl-monitors');
  // Sin el chequeo, una respuesta que no sea lista deja sslMonitors como un
  // objeto y rompe todo lo que despues hace .some() o .map() sobre el.
  if (r.ok && Array.isArray(r.data)) {
    const nuevo = JSON.stringify(r.data);
    sslMonitors = r.data;
    sslMonitorsLoaded = true;
    // Repinta la vista solo si algo cambio y estamos en la pestaña SSL, sin
    // pisar lo que el usuario este escribiendo (misma logica que loadMachines).
    if (nuevo !== _ultimoSslJson) {
      _ultimoSslJson = nuevo;
      // Re-render en cualquier subpestaña de Monitores: asi el contador del
      // subtab SSL queda al dia aunque el usuario este mirando HTTP.
      if (activeNav==='urls' && !activeModal && !notifDropdownOpen) renderSiNoEstasEscribiendo();
    }
  }
}
// Mismo criterio que render(): actualizar en vez de reconstruir. Esta lista se
// repinta sola cada 10 segundos y con innerHTML parpadeaba entera.
function pintar(el, html) {
  const molde = document.createElement('div');
  molde.innerHTML = html;
  morfar(el, molde);
}

function renderSSLList() {
  // El SSL ahora se dibuja dentro de buildSslPanel (pestaña Certificados); esta
  // funcion quedo por compatibilidad con llamadas viejas -> repinta la vista.
  if (activeNav==='urls' && !activeModal) renderSiNoEstasEscribiendo();
  return;
  /* eslint-disable no-unreachable */
  const el = document.getElementById('ssl-list');
  if (!el) return;
  if (sslMonitors.length === 0) { pintar(el, '<p style="color:#888;text-align:center;font-size:13px">Sin certificados monitoreados</p>'); return; }
  pintar(el, barraSeleccion(sslSeleccionados.size, '🌐 Vigilar que respondan', 'crearUrlDesdeSsl([...sslSeleccionados])', 'marcarTodosSsl(false)') +
    sslMonitors.map(s => {
    const color = s.last_status === 'ok' ? '#4CAF50' : s.last_status === 'warning' ? '#FF9800' : s.last_status === 'expired' ? '#F44336' : '#888';
    const icon = s.last_status === 'ok' ? '🟢' : s.last_status === 'warning' ? '🟡' : s.last_status === 'expired' ? '🔴' : '⏳';
    const days = s.alert_days || [30,14,7,1];
    return `<div style="background:var(--bg);border-left:3px solid ${color};border-radius:0 10px 10px 0;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px">
      <input type="checkbox" onchange="marcarSsl(${s.id}, this.checked)" ${sslSeleccionados.has(s.id) ? 'checked' : ''} style="margin:0"/>
      <span style="font-size:16px">${icon}</span>
      <div style="flex:1">
        <div style="font-weight:700;font-size:13px;color:var(--text)">${s.name || s.hostname}</div>
        <div style="font-size:11px;color:#888">${s.hostname} · ${detalleCert(s)}</div>
        <div style="font-size:10px;color:#999;margin-top:2px">Alertas: ${days.map(d => `<span style="background:var(--border2);padding:1px 6px;border-radius:3px;margin-right:3px">${d}d</span>`).join('')}${resumenDestinatarios(s.destinatarios) ? ' · ' + resumenDestinatarios(s.destinatarios) : ''}</div>
      </div>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="modal-btn sm" style="padding:4px 8px;font-size:11px;margin-top:0;border-radius:6px" onclick="checkSSL('${s.hostname}')">Verificar</button>
        <button class="modal-btn sm" style="background:#EDE7F6;color:#5E35B1;padding:4px 8px;font-size:11px;margin-top:0;border-radius:6px" onclick="openEditSsl(${s.id})">✏ Editar</button>
        <button class="modal-btn sm" style="background:#E8F5E9;color:#2E7D32;padding:4px 8px;font-size:11px;margin-top:0;border-radius:6px" onclick="crearUrlDesdeSsl(${s.id})" title="Vigilar tambien que el sitio responda">→ URL</button>
        <button class="modal-btn sm" style="background:#FFEBEE;color:#F44336;padding:4px 8px;font-size:11px;margin-top:0;border-radius:6px" onclick="deleteSSLMonitor(${s.id})">✕</button>
      </div>
    </div>`;
  }).join(''));
}
async function addSSLMonitor() {
  const hostname = document.getElementById('ssl-hostname')?.value?.trim();
  const name = document.getElementById('ssl-name')?.value?.trim();
  if (!hostname) { avisar('Error', 'Ingresa el dominio', '⚠️'); return; }
  const r = await api('/api/ssl-monitors', { method: 'POST', body: JSON.stringify({ hostname, name }) });
  if (r.ok) { document.getElementById('ssl-hostname').value = ''; document.getElementById('ssl-name').value = ''; loadSSLMonitors(); }
  else avisar('Error', r.data?.error || 'Error', '⚠️');
}
async function deleteSSLMonitor(id) {
  if (!await confirmar({ icono: '🗑', titulo: 'Eliminar este monitor SSL?', mensaje: 'Dejas de recibir avisos de vencimiento de ese certificado.', ok: 'Eliminar', peligro: true })) return;
  await api('/api/ssl-monitors/' + id, { method: 'DELETE' });
  loadSSLMonitors();
}
async function editSSLDays(id) {
  const mon = sslMonitors.find(s => s.id === id);
  const current = (mon?.alert_days || [30,14,7,1]).join(', ');
  const input = await pedirTexto({
    icono: '🔔', titulo: 'Avisos de vencimiento',
    mensaje: 'Cuantos dias antes de que venza el certificado queres que te avisemos.',
    detalle: 'Separados por coma. Por ejemplo <strong>30, 14, 7, 1</strong> te avisa un mes antes, dos semanas, una semana y el dia anterior.',
    marcador: '30, 14, 7, 1', valor: current, ok: 'Guardar'
  });
  if (input === null) return;
  const days = input.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n > 0).sort((a,b) => b-a);
  if (days.length === 0) { avisar('Error', 'Ingresa al menos un numero', '⚠️'); return; }
  api('/api/ssl-monitors/' + id, { method: 'PUT', body: JSON.stringify({ alert_days: days }) }).then(() => loadSSLMonitors());
}

function openAddUrlMonitor() {
  pauseRefresh();
  activeModal = { type: 'addurl' };
  render();
}
async function saveUrlMonitor() {
  const data = {
    url: document.getElementById('um-url')?.value?.trim(),
    name: document.getElementById('um-name')?.value?.trim() || null,
    method: document.getElementById('um-method')?.value || 'GET',
    expected_status: parseInt(document.getElementById('um-status')?.value) || 200,
    timeout_ms: parseInt(document.getElementById('um-timeout')?.value) || 10000,
    interval_seconds: parseInt(document.getElementById('um-interval')?.value) || 300,
    notify_emails: correosDelCampo('um-correos')
  };
  if (!data.url) { await avisar('Falta la URL', 'Escribi la direccion del sitio que queres vigilar', '🌐'); return; }
  const editando = activeModal && activeModal.editId;
  const vigilarSsl = !editando && document.getElementById('um-ssl')?.checked;
  const r = editando
    ? await api('/api/url-monitors/' + editando, { method: 'PUT', body: JSON.stringify(data) })
    : await api('/api/url-monitors', { method: 'POST', body: JSON.stringify(data) });
  if (!r.ok) { await avisar('No se pudo guardar', r.data?.error || 'Error', '⚠️'); return; }

  // El chequeo de URL ignora los errores de certificado (rejectUnauthorized:
  // false en el servidor) para no reportar caidas falsas. La contrapartida es
  // que sin un monitor SSL nadie avisa cuando el certificado vence, asi que lo
  // creamos junto con la URL salvo que lo destildes.
  if (vigilarSsl) {
    let hostname = null;
    try { const u = new URL(data.url); if (u.protocol === 'https:') hostname = u.hostname; } catch (e) {}
    if (hostname && !sslMonitors.some(x => x.hostname === hostname)) {
      await api('/api/ssl-monitors', { method: 'POST', body: JSON.stringify({ hostname, name: data.name || hostname }) });
      await loadSSLMonitors();
    }
  }
  closeModal();
  loadUrlMonitors();
}
// Los dialogos nativos del navegador cortan la pagina con un cartel gris que
// dice "servereyes.app dice". Estos son del mismo estilo
// que el resto y devuelven una promesa, asi que se usan igual de simple.
let _resolverConfirm = null;
function confirmar(op) {
  return new Promise(resolve => {
    _resolverConfirm = resolve;
    activeModal = { type: 'confirmar', ...op };
    pauseRefresh();
    render();
    if (op.campo) setTimeout(() => { const c = document.getElementById('confirm-campo'); if (c) { c.focus(); c.select(); } }, 60);
  });
}
// El cuarto argumento deja agregar lo que acepte confirmar(), por ejemplo un
// detalle con la explicacion larga debajo del mensaje.
function avisar(titulo, mensaje, icono, op) {
  return confirmar({ titulo, mensaje, icono: icono || 'ℹ️', soloAceptar: true, ...op });
}
function responderConfirm(valor) {
  const r = _resolverConfirm;
  // Con campo, aceptar devuelve el texto y cancelar devuelve null. Hay que
  // leerlo antes de cerrar: al cerrar el input deja de existir.
  const conCampo = activeModal && activeModal.campo;
  const texto = conCampo ? valorDelCampo() : null;
  _resolverConfirm = null;
  activeModal = null;
  resumeRefresh();
  render();
  if (r) r(conCampo ? (valor ? (texto || '') : null) : valor);
}
// Pedir un dato con el mismo modal, en vez de prompt(): mismo estilo, y de
// paso se puede explicar que se espera en vez de meter todo en una linea.
function pedirTexto(op) {
  return confirmar({ ...op, campo: true });
}
function valorDelCampo() {
  return (document.getElementById('confirm-campo') || {}).value;
}

function buildConfirmModal() {
  const m = activeModal;
  const colorOk = m.peligro ? '#F44336' : '#2196F3';
  return `<div class="modal-overlay" onmousedown="if(event.target===this)responderConfirm(false)">
  <div class="modal-box" style="max-width:420px">
    <div style="text-align:center;padding:6px 0 2px">
      <div style="font-size:38px;line-height:1">${m.icono || '❓'}</div>

    ${m.mensaje ? `<p style="text-align:center;color:#888;font-size:14px;margin:10px 0 0;line-height:1.5">${escHtml(m.mensaje)}</p>` : ''}
    ${m.detalle ? `<div style="background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:12px;color:#999;line-height:1.5">${m.detalle}</div>` : ''}
    ${m.campo ? `<input class="modal-input" id="confirm-campo" style="margin-top:14px" placeholder="${escHtml(m.marcador || '')}" value="${escHtml(m.valor || '')}"
      onkeydown="if(event.key==='Enter')responderConfirm(true)"/>` : ''}
    <div style="display:flex;gap:8px;margin-top:18px">
      ${m.soloAceptar ? '' : `<button class="modal-btn ghost" style="flex:1;margin:0" onclick="responderConfirm(false)">${escHtml(m.cancelar || 'Cancelar')}</button>`}
      <button class="modal-btn" style="flex:1;margin:0;background:${colorOk}" onclick="responderConfirm(true)">${escHtml(m.ok || 'Aceptar')}</button>
    </div>
  </div></div>`;
}

// Los destinatarios no reciben nada hasta que aceptan, asi que mostrar solo
// cuantos son seria enganioso: hay que decir en que estado esta cada uno.
// ── Asignar una direccion a varios monitores de una ─────────────────────────
let asignarDatos = null;
let asignarSel = { urls: new Set(), ssls: new Set() };

async function abrirAsignar(emailInicial) {
  pauseRefresh();
  activeModal = { type: 'asignar', email: emailInicial || '' };
  asignarDatos = null;
  asignarSel = { urls: new Set(), ssls: new Set() };
  render();
  const r = await api('/api/notificaciones/destinatarios');
  if (r.ok) { asignarDatos = r.data; if (activeModal?.email) marcarSegunCorreo(activeModal.email); }
  render();
}

// Al escribir una direccion que ya usa, se tildan solos los monitores donde ya
// esta: asi la pantalla muestra el estado real y no obliga a recordarlo.
function marcarSegunCorreo(email) {
  asignarSel = { urls: new Set(), ssls: new Set() };
  const e = (email || '').trim().toLowerCase();
  if (!e || !asignarDatos) return;
  asignarDatos.destinatarios.filter(d => d.email === e && d.estado !== 'baja').forEach(d => {
    if (d.tipo === 'url') asignarSel.urls.add(d.monitor_id);
    else asignarSel.ssls.add(d.monitor_id);
  });
}

function alEscribirCorreoAsignar(v) {
  activeModal.email = v;
  marcarSegunCorreo(v);
  const cont = document.getElementById('asignar-listas');
  if (cont) cont.innerHTML = listasAsignar();
}

function tildarAsignar(tipo, id, tildado) {
  const set = tipo === 'url' ? asignarSel.urls : asignarSel.ssls;
  tildado ? set.add(id) : set.delete(id);
  const cont = document.getElementById('asignar-listas');
  if (cont) cont.innerHTML = listasAsignar();
}

function tildarTodosAsignar(tildado) {
  asignarSel.urls = new Set(tildado ? asignarDatos.urls.map(u => u.id) : []);
  asignarSel.ssls = new Set(tildado ? asignarDatos.ssls.map(m => m.id) : []);
  const cont = document.getElementById('asignar-listas');
  if (cont) cont.innerHTML = listasAsignar();
}

function listasAsignar() {
  if (!asignarDatos) return '<p style="color:#999;text-align:center;padding:20px">Cargando...</p>';

  const total = asignarSel.urls.size + asignarSel.ssls.size;
  return `

      </span>
    </div>
    ${asignarDatos.urls.length ? `<div style="font-size:11px;color:#888;margin:10px 0 2px">&#127760; Sitios</div>
      ${asignarDatos.urls.map(u => fila('url', u, asignarSel.urls.has(u.id))).join('')}` : ''}
    ${asignarDatos.ssls.length ? `<div style="font-size:11px;color:#888;margin:12px 0 2px">&#128274; Certificados</div>
      ${asignarDatos.ssls.map(m => fila('ssl', m, asignarSel.ssls.has(m.id))).join('')}` : ''}`;
}

function buildAsignarModal() {
  return `<div class="modal-overlay" onmousedown="if(event.target===this)closeModal()">

    method: 'POST',

  });
  if (!r.ok) { await avisar('No se pudo guardar', r.data?.error || 'Error', '⚠️'); return; }
  closeModal();
  await loadUrlMonitors();
  await loadSSLMonitors();
  render();
  const d = r.data;
  await avisar('Listo',
    d.agregados > 0
      ? `Le mandamos un pedido de permiso a ${d.email} por ${d.agregados} sitio${d.agregados === 1 ? '' : 's'}. Va a recibir avisos recien cuando acepte.`

// Cada destinatario con su estado. Un correo cargado que todavia no acepto no
// recibe nada, asi que decirlo evita creer que esta avisando cuando no.
function detalleDestinatarios(tipo, monitorId, lista) {
  if (!Array.isArray(lista) || lista.length === 0) return '';
  const filas = lista.map(d => {
    const icono = d.estado === 'confirmado' ? '✅' : d.estado === 'baja' ? '🚫' : '⏳';
    const color = d.estado === 'confirmado' ? '#4CAF50' : d.estado === 'baja' ? '#888' : '#FF9800';
    const texto = d.estado === 'confirmado' ? 'Recibe los avisos'
      : d.estado === 'baja' ? 'Se dio de baja' : 'Aun no confirmo la recepcion de mail';
    const boton = d.estado === 'confirmado' ? '' :
      `<button class="modal-btn sm" style="margin:0;padding:3px 10px;font-size:11px;border-radius:6px"
         onclick="reenviarPermiso('${tipo}', ${monitorId}, '${escHtml(d.email)}')">Reenviar</button>`;
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border2)">
      <span>${icono}</span>
      <span style="flex:1;min-width:0">
        <span style="display:block;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis">${escHtml(d.email)}</span>
        <span style="display:block;font-size:11px;color:${color}">${texto}</span>
      </span>${boton}</div>`;
  }).join('');
  return `<div style="background:var(--bg);border-radius:8px;padding:4px 12px;margin:-6px 0 12px">${filas}</div>`;
}

async function reenviarPermiso(tipo, monitorId, email) {
  const r = await api('/api/notificaciones/reenviar', {
    method: 'POST', body: JSON.stringify({ tipo, monitor_id: monitorId, email })
  });
  if (r.ok) await avisar('Reenviado', `Le volvimos a mandar el pedido de permiso a ${email}. Va a recibir avisos recien cuando acepte.`, '✉');
  else await avisar('No se pudo reenviar', r.data?.error || 'Error', '⚠️');
}

// Estado del certificado en una linea. Sin chequear se dice asi, y no
// "Emisor: ?", que parece un problema del certificado y no falta de datos.
function detalleCert(m) {
  if (!m.last_check) return 'sin chequear todavia';
  const partes = [];
  if (m.last_days_left != null) {
    partes.push(m.last_days_left < 0
      ? 'vencido hace ' + Math.abs(m.last_days_left) + ' dias'
      : 'caduca en ' + m.last_days_left + (m.last_days_left === 1 ? ' dia' : ' dias'));
  }
  if (m.last_expiry) partes.push(new Date(m.last_expiry).toLocaleDateString('es'));
  if (m.last_issuer) partes.push(escHtml(m.last_issuer));
  return partes.length ? partes.join(' · ') : 'sin datos';
}
function resumenDestinatarios(lista) {
  if (!Array.isArray(lista) || lista.length === 0) return '';
  const cuenta = { confirmado: 0, pendiente: 0, baja: 0 };
  lista.forEach(d => { if (cuenta[d.estado] !== undefined) cuenta[d.estado]++; });
  const partes = [];
  if (cuenta.confirmado) partes.push(`<span style="color:#4CAF50">${cuenta.confirmado} confirmado${cuenta.confirmado > 1 ? 's' : ''}</span>`);
  if (cuenta.pendiente) partes.push(`<span style="color:#FF9800">${cuenta.pendiente} sin confirmar</span>`);
  if (cuenta.baja) partes.push(`<span style="color:#888">${cuenta.baja} de baja</span>`);
  const detalle = lista.map(d => `${d.email} (${d.estado})`).join(', ');
  return `<span title="${escHtml(detalle)}">✉ ${partes.join(' · ')}</span>`;
}

// "a@b.com, c@d.com" -> ['a@b.com','c@d.com']. El servidor valida el formato.
function correosDelCampo(id) {

function escHtml(t) {
  return String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function buildUrlHistoryModal() {
  const u = urlMonitors.find(x => x.id === activeModal.urlId);
  const h = activeModal.data;
  const soloFallos = activeModal.soloFallos;
  const tab = (txt, val) => `<button class="modal-btn sm" style="background:${soloFallos===val?'#2196F3':'var(--bg)'};color:${soloFallos===val?'#fff':'#888'};padding:4px 12px;font-size:12px;margin-top:0;border-radius:6px" onclick="openUrlHistory(${activeModal.urlId},${val})">${txt}</button>`;
  let cuerpo;
  if (h === null) {
    cuerpo = '<p style="color:#999;text-align:center;padding:30px">Cargando...</p>';
  } else if (h.length === 0) {
    cuerpo = `<div style="text-align:center;padding:40px 20px">
      <div style="font-size:40px;margin-bottom:10px">${soloFallos ? '✅' : '📈'}</div>
      <p style="color:#888;font-size:14px">${soloFallos ? 'Sin fallos registrados' : 'Todavia no hay chequeos guardados'}</p>
      <p style="color:#aaa;font-size:12px;margin-top:6px">${soloFallos ? 'Ningun chequeo fallo en el periodo guardado.' : 'El historial se guarda desde el primer chequeo y se conserva 30 dias.'}</p>
    </div>`;
  } else {
    const caidas = h.filter(x => !x.is_up).length;
    const pasajeros = h.filter(x => x.is_up && x.attempts > 1).length;
    const conMs = h.filter(x => x.is_up && x.response_ms != null);
    const msProm = conMs.length ? Math.round(conMs.reduce((a, x) => a + x.response_ms, 0) / conMs.length) : null;
    const uptime = (h.length - caidas) / h.length * 100;
    const tile = (valor, etiqueta, color) => `<div class="mon-tile" style="text-align:center;align-items:center">
      <div class="mt-num" style="color:${color}">${valor}</div>
      <div class="mt-label">${etiqueta}</div></div>`;
    // Periodo visible: del primer al ultimo chequeo guardado.
    const orden = [...h].sort((a,b)=>new Date(a.checked_at)-new Date(b.checked_at));
    const fmtP = t => new Date(t).toLocaleString('es',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    const periodo = orden.length ? `${fmtP(orden[0].checked_at)} — ${fmtP(orden[orden.length-1].checked_at)}` : '';
    // Evolucion de latencia: solo con los ms disponibles (no se inventan).
    const serie = orden.map(x=>({ ms: (x.is_up && x.response_ms!=null)?x.response_ms:null }));
    const chart = (()=>{
      const vals = serie.map(p=>p.ms).filter(v=>v!=null);
      if (vals.length<2) return '<div style="font-size:11px;color:var(--text3);padding:8px 0">Sin datos de latencia suficientes para graficar.</div>';
      const w=520,hh=70,pad=4,max=Math.max(...vals),min=Math.min(...vals),rng=Math.max(max-min,1);
      const pts=serie.map((p,i)=>{ const x=pad+i/(serie.length-1)*(w-2*pad); if(p.ms==null)return null; const y=pad+(1-(p.ms-min)/rng)*(hh-2*pad); return x.toFixed(1)+','+y.toFixed(1); });
      // Segmentos: cortar la linea donde falta un dato (caida)
      const segs=[]; let cur=[]; pts.forEach(pt=>{ if(pt){cur.push(pt)}else{ if(cur.length>1)segs.push(cur); cur=[]; } }); if(cur.length>1)segs.push(cur);
      const caidasX=serie.map((p,i)=>p.ms==null?pad+i/(serie.length-1)*(w-2*pad):null).filter(x=>x!=null);
      return `<svg viewBox="0 0 ${w} ${hh}" style="width:100%;height:70px;display:block" preserveAspectRatio="none" role="img" aria-label="Evolución de la latencia">
        ${caidasX.map(x=>`<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${hh}" stroke="var(--crit)" stroke-width="1" opacity="0.35"/>`).join('')}
        ${segs.map(sg=>`<polyline points="${sg.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>`).join('')}
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:2px"><span>${min} ms</span><span>máx ${max} ms · líneas rojas = caídas</span></div>`;
    })();
    cuerpo = `
    ${soloFallos ? '' : `<div style="font-size:12px;color:var(--text3);margin-bottom:8px">Período: <strong style="color:var(--text2)">${periodo}</strong> · ${h.length} chequeos</div>
    <div class="mon-summary" style="margin-bottom:12px">
      ${tile(uptime.toFixed(1) + '%', 'Uptime', uptime >= 99 ? 'var(--ok)' : 'var(--warn)')}
      ${tile(caidas, 'Caídas', caidas ? 'var(--crit)' : 'var(--ok)')}
      ${tile(pasajeros, 'Fallos pasajeros', pasajeros ? 'var(--warn)' : 'var(--text3)')}
      ${tile(msProm != null ? msProm + 'ms' : '—', 'Respuesta prom.', 'var(--accent)')}
    </div>
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Evolución de latencia</div>
      ${chart}
    </div>`}
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <tr style="border-bottom:2px solid var(--border2)">
        <th style="text-align:left;padding:8px;color:#888">Fecha</th>
        <th style="text-align:center;color:#888">Estado</th>
        <th style="text-align:center;color:#888">HTTP</th>
        <th style="text-align:center;color:#888">Respuesta</th>
        <th style="text-align:center;color:#888">Intentos</th>
        <th style="text-align:left;color:#888">Detalle</th>
      </tr>
      ${h.map(x => {
        const pasajero = x.is_up && x.attempts > 1;
        const color = !x.is_up ? '#F44336' : pasajero ? '#FF9800' : '#4CAF50';
        const etiqueta = !x.is_up ? 'CAIDA' : pasajero ? 'PASAJERO' : 'OK';
        return `<tr style="border-bottom:1px solid var(--border2)">
          <td style="padding:8px;white-space:nowrap">${new Date(x.checked_at).toLocaleString('es')}</td>
          <td style="text-align:center"><span style="font-weight:700;color:${color}">${etiqueta}</span>${x.notified ? ' 🔔' : ''}</td>
          <td style="text-align:center;color:#888">${x.status != null ? x.status : '—'}</td>
          <td style="text-align:center;color:#888">${x.response_ms != null ? x.response_ms + 'ms' : '—'}</td>
          <td style="text-align:center;color:${x.attempts > 1 ? '#FF9800' : '#888'}">${x.attempts || 1}</td>
          <td style="color:#F44336;font-size:12px">${escHtml(x.error) || ''}</td>
        </tr>`;
      }).join('')}
    </table>
    <p style="color:#aaa;font-size:11px;margin-top:12px">🔔 = se envio la alarma. "Pasajero" = fallo un intento pero el sitio respondio al reintentar, asi que no se notifico.</p>`;
  }
  return `<div class="modal-overlay" onmousedown="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-header"><h2>📈 Historial — ${escHtml(u?.name || u?.url || '')}</h2><button class="modal-close" onclick="closeModal()">Cerrar</button></div>
    <div style="display:flex;gap:8px;margin-bottom:14px">${tab('Todos', false)}${tab('Solo fallos', true)}</div>
    ${cuerpo}
  </div></div>`;
}
