<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServerEyes - Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #eee; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }

/* Login */
.login-wrap { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.login-box { background: #16213e; border-radius: 16px; padding: 40px; width: 380px; max-width: 90vw; }
.login-box h1 { color: #00d4ff; text-align: center; margin-bottom: 8px; font-size: 28px; }
.login-box .sub { color: #888; text-align: center; margin-bottom: 24px; font-size: 14px; }
.login-box input { width: 100%; background: #1a1a2e; border: 2px solid #2a2a4a; border-radius: 10px; padding: 12px 14px; color: #eee; font-size: 15px; margin-bottom: 12px; outline: none; }
.login-box input:focus { border-color: #00d4ff; }
.login-box .btn { width: 100%; background: #00d4ff; color: #1a1a2e; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
.login-box .btn:hover { background: #00b8d9; }
.login-box .err { color: #ff5252; text-align: center; font-size: 13px; margin-top: 8px; }

/* Header */
.header { background: #16213e; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
.header h1 { color: #00d4ff; font-size: 22px; }
.header .info { color: #888; font-size: 13px; }
.header .actions { display: flex; gap: 10px; align-items: center; }
.header .btn-sm { background: #2a2a4a; color: #888; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-weight: 600; }
.header .btn-sm:hover { background: #3a3a5a; color: #eee; }
.header .btn-logout { color: #ff5252; }

/* Stats bar */
.stats { display: flex; gap: 16px; padding: 16px 24px; flex-wrap: wrap; }
.stat-card { background: #16213e; border-radius: 12px; padding: 16px 20px; flex: 1; min-width: 140px; }
.stat-card .num { font-size: 32px; font-weight: 800; }
.stat-card .label { color: #888; font-size: 13px; margin-top: 2px; }
.stat-online .num { color: #00e676; }
.stat-offline .num { color: #ff5252; }
.stat-total .num { color: #00d4ff; }

/* Filter */
.filter-bar { padding: 0 24px 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filter-bar input { background: #16213e; border: 2px solid #2a2a4a; border-radius: 8px; padding: 8px 14px; color: #eee; font-size: 14px; outline: none; width: 260px; }
.filter-bar input:focus { border-color: #00d4ff; }
.filter-btn { background: #2a2a4a; color: #888; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-weight: 600; }
.filter-btn.active { background: #00d4ff; color: #1a1a2e; }
.filter-btn:hover { background: #3a3a5a; color: #eee; }
.filter-btn.active:hover { background: #00b8d9; }

/* Grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; padding: 0 24px 24px; }
.card { border-radius: 14px; padding: 18px; border: 1px solid; transition: transform 0.1s; }
.card:hover { transform: translateY(-2px); }
.card.online { background: #0d2818; border-color: #1a5c2e; }
.card.offline { background: #2d1117; border-color: #5c1a1a; }

.card-header { display: flex; align-items: center; margin-bottom: 10px; }
.card-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; }
.card-dot.on { background: #00e676; }
.card-dot.off { background: #ff5252; }
.card-name { flex: 1; font-size: 17px; font-weight: 700; }
.card-status { font-size: 12px; font-weight: 700; }
.card-status.on { color: #00e676; }
.card-status.off { color: #ff5252; }

.card-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; }
.tag-group { background: #0a3d62; color: #00d4ff; }
.tag-dns { background: #3d2e00; color: #ff9800; }
.tag-notes { background: #2a2a4a; color: #aaa; }
.tag-noip { background: #2a2a4a; color: #666; }

.card-row { display: flex; justify-content: space-between; margin-bottom: 3px; font-size: 13px; }
.card-row .lbl { color: #888; }
.card-row .val { font-weight: 600; }

.card-ips { margin-bottom: 4px; font-size: 13px; }
.card-ips .lbl { color: #888; margin-bottom: 2px; }
.card-ips .ip { color: #ddd; font-weight: 600; padding-left: 8px; }

/* Progress bars */
.bar-wrap { margin-top: 6px; }
.bar-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
.bar-header .lbl { color: #888; }
.bar-header .val { font-weight: 600; }
.bar { height: 6px; background: #2a2a4a; border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.bar-green { background: #00e676; }
.bar-orange { background: #ff9800; }
.bar-red { background: #ff5252; }

.card-os { color: #555; font-size: 11px; margin-top: 8px; }

/* Group headers */
.group-header { padding: 12px 24px; display: flex; align-items: center; cursor: pointer; }
.group-header:hover { background: #16213e33; }
.group-header .icon { font-size: 18px; margin-right: 10px; }
.group-header .name { font-size: 17px; font-weight: 700; color: #00d4ff; flex: 1; }
.group-header .count { color: #888; font-size: 13px; margin-right: 10px; }
.group-header .arrow { color: #555; font-size: 14px; }

.no-group-label { color: #555; font-size: 13px; padding: 12px 24px 4px; }

/* Update modal */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 200; }
.modal { background: #16213e; border-radius: 16px; padding: 30px; width: 460px; max-width: 90vw; }
.modal h2 { color: #00d4ff; margin-bottom: 16px; font-size: 20px; }
.modal label { color: #888; font-size: 12px; display: block; margin-bottom: 4px; }
.modal input { width: 100%; background: #1a1a2e; border: 2px solid #2a2a4a; border-radius: 10px; padding: 10px 14px; color: #eee; font-size: 14px; margin-bottom: 12px; outline: none; }
.modal input:focus { border-color: #00d4ff; }
.modal .btn { width: 100%; background: #00d4ff; color: #1a1a2e; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; }
.modal .btn:hover { background: #00b8d9; }
.modal .btn-cancel { background: #2a2a4a; color: #888; margin-top: 8px; }
.modal .btn-cancel:hover { background: #3a3a5a; color: #eee; }
.modal .current { color: #888; font-size: 13px; margin-bottom: 16px; }
.modal .current span { color: #00e676; font-weight: 600; }
.modal .hint { color: #555; font-size: 11px; margin-bottom: 8px; }

/* Agent version badge on cards */
.card-version { color: #555; font-size: 11px; margin-top: 4px; }
.card-version .outdated { color: #ff9800; }

/* Responsive */
@media (max-width: 500px) {
  .grid { grid-template-columns: 1fr; padding: 0 12px 12px; }
  .header { padding: 12px 16px; }
  .stats { padding: 12px 16px; }
  .filter-bar { padding: 0 16px 12px; }
  .filter-bar input { width: 100%; }
}

/* Card action buttons */
.card-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.card-btn { background: #2a2a4a; color: #888; border: none; border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer; font-weight: 600; }
.card-btn:hover { background: #3a3a5a; color: #eee; }
.card-btn.btn-edit { color: #00d4ff; }

/* Detail modal */
.detail-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: flex-start; padding-top: 60px; z-index: 200; overflow-y: auto; }
.detail-panel { background: #16213e; border-radius: 16px; padding: 24px; width: 560px; max-width: 92vw; margin-bottom: 40px; }
.detail-panel h2 { color: #00d4ff; font-size: 18px; margin-bottom: 16px; }
.detail-panel .close-btn { float: right; background: #2a2a4a; border: none; color: #888; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
.detail-panel .close-btn:hover { color: #eee; }
.detail-panel label { color: #888; font-size: 12px; display: block; margin-bottom: 4px; margin-top: 10px; }
.detail-panel input, .detail-panel textarea { width: 100%; background: #1a1a2e; border: 2px solid #2a2a4a; border-radius: 8px; padding: 10px; color: #eee; font-size: 14px; outline: none; }
.detail-panel input:focus, .detail-panel textarea:focus { border-color: #00d4ff; }
.detail-panel textarea { resize: vertical; min-height: 60px; }
.detail-panel .save-btn { background: #00d4ff; color: #1a1a2e; border: none; border-radius: 10px; padding: 12px 24px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 16px; }
.detail-panel .save-btn:hover { background: #00b8d9; }
.detail-panel .del-btn { background: none; border: none; color: #ff5252; cursor: pointer; font-size: 13px; margin-top: 12px; }

/* Uptime bars */
.uptime-bar-row { display: flex; align-items: center; margin-bottom: 6px; }
.uptime-bar-row .day { color: #888; font-size: 11px; width: 80px; }
.uptime-bar-row .bar-bg { flex: 1; height: 18px; background: #2a2a4a; border-radius: 4px; overflow: hidden; }
.uptime-bar-row .bar-fg { height: 100%; border-radius: 4px; }
.uptime-bar-row .pct { color: #ddd; font-size: 12px; font-weight: 600; width: 40px; text-align: right; }

/* IP history */
.ip-entry { background: #1a1a2e; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; display: flex; align-items: center; }
.ip-entry .date { color: #888; font-size: 12px; width: 130px; }
.ip-entry .old-ip { color: #ff9800; font-size: 13px; font-weight: 600; }
.ip-entry .arrow { color: #555; margin: 0 10px; }
.ip-entry .new-ip { color: #00e676; font-size: 13px; font-weight: 600; }

/* Day selector */
.day-selector { display: flex; gap: 8px; margin-bottom: 16px; }
.day-btn { background: #2a2a4a; color: #888; border: none; border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-weight: 600; }
.day-btn.active { background: #00d4ff; color: #1a1a2e; }

/* Update alert banner */
.update-banner { background: linear-gradient(135deg, #3d2e00, #4a3500); margin: 0 24px 12px; padding: 16px 20px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; border: 1px solid #ff9800; }
.update-banner .msg { color: #ff9800; font-weight: 600; font-size: 14px; }
.update-banner .msg small { color: #888; font-weight: 400; display: block; font-size: 12px; margin-top: 2px; }
.update-banner .btn-update { background: #ff9800; color: #1a1a2e; border: none; border-radius: 8px; padding: 10px 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
.update-banner .btn-update:hover { background: #e68900; }
.update-banner .btn-dismiss { background: none; border: none; color: #888; cursor: pointer; font-size: 18px; padding: 4px 8px; }

/* Auto-refresh indicator */
.refresh-dot { width: 8px; height: 8px; border-radius: 50%; background: #00e676; display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* Light theme */
body.light { background: #f0f2f5; color: #222; }
body.light .header { background: #fff; border-bottom: 1px solid #ddd; }
body.light .header h1 { color: #0088cc; }
body.light .stat-card { background: #fff; }
body.light .card.online { background: #e8f5e9; border-color: #a5d6a7; }
body.light .card.offline { background: #ffebee; border-color: #ef9a9a; }
body.light .card-name { color: #222; }
body.light .card-os { color: #999; }
body.light .card-row .val { color: #333; }
body.light .card-ips .ip { color: #333; }
body.light .tag-group { background: #e3f2fd; color: #0088cc; }
body.light .tag-dns { background: #fff3e0; color: #e65100; }
body.light .tag-notes { background: #f5f5f5; color: #666; }
body.light .filter-bar input { background: #fff; border-color: #ddd; color: #222; }
body.light .filter-btn { background: #e0e0e0; color: #555; }
body.light .filter-btn.active { background: #0088cc; color: #fff; }
body.light .btn-sm { background: #e0e0e0; color: #555; }
body.light .btn-sm:hover { background: #ccc; color: #222; }
body.light .bar { background: #e0e0e0; }
body.light .login-box { background: #fff; }
body.light .login-box input { background: #f5f5f5; border-color: #ddd; color: #222; }
body.light .detail-panel { background: #fff; }
body.light .detail-panel input, body.light .detail-panel textarea { background: #f5f5f5; border-color: #ddd; color: #222; }
body.light .card-btn { background: #e0e0e0; color: #555; }
body.light .card-btn:hover { background: #ccc; color: #222; }
body.light .update-banner { background: #fff3e0; border-color: #ff9800; }
body.light .modal { background: #fff; }
body.light .modal input { background: #f5f5f5; border-color: #ddd; color: #222; }
</style>
</head>
<body>

<div id="app"></div>

<script>
const API = window.location.origin;
let token = localStorage.getItem('se_token');
let machines = [];
let filter = '';
let agentInfo = { version: null, url: null };
let showUpdateModal = false;
let dismissedUpdate = false;
let activeModal = null; // {type: 'uptime'|'ips'|'edit', machineId, data}
let uptimeDays = 7;
let statusFilter = 'all';
let viewMode = 'list'; // list | groups
let expandedGroups = new Set();
let refreshInterval = null;

// API helper
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...opts.headers };
  if (token) headers.Authorization = 'Bearer ' + token;
  try {
    const res = await fetch(API + path, { ...opts, headers });
    const data = await res.json();
    return { ok: res.ok, status: res.status, data };
  } catch (e) {
    return { ok: false, status: 0, data: { error: e.message } };
  }
}

// Time since
function timeSince(ts) {
  if (!ts) return 'Nunca';
  const d = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (d < 60) return d + 's';
  if (d < 3600) return Math.floor(d / 60) + 'min';
  if (d < 86400) return Math.floor(d / 3600) + 'h';
  return Math.floor(d / 86400) + 'd';
}

// Bar color
function barColor(pct, thresholds) {
  const [warn, crit] = thresholds || [70, 90];
  if (pct >= crit) return 'bar-red';
  if (pct >= warn) return 'bar-orange';
  return 'bar-green';
}

function textColor(pct, thresholds) {
  const [warn, crit] = thresholds || [70, 90];
  if (pct >= crit) return '#ff5252';
  if (pct >= warn) return '#ff9800';
  return '#00e676';
}

// Render login
function renderLogin(err) {
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <h1>ServerEyes</h1>
        <p class="sub">Dashboard de monitoreo</p>
        <input type="email" id="login-email" placeholder="Email" />
        <input type="password" id="login-pass" placeholder="Contrasena" />
        ${err ? '<p class="err">' + err + '</p>' : ''}
        <button class="btn" onclick="doLogin()">Iniciar sesion</button>
      </div>
    </div>`;
  document.getElementById('login-email').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!email || !pass) { renderLogin('Completa todos los campos'); return; }
  const res = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password: pass }) });
  if (res.ok && res.data.token) {
    token = res.data.token;
    localStorage.setItem('se_token', token);
    startDashboard();
  } else {
    renderLogin(res.data?.error || 'Error de conexion');
  }
}

function logout() {
  token = null;
  localStorage.removeItem('se_token');
  if (refreshInterval) clearInterval(refreshInterval);
  renderLogin();
}

// Filtered machines
function getFiltered() {
  let list = machines;
  if (statusFilter === 'online') list = list.filter(m => m.is_online);
  if (statusFilter === 'offline') list = list.filter(m => !m.is_online);
  if (filter) {
    const f = filter.toLowerCase();
    list = list.filter(m =>
      (m.machine_name || '').toLowerCase().includes(f) ||
      (m.public_ip || '').includes(f) ||
      (m.local_ip || '').toLowerCase().includes(f) ||
      (m.grupo || '').toLowerCase().includes(f) ||
      (m.notes || '').toLowerCase().includes(f)
    );
  }
  return list;
}

// Render card
function renderCard(m) {
  const isOn = m.is_online;
  let tags = '';
  if (m.grupo) tags += `<span class="tag tag-group">&#128193; ${m.grupo}</span>`;
  if (m.dns_host) tags += `<span class="tag tag-dns">&#127760; ${m.dns_host}</span>`;
  if (m.notes) tags += `<span class="tag tag-notes">&#128221; ${m.notes.substring(0, 40)}${m.notes.length > 40 ? '...' : ''}</span>`;
  if (m.check_ip_change === false) tags += `<span class="tag tag-noip">&#128277; IP no monitoreada</span>`;

  const localIps = (m.local_ip || '---').split(' | ').map(ip => `<div class="ip">${ip.trim()}</div>`).join('');

  let bars = '';
  if (m.cpu_usage !== null && m.cpu_usage !== undefined) {
    const pct = m.cpu_usage;
    bars += `<div class="bar-wrap"><div class="bar-header"><span class="lbl">CPU</span><span class="val" style="color:${textColor(pct)}">${pct}%</span></div><div class="bar"><div class="bar-fill ${barColor(pct)}" style="width:${Math.min(pct, 100)}%"></div></div></div>`;
  }
  if (m.ram_usage !== null && m.ram_usage !== undefined && m.ram_total) {
    const pct = Math.round((m.ram_usage / m.ram_total) * 100);
    bars += `<div class="bar-wrap"><div class="bar-header"><span class="lbl">RAM</span><span class="val" style="color:${textColor(pct)}">${m.ram_usage}/${m.ram_total} GB</span></div><div class="bar"><div class="bar-fill ${barColor(pct)}" style="width:${Math.min(pct, 100)}%"></div></div></div>`;
  }
  if (m.disks && Array.isArray(m.disks) && m.disks.length > 0) {
    const monitored = m.monitored_disks && m.monitored_disks.length > 0 ? m.monitored_disks : null;
    for (const disk of m.disks.filter(d => !monitored || monitored.includes(d.drive))) {
      const pct = disk.total > 0 ? Math.round((disk.used / disk.total) * 100) : 0;
      bars += `<div class="bar-wrap"><div class="bar-header"><span class="lbl">Disco ${disk.drive}</span><span class="val" style="color:${textColor(pct, [85, 95])}">${disk.used}/${disk.total} GB (${disk.free} GB libre)</span></div><div class="bar"><div class="bar-fill ${barColor(pct, [85, 95])}" style="width:${Math.min(pct, 100)}%"></div></div></div>`;
    }
  } else if (m.disk_usage !== null && m.disk_usage !== undefined && m.disk_total) {
    const pct = Math.round((m.disk_usage / m.disk_total) * 100);
    bars += `<div class="bar-wrap"><div class="bar-header"><span class="lbl">Disco C:</span><span class="val" style="color:${textColor(pct, [85, 95])}">${m.disk_usage}/${m.disk_total} GB</span></div><div class="bar"><div class="bar-fill ${barColor(pct, [85, 95])}" style="width:${Math.min(pct, 100)}%"></div></div></div>`;
  }

  const pingColor = m.ping_ms ? (m.ping_ms < 50 ? '#00e676' : m.ping_ms < 150 ? '#ff9800' : '#ff5252') : '#555';

  return `
    <div class="card ${isOn ? 'online' : 'offline'}">
      <div class="card-header">
        <div class="card-dot ${isOn ? 'on' : 'off'}"></div>
        <span class="card-name">${m.machine_name}</span>
        <span class="card-status ${isOn ? 'on' : 'off'}">${isOn ? 'ONLINE' : 'OFFLINE'}</span>
      </div>
      ${tags ? '<div class="card-tags">' + tags + '</div>' : ''}
      <div class="card-row"><span class="lbl">IP Publica:</span><span class="val">${m.public_ip || '---'}</span></div>
      <div class="card-ips"><div class="lbl">IP Local:</div>${localIps}</div>
      <div class="card-row"><span class="lbl">Heartbeat:</span><span class="val">${timeSince(m.last_heartbeat)}</span></div>
      <div class="card-row"><span class="lbl">Ping:</span><span class="val" style="color:${pingColor}">${m.ping_ms ? m.ping_ms + 'ms' : '---'}</span></div>
      ${m.download_mbps ? '<div class="card-row"><span class="lbl">Velocidad:</span><span class="val" style="color:#00d4ff">' + m.download_mbps + ' Mbps</span></div>' : ''}
      ${bars}
      ${m.os_info ? '<div class="card-os">' + m.os_info + '</div>' : ''}
      ${m.geo_city ? '<div class="card-row"><span class="lbl">Ubicacion:</span><span class="val" style="color:#00d4ff">&#128205; ' + m.geo_city + ', ' + m.geo_region + ', ' + m.geo_country + '</span></div>' : ''}
      ${m.agent_version ? '<div class="card-version">v' + m.agent_version + (agentInfo.version && m.agent_version !== agentInfo.version ? ' <span class="outdated">(update disponible: v' + agentInfo.version + ')</span>' : '') + '</div>' : ''}
      <div class="card-actions">
        <button class="card-btn" onclick="event.stopPropagation();openUptime(${m.id})">&#128202; Uptime</button>
        <button class="card-btn" onclick="event.stopPropagation();openIpHistory(${m.id})">&#127760; IPs</button>

// Render group view
function renderGroupView(list) {
  const groups = {};
  const noGroup = [];
  list.forEach(m => {
    if (m.grupo) { if (!groups[m.grupo]) groups[m.grupo] = []; groups[m.grupo].push(m); }
    else noGroup.push(m);
  });
  const groupNames = Object.keys(groups).sort();

  let html = '';
  for (const g of groupNames) {
    const expanded = expandedGroups.has(g);
    html += `<div class="group-header" onclick="toggleGroup('${g.replace(/'/g, "\\'")}')">
      <span class="icon">${expanded ? '&#128194;' : '&#128193;'}</span>
      <span class="name">${g}</span>
      <span class="count">${groups[g].length} maq.</span>
      <span class="arrow">${expanded ? '&#9660;' : '&#9654;'}</span>
    </div>`;
    if (expanded) {
      html += '<div class="grid">' + groups[g].map(renderCard).join('') + '</div>';
    }
  }
  if (noGroup.length > 0) {
    if (groupNames.length > 0) html += '<div class="no-group-label">Sin grupo</div>';
    html += '<div class="grid">' + noGroup.map(renderCard).join('') + '</div>';
  }
  return html;
}

function toggleGroup(g) {
  if (expandedGroups.has(g)) expandedGroups.delete(g);
  else expandedGroups.add(g);
  renderDashboard();
}

async function openMap() {

  const locations = {};
  machines.filter(m => m.geo_lat && m.geo_lon).forEach(m => {
    locations[m.public_ip || m.id] = { lat: m.geo_lat, lon: m.geo_lon, city: m.geo_city, regionName: m.geo_region, country: m.geo_country };
  });

function renderMapModal() {
  const locs = activeModal.data;
  if (!locs) return `<div class="detail-overlay" onclick="if(event.target===this)closeModal()"><div class="detail-panel"><p style="color:#888;text-align:center;padding:40px">Geolocalizando IPs...</p></div></div>`;

  const points = [];
  machines.filter(m => m.geo_lat && m.geo_lon).forEach(m => {
    points.push({ name: m.machine_name, ip: m.public_ip, lat: m.geo_lat, lon: m.geo_lon, city: m.geo_city, region: m.geo_region, country: m.geo_country, online: m.is_online });
  });

  if (points.length === 0) return `<div class="detail-overlay" onclick="if(event.target===this)closeModal()"><div class="detail-panel"><button class="close-btn" onclick="closeModal()">Cerrar</button><h2>&#127758; Mapa</h2><p style="color:#888;text-align:center;padding:40px">No se pudieron geolocalizar las IPs</p></div></div>`;

  const centerLat = points.reduce((a, p) => a + p.lat, 0) / points.length;
  const centerLon = points.reduce((a, p) => a + p.lon, 0) / points.length;

  return `<div class="detail-overlay" onclick="if(event.target===this)closeModal()"><div class="detail-panel" style="max-width:800px">
    <button class="close-btn" onclick="closeModal()">Cerrar</button>
    <h2>&#127758; Mapa de Maquinas</h2>
    <div id="mapContainer" style="height:400px;border-radius:8px;overflow:hidden;margin-bottom:12px"></div>
    ${points.map(p => `<div style="display:flex;align-items:center;padding:4px 0;font-size:13px">
      <span style="width:10px;height:10px;border-radius:50%;background:${p.online ? '#00e676' : '#ff5252'};margin-right:8px;display:inline-block"></span>
      <strong style="margin-right:8px">${p.name}</strong>
      <span style="color:#888">${p.city}, ${p.region}, ${p.country}</span>
      <span style="color:#555;margin-left:auto;font-size:11px">${p.ip}</span>
    </div>`).join('')}
  </div></div>`;
}

function initMap() {
  if (!activeModal || activeModal.type !== 'map' || !activeModal.data) return;
  const container = document.getElementById('mapContainer');
  if (!container || container.dataset.loaded) return;
  container.dataset.loaded = '1';

  const locs = activeModal.data;
  const points = [];
  machines.filter(m => m.public_ip && locs[m.public_ip]).forEach(m => {
    const loc = locs[m.public_ip];
    points.push({ name: m.machine_name, lat: loc.lat, lon: loc.lon, online: m.is_online });
  });
  if (points.length === 0) return;

  // Load Leaflet CSS+JS dynamically
  if (!document.getElementById('leaflet-css')) {
    const css = document.createElement('link'); css.id = 'leaflet-css'; css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
    const js = document.createElement('script'); js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.onload = () => createMap(container, points);
    document.head.appendChild(js);
  } else if (window.L) { createMap(container, points); }
}

function createMap(container, points) {
  const centerLat = points.reduce((a, p) => a + p.lat, 0) / points.length;
  const centerLon = points.reduce((a, p) => a + p.lon, 0) / points.length;
  const map = L.map(container).setView([centerLat, centerLon], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
  points.forEach(p => {
    const color = p.online ? '#00e676' : '#ff5252';
    L.circleMarker([p.lat, p.lon], { radius: 10, color, fillColor: color, fillOpacity: 0.8 })
      .bindPopup('<strong>' + p.name + '</strong><br>' + (p.online ? 'ONLINE' : 'OFFLINE'))
      .addTo(map);
  });
  if (points.length > 1) map.fitBounds(points.map(p => [p.lat, p.lon]));
}

  return `<div class="detail-overlay" onclick="if(event.target===this)closeModal()"><div class="detail-panel">

        const dateStr = new Date(day.date + 'T12:00:00').toLocaleDateString('es', {weekday:'short',day:'numeric',month:'short'});

function renderMetricsModal() {
  const m = machines.find(x => x.id === activeModal.machineId);
  const data = activeModal.data || [];

  function miniChart(values, color, maxVal) {
    if (values.length === 0) return '<span style="color:#555">Sin datos</span>';
    const max = maxVal || Math.max(...values, 1);
    const w = Math.max(2, Math.floor(400 / values.length));
    return `<div style="display:flex;align-items:flex-end;height:60px;gap:1px;background:#0f0f23;border-radius:6px;padding:4px;overflow:hidden">${
      values.map(v => {
        const h = Math.max(1, (v / max) * 52);
        const c = v/max > 0.9 ? '#ff5252' : v/max > 0.7 ? '#ff9800' : color;
        return `<div style="width:${w}px;height:${h}px;background:${c};border-radius:1px" title="${v}"></div>`;
      }).join('')
    }</div>`;
  }

  const cpuVals = data.filter(d => d.cpu != null).map(d => parseFloat(d.cpu));
  const ramVals = data.filter(d => d.ram != null).map(d => parseFloat(d.ram));
  const ramTotal = data.find(d => d.ram_total)?.ram_total || 1;
  const pingVals = data.filter(d => d.ping != null).map(d => parseInt(d.ping));

  // Discos: tomar el ultimo registro que tenga disks
  let diskCharts = '';
  const diskData = {};
  data.forEach(d => {
    if (d.disks && Array.isArray(d.disks)) {
      d.disks.forEach(disk => {
        if (!diskData[disk.drive]) diskData[disk.drive] = [];
        diskData[disk.drive].push(disk.used);
      });
    }
  });
  for (const [drive, vals] of Object.entries(diskData)) {
    const lastDisk = data.filter(d => d.disks).pop()?.disks?.find(dk => dk.drive === drive);
    const total = lastDisk?.total || 1;
    diskCharts += `<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="color:#888;font-size:13px">Disco ${drive}</span><span style="color:#aaa;font-size:12px">${vals[vals.length-1]?.toFixed?.(1) || '?'}/${total} GB</span></div>
      ${miniChart(vals, '#ff9800', total)}
    </div>`;
  }

  const timeRange = data.length > 0 ? new Date(data[0].time).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}) + ' - ' + new Date(data[data.length-1].time).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}) : '';

  return `<div class="detail-overlay" onclick="if(event.target===this)closeModal()"><div class="detail-panel" style="max-width:600px">
    <button class="close-btn" onclick="closeModal()">Cerrar</button>
    <h2>&#128200; Metricas — ${m?.machine_name || ''}</h2>
    <div class="day-selector" style="margin-bottom:16px">
      ${[6,24,48,72,168].map(h => `<button class="day-btn ${metricsHours===h?'active':''}" onclick="metricsHours=${h};loadMetricsData(${activeModal.machineId},${h})">${h < 24 ? h + 'h' : (h/24) + 'd'}</button>`).join('')}
    </div>
    <p style="color:#555;font-size:11px;margin-bottom:16px">${data.length} puntos | ${timeRange}</p>
    ${!activeModal.data ? '<p style="color:#888">Cargando...</p>' : `
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="color:#888;font-size:13px">CPU</span><span style="color:#aaa;font-size:12px">${cpuVals.length > 0 ? 'Avg: ' + Math.round(cpuVals.reduce((a,b)=>a+b,0)/cpuVals.length) + '% | Max: ' + Math.round(Math.max(...cpuVals)) + '%' : '---'}</span></div>
        ${miniChart(cpuVals, '#00e676', 100)}
      </div>
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="color:#888;font-size:13px">RAM</span><span style="color:#aaa;font-size:12px">${ramVals.length > 0 ? 'Avg: ' + (ramVals.reduce((a,b)=>a+b,0)/ramVals.length).toFixed(1) + '/' + ramTotal + ' GB' : '---'}</span></div>
        ${miniChart(ramVals, '#00d4ff', ramTotal)}
      </div>
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="color:#888;font-size:13px">Ping</span><span style="color:#aaa;font-size:12px">${pingVals.length > 0 ? 'Avg: ' + Math.round(pingVals.reduce((a,b)=>a+b,0)/pingVals.length) + 'ms | Max: ' + Math.max(...pingVals) + 'ms' : '---'}</span></div>
        ${miniChart(pingVals, '#ff9800', Math.max(...pingVals, 200))}
      </div>
      ${diskCharts}
    `}
  </div></div>`;
}

function toggleDiskMonitor(drive) {
  if (!activeModal || activeModal.type !== 'disks') return;
  const idx = activeModal.data.indexOf(drive);
  if (idx >= 0) activeModal.data.splice(idx, 1);
  else activeModal.data.push(drive);
  renderDashboard();
}

async function saveDiskSelection() {
  const cleanAlerts = {};
  for (const [k, v] of Object.entries(activeModal.alertDisks || {})) { if (v && v > 0) cleanAlerts[k] = v; }
  const res = await api('/api/machines/' + activeModal.machineId, {
    method: 'PUT', body: JSON.stringify({ monitored_disks: activeModal.data, alert_disks: cleanAlerts })
  });
  if (res.ok) { closeModal(); loadMachines(); }
  else alert(res.data?.error || 'Error');
}

    smtp_from: document.getElementById('cs-from')?.value||null, email_notifications: document.getElementById('cs-enabled')?.checked
  })});
  if(st) st.innerHTML = res.ok ? '<span style="color:#00e676">Guardado</span>' : '<span style="color:#ff5252">'+(res.data?.error||'Error')+'</span>';
}
async function testClassicSmtp() {
  const st = document.getElementById('cs-status');
  if(st) st.innerHTML='<span style="color:#888">Enviando...</span>';
  const res = await api('/api/auth/smtp/test',{method:'POST'});
  if(st) st.innerHTML = res.ok ? '<span style="color:#00e676">'+res.data.message+'</span>' : '<span style="color:#ff5252">'+(res.data?.error||'Error')+'</span>';
}

// Init
if (token) {
  startDashboard();
} else {
  renderLogin();
}
