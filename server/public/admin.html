<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServerEyes - Admin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f0f23; color: #eee; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }

.login-wrap { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.login-box { background: #16213e; border-radius: 16px; padding: 40px; width: 380px; max-width: 90vw; }
.login-box h1 { color: #ff9800; text-align: center; margin-bottom: 8px; font-size: 28px; }
.login-box .sub { color: #888; text-align: center; margin-bottom: 24px; font-size: 14px; }
.login-box input { width: 100%; background: #0f0f23; border: 2px solid #2a2a4a; border-radius: 10px; padding: 12px 14px; color: #eee; font-size: 15px; margin-bottom: 12px; outline: none; }
.login-box input:focus { border-color: #ff9800; }
.login-box .btn { width: 100%; background: #ff9800; color: #1a1a2e; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
.login-box .btn:hover { background: #e68900; }
.login-box .err { color: #ff5252; text-align: center; font-size: 13px; margin-top: 8px; }

.header { background: #16213e; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid #ff9800; }
.header h1 { color: #ff9800; font-size: 22px; }
.header .actions { display: flex; gap: 10px; }
.header .btn-sm { background: #2a2a4a; color: #888; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-weight: 600; }
.header .btn-sm:hover { background: #3a3a5a; color: #eee; }
.header .btn-sm.active { background: #ff9800; color: #1a1a2e; }

.content { padding: 24px; max-width: 1400px; margin: 0 auto; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat { background: #16213e; border-radius: 12px; padding: 20px; text-align: center; }
.stat .num { font-size: 36px; font-weight: 800; }
.stat .label { color: #888; font-size: 13px; margin-top: 4px; }
.stat-users .num { color: #00d4ff; }
.stat-machines .num { color: #ff9800; }
.stat-online .num { color: #00e676; }
.stat-offline .num { color: #ff5252; }

/* Tables */
.section { background: #16213e; border-radius: 14px; padding: 20px; margin-bottom: 24px; }
.section h2 { color: #00d4ff; font-size: 18px; margin-bottom: 16px; }
.section h2.orange { color: #ff9800; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: #888; padding: 8px 10px; border-bottom: 1px solid #2a2a4a; font-weight: 600; }
td { padding: 8px 10px; border-bottom: 1px solid #1a1a2e; }
tr:hover { background: #1a1a3e; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.badge-on { background: #0d2818; color: #00e676; }
.badge-off { background: #2d1117; color: #ff5252; }
.badge-admin { background: #3d2e00; color: #ff9800; }
.badge-version { background: #0a3d62; color: #00d4ff; }
.badge-outdated { background: #3d2e00; color: #ff9800; }

/* Upload section */
.upload-area { border: 2px dashed #2a2a4a; border-radius: 12px; padding: 30px; text-align: center; margin-bottom: 16px; cursor: pointer; transition: border-color 0.2s; }
.upload-area:hover { border-color: #ff9800; }
.upload-area.active { border-color: #00e676; background: #0d281822; }
.upload-area input[type=file] { display: none; }
.upload-area .icon { font-size: 40px; margin-bottom: 8px; }
.upload-area .text { color: #888; font-size: 14px; }
.upload-area .filename { color: #00e676; font-size: 14px; font-weight: 600; margin-top: 8px; }

.form-row { display: flex; gap: 12px; margin-bottom: 12px; }
.form-row .field { flex: 1; }
.form-row label { color: #888; font-size: 12px; display: block; margin-bottom: 4px; }
.form-row input, .form-row textarea { width: 100%; background: #0f0f23; border: 2px solid #2a2a4a; border-radius: 8px; padding: 10px; color: #eee; font-size: 14px; outline: none; }
.form-row input:focus, .form-row textarea:focus { border-color: #ff9800; }
.form-row textarea { resize: vertical; min-height: 60px; }

.btn-upload { background: #ff9800; color: #1a1a2e; border: none; border-radius: 10px; padding: 14px 28px; font-size: 15px; font-weight: 700; cursor: pointer; }
.btn-upload:hover { background: #e68900; }
.btn-upload:disabled { background: #555; cursor: not-allowed; }

.progress { height: 6px; background: #2a2a4a; border-radius: 3px; margin-top: 12px; overflow: hidden; display: none; }
.progress.show { display: block; }
.progress-bar { height: 100%; background: #ff9800; border-radius: 3px; transition: width 0.3s; }

/* Current agent info */
.agent-info { background: #0f0f23; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.agent-info .row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; }
.agent-info .row .lbl { color: #888; }
.agent-info .row .val { font-weight: 600; }

/* History */
.history-item { background: #0f0f23; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.history-item .ver { color: #00d4ff; font-weight: 700; }
.history-item .date { color: #888; font-size: 12px; }
.history-item .size { color: #555; font-size: 12px; }
.history-item .log { color: #aaa; font-size: 12px; flex: 1; margin: 0 16px; }

@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

/* Dialogos del panel: reemplazan alert/confirm/prompt del navegador */
.dlg-box { background: #16213e; border-radius: 20px; padding: 28px; max-width: 440px; width: 100%; box-shadow: 0 12px 48px rgba(0,0,0,.5); animation: scaleIn .25s ease-out; }
.dlg-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.dlg-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.dlg-head h3 { color: #eee; margin: 0 0 4px; font-size: 17px; font-weight: 700; }
.dlg-head p { color: #8ba0b3; font-size: 13px; margin: 0; line-height: 1.5; overflow-wrap: anywhere; }
.dlg-detalle { background: #0d1b2a; border-radius: 12px; padding: 14px; margin-bottom: 18px; color: #aaa; font-size: 13px; line-height: 1.6; }
.dlg-opciones { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.dlg-opcion { text-align: left; background: #0f0f23; color: #eee; border: 1px solid #2a2a4a; border-radius: 10px; padding: 12px 14px; font-size: 14px; font-family: inherit; cursor: pointer; transition: border-color .15s, background .15s; }
.dlg-opcion:hover { border-color: #ff9800; background: #1a1a3e; }
.dlg-input { width: 100%; background: #0f0f23; border: 2px solid #2a2a4a; border-radius: 10px; padding: 12px 14px; color: #eee; font-size: 15px; font-family: inherit; outline: none; margin-bottom: 18px; }
.dlg-input:focus { border-color: #ff9800; }
.dlg-btns { display: flex; gap: 10px; }
.dlg-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; }
.dlg-ok { color: #0f0f23; }
.dlg-ok:hover { filter: brightness(1.1); }
.dlg-cancel { background: #1a2a3a; color: #888; border: 1px solid #2a2a4a; font-weight: 600; }
.dlg-cancel:hover { background: #2a3a4a; color: #eee; }
@media (max-width: 480px) { .dlg-box { padding: 22px; } }

/* Responsive */
@media (max-width: 768px) {
  .content { padding: 12px; }
  .form-row { flex-direction: column; }
  table { font-size: 11px; }
  th, td { padding: 6px 4px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = window.location.origin;
let token = localStorage.getItem('se_admin_token');
let data = null;
let tab = 'overview';
let selectedFile = null;
let uploading = false;
let uploadTarget = 'agent'; // 'agent' | 'client'
let smtpGlobal = null;
let agentHistory = [];
let serverStatus = null;
let adminNotifs = [];

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...opts.headers };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(API + path, { ...opts, headers });
  const d = await res.json();
  return { ok: res.ok, status: res.status, data: d };
}

function renderLogin(err) {
  document.getElementById('app').innerHTML = `
    <div class="login-wrap"><div class="login-box">
      <h1>&#9881; Admin Panel</h1>
      <p class="sub">ServerEyes - Administracion</p>
      <input type="email" id="l-email" placeholder="Email" />
      <input type="password" id="l-pass" placeholder="Contrasena" />
      ${err ? '<p class="err">' + err + '</p>' : ''}
      <button class="btn" onclick="doLogin()">Entrar</button>
    </div></div>`;
  document.getElementById('l-pass')?.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pass = document.getElementById('l-pass').value;
  if (!email || !pass) { renderLogin('Completa los campos'); return; }
  const res = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password: pass }) });
  if (res.ok && res.data.token) {
    token = res.data.token;
    localStorage.setItem('se_admin_token', token);
    await loadData();
  } else renderLogin(res.data?.error || 'Error');
}

function logout() { token = null; localStorage.removeItem('se_admin_token'); renderLogin(); }

async function loadData() {
  await loadServerStatus();
  const res = await api('/api/admin/overview');
  if (res.ok) { data = res.data; render(); }
  else if (res.status === 403) { renderLogin('No tienes permisos de admin'); token = null; localStorage.removeItem('se_admin_token'); }
  else if (res.status === 401) { logout(); }
}

function fmtDate(ts) { return ts ? new Date(ts).toLocaleString('es') : '---'; }
function fmtSize(bytes) { return bytes ? (bytes / 1024 / 1024).toFixed(1) + ' MB' : '---'; }
function timeSince(ts) {
  if (!ts) return 'Nunca';
  const d = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (d < 60) return d + 's'; if (d < 3600) return Math.floor(d / 60) + 'min';
  if (d < 86400) return Math.floor(d / 3600) + 'h'; return Math.floor(d / 86400) + 'd';
}

function renderOverview() {
  const s = data.stats;
  return `
    <div class="stats">
      <div class="stat stat-users"><div class="num">${s.totalUsers}</div><div class="label">Usuarios</div></div>
      <div class="stat stat-machines"><div class="num">${s.totalMachines}</div><div class="label">Maquinas</div></div>
      <div class="stat stat-online"><div class="num">${s.onlineMachines}</div><div class="label">Online</div></div>
      <div class="stat stat-offline"><div class="num">${s.offlineMachines}</div><div class="label">Offline</div></div>
    </div>
    <div class="section"><h2>&#128100; Usuarios (${data.users.length})</h2>
      <table><tr><th>ID</th><th>Email</th><th>Nombre</th><th>Plan</th><th>Estado</th><th>Dias</th><th>Push</th><th>Registrado</th><th>Acciones</th></tr>
      ${data.users.map(u => {
        const planColor = u.plan === 'pro' ? '#00e676' : u.plan === 'enterprise' ? '#00d4ff' : '#888';
        const planLabel = u.plan === 'pro' ? 'PRO' : u.plan === 'enterprise' ? 'ENTERPRISE' : 'FREE';
        const daysSince = Math.floor((Date.now() - new Date(u.created_at).getTime()) / 86400000);
        const daysLabel = daysSince === 0 ? 'Hoy' : daysSince === 1 ? '1 dia' : daysSince + ' dias';
        return `<tr style="${u.is_blocked ? 'opacity:0.5;background:#1a0a0a' : ''}">
        <td>${u.id}</td>
        <td>${u.email}</td>
        <td>${u.nombre || '---'}</td>
        <td><span class="badge" style="background:${planColor}22;color:${planColor}">${planLabel}</span> <span style="color:#555;font-size:11px">${u.max_machines || 3} maq</span></td>
        <td>${u.is_blocked ? '<span class="badge badge-off" title="' + (u.block_reason || '') + '">&#128683; BLOQUEADO</span>' : u.is_admin ? '<span class="badge badge-admin">ADMIN</span>' : '<span class="badge badge-on">ACTIVO</span>'}</td>
        <td><span style="color:${daysSince > 30 ? '#00e676' : daysSince > 7 ? '#ff9800' : '#00d4ff'};font-weight:600;font-size:12px">${daysLabel}</span></td>
        <td>${u.has_push ? '&#9989;' : '&#10060;'}</td>
        <td style="font-size:11px">${fmtDate(u.created_at)}</td>
        <td>
          <div style="display:flex;flex-wrap:wrap;gap:3px">
            <select style="background:#0f0f23;color:#eee;border:1px solid #2a2a4a;border-radius:4px;padding:2px 4px;font-size:11px;cursor:pointer" onchange="setPlan(${u.id}, this.value)">
              <option value="free" ${u.plan !== 'pro' && u.plan !== 'enterprise' ? 'selected' : ''}>Free</option>
              <option value="pro" ${u.plan === 'pro' ? 'selected' : ''}>Pro</option>
              <option value="enterprise" ${u.plan === 'enterprise' ? 'selected' : ''}>Enterprise</option>
            </select>
            <button class="badge ${u.is_admin ? 'badge-admin' : 'badge-version'}" style="cursor:pointer;border:none" onclick="toggleAdmin(${u.id}, ${!u.is_admin})">${u.is_admin ? 'Quitar admin' : 'Hacer admin'}</button>
            <button class="badge badge-off" style="cursor:pointer;border:none" onclick="resetPassword(${u.id}, '${u.email}')">Reset pass</button>
            ${u.is_blocked
              ? '<button class="badge badge-on" style="cursor:pointer;border:none" onclick="unblockUser(' + u.id + ')">Desbloquear</button>'
              : '<button class="badge" style="cursor:pointer;border:none;background:#3d1a1a;color:#ff5252" onclick="blockUser(' + u.id + ', \'' + u.email.replace(/'/g, "\\'") + '\')">&#128683; Bloquear</button>'}
          </div>
          ${u.is_blocked ? '<div style="font-size:10px;color:#ff5252;margin-top:3px">Razon: ' + (u.block_reason || '---') + '</div>' : ''}
        </td>
      </tr>`;
      }).join('')}</table>
    </div>`;
}

function renderMachines() {
  const cv = data.configuredVersion;
  return `<div class="section"><h2>&#128421; Todas las Maquinas (${data.machines.length})</h2>
    <table><tr><th>Nombre</th><th>Owner</th><th>Estado</th><th>IP Publica</th><th>Ping</th><th>CPU</th><th>RAM</th><th>Disco</th><th>Version</th><th>Heartbeat</th></tr>
    ${data.machines.map(m => {
      const ramPct = m.ram_usage && m.ram_total ? Math.round(m.ram_usage / m.ram_total * 100) : null;
      const diskPct = m.disk_usage && m.disk_total ? Math.round(m.disk_usage / m.disk_total * 100) : null;
      const vBadge = m.agent_version ? (cv && m.agent_version !== cv ? 'badge-outdated' : 'badge-version') : '';
      return `<tr>
        <td><strong>${m.machine_name}</strong>${m.grupo ? '<br><span style="color:#00d4ff;font-size:11px">' + m.grupo + '</span>' : ''}</td>
        <td style="color:#888;font-size:12px">${m.owner_email || '---'}</td>
        <td>${m.is_online ? '<span class="badge badge-on">ONLINE</span>' : '<span class="badge badge-off">OFFLINE</span>'}</td>
        <td>${m.public_ip || '---'}</td>
        <td style="color:${m.ping_ms ? (m.ping_ms < 50 ? '#00e676' : m.ping_ms < 150 ? '#ff9800' : '#ff5252') : '#555'}">${m.ping_ms ? m.ping_ms + 'ms' : '---'}</td>
        <td style="color:${m.cpu_usage > 90 ? '#ff5252' : m.cpu_usage > 70 ? '#ff9800' : '#00e676'}">${m.cpu_usage != null ? m.cpu_usage + '%' : '---'}</td>
        <td>${ramPct != null ? ramPct + '%' : '---'}</td>
        <td>${diskPct != null ? diskPct + '%' : '---'}</td>
        <td>${m.agent_version ? '<span class="badge ' + vBadge + '">v' + m.agent_version + '</span>' : '<span style="color:#555">---</span>'}</td>
        <td>${timeSince(m.last_heartbeat)}</td>
      </tr>`;
    }).join('')}</table>
  </div>`;
}

function renderAgent() {
  const a = data.latestAgent;
  const cv = data.configuredVersion;
  const outdated = data.machines.filter(m => m.agent_version && cv && m.agent_version !== cv);

  return `
    <div class="section"><h2 class="orange">&#128228; Agente Actual</h2>
      ${a ? `<div class="agent-info">
        <div class="row"><span class="lbl">Version configurada:</span><span class="val" style="color:#00e676">${cv || '---'}</span></div>
        <div class="row"><span class="lbl">Archivo:</span><span class="val">${a.filename}</span></div>
        <div class="row"><span class="lbl">Tamano:</span><span class="val">${fmtSize(a.file_size)}</span></div>
        <div class="row"><span class="lbl">Subido:</span><span class="val">${fmtDate(a.uploaded_at)}</span></div>
        ${a.changelog ? '<div class="row"><span class="lbl">Cambios:</span><span class="val">' + a.changelog + '</span></div>' : ''}
        <div class="row"><span class="lbl">URL descarga:</span><span class="val" style="font-size:11px;color:#00d4ff">${API}/api/agent/download</span></div>
        ${data.agentSha256 ? `<div class="row"><span class="lbl">sha256:</span><span class="val" style="font-size:10px;color:#888;word-break:break-all">${data.agentSha256}</span></div>` : ''}
      </div>` : '<p style="color:#888;margin-bottom:16px">No hay agente subido todavia</p>'}
      <h2 class="orange" style="margin-top:24px">&#128187; Client de Escritorio</h2>
      ${data.latestClient ? `<div class="agent-info">
        <div class="row"><span class="lbl">Version configurada:</span><span class="val" style="color:#00e676">${data.configuredClientVersion || '---'}</span></div>
        <div class="row"><span class="lbl">Archivo:</span><span class="val">${data.latestClient.filename}</span></div>
        <div class="row"><span class="lbl">Tamano:</span><span class="val">${fmtSize(data.latestClient.file_size)}</span></div>
        <div class="row"><span class="lbl">Subido:</span><span class="val">${fmtDate(data.latestClient.uploaded_at)}</span></div>
        ${data.latestClient.changelog ? '<div class="row"><span class="lbl">Cambios:</span><span class="val">' + data.latestClient.changelog + '</span></div>' : ''}
        <div class="row"><span class="lbl">URL descarga:</span><span class="val" style="font-size:11px;color:#00d4ff">${API}/api/client/download</span></div>
        ${data.clientSha256 ? `<div class="row"><span class="lbl">sha256:</span><span class="val" style="font-size:10px;color:#888;word-break:break-all">${data.clientSha256}</span></div>` : ''}
      </div>` : '<p style="color:#888;margin-bottom:16px">No hay client subido todavia</p>'}

      ${outdated.length > 0 ? `<div style="background:#3d2e00;border-radius:10px;padding:14px;margin-bottom:16px">
        <strong style="color:#ff9800">&#9888; ${outdated.length} maquina(s) con version desactualizada:</strong>
        <div style="margin-top:8px">${outdated.map(m => '<span style="color:#ddd;font-size:13px;margin-right:16px">' + m.machine_name + ' <span style="color:#888">v' + m.agent_version + '</span></span>').join('')}</div>
        <div style="color:#888;font-size:12px;margin-top:8px">Se actualizaran automaticamente en el proximo heartbeat.</div>
      </div>` : (cv ? '<div style="background:#0d2818;border-radius:10px;padding:14px;margin-bottom:16px;color:#00e676">&#9989; Todas las maquinas estan actualizadas</div>' : '')}
    </div>

    <div class="section"><h2 class="orange">&#128194; Subir Nueva Version</h2>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        ${[['agent', '&#128421; Agente'], ['client', '&#128187; Client de escritorio']].map(([v, t]) => `
          <button onclick="setUploadTarget('${v}')" ${uploading ? 'disabled' : ''}
            style="flex:1;padding:10px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:13px;background:${uploadTarget === v ? '#ff9800' : '#222'};color:${uploadTarget === v ? '#111' : '#888'}">${t}</button>`).join('')}
      </div>
      <div class="upload-area ${selectedFile ? 'active' : ''}" onclick="document.getElementById('file-input').click()">
        <input type="file" id="file-input" accept=".exe" onchange="onFileSelect(this)" />
        <div class="icon">${selectedFile ? '&#9989;' : '&#128193;'}</div>
        <div class="text">${selectedFile ? '' : (uploadTarget === 'client' ? 'Click para seleccionar el exe del client' : 'Click para seleccionar el exe del agente')}</div>
        ${selectedFile ? '<div class="filename">' + selectedFile.name + ' (' + fmtSize(selectedFile.size) + ')</div>' : ''}
      </div>
      <div class="form-row">
        <div class="field"><label>Version:</label><input type="text" id="up-version" placeholder="ej: 1.1.0" /></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Changelog (opcional):</label><textarea id="up-changelog" placeholder="Que cambio en esta version..."></textarea></div>
      </div>
      <button class="btn-upload" id="btn-up" onclick="doUpload()" ${!selectedFile || uploading ? 'disabled' : ''}>
        ${uploading ? 'Subiendo...' : '&#128640; Subir y Distribuir'}
      </button>
      <div class="progress ${uploading ? 'show' : ''}" id="up-progress"><div class="progress-bar" id="up-bar" style="width:0%"></div></div>
      <div id="upload-status"></div>
    </div>

    <div class="section"><h2>&#128218; Historial de Versiones</h2>
      <div style="color:#888;font-size:12px;margin-bottom:6px">&#128241; Agente</div>
      <div id="history-list"><p style="color:#888">Cargando...</p></div>
      <div style="color:#888;font-size:12px;margin:16px 0 6px">&#128187; Client de escritorio</div>

function onFileSelect(input) {
  selectedFile = input.files[0] || null;
  render();
  if (selectedFile) {
    const suggestedVer = data.configuredVersion ? bumpVersion(data.configuredVersion) : '1.0.0';
    document.getElementById('up-version').value = suggestedVer;
  }
}

function bumpVersion(v) {
  const parts = v.split('.').map(Number);
  parts[2] = (parts[2] || 0) + 1;
  return parts.join('.');
}

function setUploadTarget(t) {
  if (uploading) return;
  uploadTarget = t;
  selectedFile = null;
  render();
}

// El client pesa ~90 MB y en base64 se iria a ~120, por encima del limite del
// servidor. Va como multipart, que ademas no infla el cuerpo un 33%.
async function subirClient(version, changelog) {
  const fd = new FormData();
  fd.append('version', version);
  fd.append('changelog', changelog || '');
  fd.append('file', selectedFile, selectedFile.name);
  // api() fuerza Content-Type application/json, que rompe el multipart.
  const r = await fetch(API + '/api/admin/client/upload', {
    method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: fd
  });
  let d = {};
  try { d = await r.json(); } catch (e) {}
  return { ok: r.ok, status: r.status, data: d };
}

async function doUpload() {
  if (!selectedFile) return;
  const version = document.getElementById('up-version').value.trim();
  const changelog = document.getElementById('up-changelog').value.trim();
  if (!version) { avisar('Falta la version', 'Escribi el numero de version que vas a publicar, por ejemplo 1.4.2. Es lo que compara cada agente para saber si tiene que actualizarse.', '&#9888;&#65039;'); return; }

  const target = uploadTarget;
  uploading = true;
  render();

  const bar = document.getElementById('up-bar');
  if (bar) bar.style.width = '30%';

  const terminar = async (res) => {
    if (bar) bar.style.width = '100%';

    if (res.ok) {
      selectedFile = null;
      uploading = false;
      await loadData();
      const st = document.getElementById('upload-status');
      if (st) {
        st.innerHTML = `<div style="background:#0d2818;border-left:3px solid #4CAF50;border-radius:0 10px 10px 0;padding:14px 18px;margin-top:12px;display:flex;align-items:center;gap:12px">
          <span style="font-size:28px">✅</span>
          <div>
            <div style="color:#00e676;font-weight:700;font-size:14px">${target === 'client' ? 'Client' : 'Agente'} v${version} subido exitosamente</div>
            <div style="color:#888;font-size:12px;margin-top:2px">${res.data?.sha256 ? 'sha256: ' + res.data.sha256 + '<br>' : ''}Se actualizaran en el proximo heartbeat (~30 segundos)</div>
          </div>
        </div>`;
        setTimeout(() => { if (st) st.innerHTML = ''; }, 10000);
      }
    } else {
      uploading = false;
      render();
      const st = document.getElementById('upload-status');
      if (st) {
        st.innerHTML = `<div style="background:#2d1117;border-left:3px solid #ff5252;border-radius:0 10px 10px 0;padding:14px 18px;margin-top:12px;display:flex;align-items:center;gap:12px">
          <span style="font-size:28px">❌</span>
          <div style="color:#ff5252;font-weight:700;font-size:14px">${res.data?.error || 'Error al subir'}</div>
        </div>`;
      }
    }
  };

  if (target === 'client') {
    if (bar) bar.style.width = '60%';
    await terminar(await subirClient(version, changelog));
    return;
  }

  const reader = new FileReader();
  reader.onload = async () => {
    if (bar) bar.style.width = '60%';
    const base64 = reader.result.split(',')[1];
    await terminar(await api('/api/admin/agent/upload', {
      method: 'POST',
      body: JSON.stringify({ version, filename: selectedFile.name, file_base64: base64, changelog })
    }));
  };
  reader.readAsDataURL(selectedFile);
}

  if (st) st.innerHTML = r.ok ? '<span style="color:#00e676">&#9989; Guardado</span>' : '<span style="color:#ff5252">Error</span>';
  setTimeout(() => { if (st) st.innerHTML = ''; }, 3000);
}

async function loadAdminSupport() {
  const r = await api('/api/admin/support/tickets');
  if (!r.ok) return;
  const newTotal = r.data.reduce((a, t) => a + (t.msg_count || 0), 0);
  const openCount = r.data.filter(t => t.status === 'open').length;
  // Detectar mensajes nuevos (skip primera carga y mensajes propios del admin)
  if (lastSupportMsgCount >= 0 && newTotal > lastSupportMsgCount) {
    const diff = newTotal - lastSupportMsgCount;
    if (diff <= 5) showSupportAlert(diff, r.data);
  }
  lastSupportMsgCount = newTotal;
  adminSupportTickets = r.data;
  updateSupportBadge(openCount);
  const ticketsArea = document.getElementById('support-tickets-area');
  if (ticketsArea && tab === 'support' && !adminSupportActive) {
    ticketsArea.innerHTML = buildTicketsListHtml();
  }
}

function groupByClient(tickets) {
  const groups = {};
  tickets.forEach(t => {
    const key = t.email || 'unknown';
    if (!groups[key]) groups[key] = { email: t.email, nombre: t.nombre, tickets: [] };
    groups[key].tickets.push(t);
  });
  return Object.values(groups).sort((a, b) => {
    const aLast = Math.max(...a.tickets.map(t => new Date(t.updated_at).getTime()));
    const bLast = Math.max(...b.tickets.map(t => new Date(t.updated_at).getTime()));
    return bLast - aLast;
  });
}

function renderTicketCard(t, borderColor) {
  return `<div style="background:#0f0f23;border-radius:10px;padding:12px 14px;margin-bottom:6px;border-left:3px solid ${borderColor};cursor:pointer;display:flex;align-items:center;gap:10px" onclick="openAdminTicket(${t.id})">
    <div style="flex:1;min-width:0">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="color:#eee;font-size:13px;font-weight:600">${t.subject}</span>
        <span style="color:#555;font-size:10px">${timeSince(t.updated_at)}</span>
      </div>
      <div style="color:#666;font-size:11px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.last_message || 'Sin mensajes'}</div>
    </div>
    <span style="font-size:10px;color:#888">${t.msg_count || 0} msgs</span>
    ${t.hidden_by_user ? '<span style="font-size:9px;color:#ff9800;background:#3d2e00;padding:1px 6px;border-radius:4px">Eliminado por usuario</span>' : ''}
    ${t.status === 'open' ? '<button class="badge badge-off" style="cursor:pointer;border:none;font-size:9px" onclick="event.stopPropagation();closeAdminTicket(' + t.id + ')">Cerrar</button>' : ''}
  </div>`;
}

function buildTicketsListHtml() {
  const open = adminSupportTickets.filter(t => t.status === 'open');
  const closed = adminSupportTickets.filter(t => t.status === 'closed');
  const openGroups = groupByClient(open);
  const closedGroups = groupByClient(closed);
  const colors = ['#ff9800','#2196F3','#4CAF50','#9C27B0','#00BCD4','#FF5722','#607D8B','#E91E63'];

  let html = `<div class="stats" style="margin-bottom:20px">
    <div class="stat"><div class="num" style="color:#ff9800">${adminSupportTickets.length}</div><div class="label">Total</div></div>
    <div class="stat"><div class="num" style="color:#00e676">${open.length}</div><div class="label">Abiertos</div></div>
    <div class="stat"><div class="num" style="color:#888">${closed.length}</div><div class="label">Cerrados</div></div>
  </div>`;

  if (openGroups.length > 0) {
    html += '<div class="section"><h2 style="color:#ff9800">&#128308; Abiertos</h2>';
    openGroups.forEach((g, gi) => {
      const c = colors[gi % colors.length];
      html += `<div style="margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #1a2a3a">
          <div style="width:32px;height:32px;border-radius:50%;background:${c}22;display:flex;align-items:center;justify-content:center;font-size:14px;color:${c};font-weight:800">${(g.email||'?')[0].toUpperCase()}</div>
          <div>
            <strong style="color:${c};font-size:13px">${g.email}</strong>
            ${g.nombre ? '<span style="color:#555;font-size:11px;margin-left:6px">' + g.nombre + '</span>' : ''}
          </div>
          <span style="color:#555;font-size:11px;margin-left:auto">${g.tickets.length} ticket(s)</span>
        </div>
        ${g.tickets.map(t => renderTicketCard(t, c)).join('')}
      </div>`;
    });
    html += '</div>';
  }

  if (closedGroups.length > 0) {
    html += '<div class="section"><h2 style="color:#888">&#9989; Cerrados</h2>';
    closedGroups.forEach((g, gi) => {
      const c = '#555';
      html += `<div style="margin-bottom:10px;opacity:.7">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <div style="width:24px;height:24px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:11px;color:#888;font-weight:700">${(g.email||'?')[0].toUpperCase()}</div>
          <span style="color:#888;font-size:12px">${g.email}</span>
        </div>
        ${g.tickets.slice(0, 5).map(t => renderTicketCard(t, c)).join('')}
        ${g.tickets.length > 5 ? '<div style="color:#555;font-size:11px;text-align:center;padding:4px">+' + (g.tickets.length - 5) + ' mas</div>' : ''}
      </div>`;
    });
    html += '</div>';
  }

  if (adminSupportTickets.length === 0) {
    html += '<div class="section"><p style="color:#888;text-align:center;padding:30px">&#128172; Sin tickets de soporte</p></div>';
  }
  return html;
}

function updateSupportBadge(count) {
  const btn = document.getElementById('btn-support');
  if (!btn) return;
  let badge = document.getElementById('support-badge-fixed');
  if (count > 0) {
    if (!badge) {
      badge = document.createElement('span');
      badge.id = 'support-badge-fixed';
      badge.style.cssText = 'position:fixed;z-index:9999;background:#ff5252;color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;pointer-events:none';
      document.body.appendChild(badge);
    }
    const rect = btn.getBoundingClientRect();
    badge.style.top = (rect.top - 4) + 'px';
    badge.style.left = (rect.right - 10) + 'px';
    badge.textContent = count;
    badge.style.display = 'flex';
  } else if (badge) {
    badge.style.display = 'none';
  }
}

function showSupportAlert(count, tickets) {
  const latest = tickets.find(t => t.status === 'open');
  // Sonido
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 800; gain.gain.value = 0.15;
    osc.start(); osc.stop(ctx.currentTime + 0.15);
    setTimeout(() => { const o2 = ctx.createOscillator(); o2.connect(gain); o2.frequency.value = 1000; o2.start(); o2.stop(ctx.currentTime + 0.15); }, 200);
  } catch {}
  // Toast
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:20px;right:20px;background:#9C27B0;color:#fff;border-radius:14px;padding:14px 20px;box-shadow:0 6px 24px rgba(156,39,176,.4);z-index:9999;max-width:360px;cursor:pointer;animation:toastIn .4s ease-out;display:flex;align-items:center;gap:12px';
  toast.innerHTML = `<span style="font-size:24px">🎧</span><div><div style="font-weight:700;font-size:14px">${count} mensaje(s) nuevo(s) en soporte</div><div style="font-size:12px;opacity:.9;margin-top:2px">${latest ? latest.email + ': ' + (latest.last_message || latest.subject).substring(0, 60) : ''}</div></div>`;
  toast.onclick = () => { toast.remove(); setTab('support'); if (latest) openAdminTicket(latest.id); };
  document.body.appendChild(toast);
  setTimeout(() => { if (toast.parentElement) toast.remove(); }, 8000);
  // Title flash
  const origTitle = document.title;
  let flash = true;
  const titleInterval = setInterval(() => {
    document.title = flash ? `(${count}) Nuevo mensaje - Soporte` : origTitle;
    flash = !flash;
  }, 1000);
  setTimeout(() => { clearInterval(titleInterval); document.title = origTitle; }, 10000);
}

async function openAdminTicket(id) {
  adminSupportActive = id;
  const r = await api('/api/admin/support/tickets/' + id + '/messages');
  if (r.ok) { adminSupportMessages = r.data; }
  const el = document.getElementById('admin-chat-msgs');
  if (el) {
    el.innerHTML = buildAdminChatMsgs();
    el.scrollTop = el.scrollHeight;
  } else {
    render();
    setTimeout(() => {
      const el2 = document.getElementById('admin-chat-msgs');
      if (el2) el2.scrollTop = el2.scrollHeight;
    }, 100);
  }
}

function buildAdminChatMsgs() {
  if (adminSupportMessages.length === 0) return '<p style="color:#888;text-align:center;padding:20px">Sin mensajes</p>';
  return adminSupportMessages.map(m => {
    const isUser = m.sender_type === 'user';
    const attachs = m.attachments || [];
    return `<div style="align-self:${isUser?'flex-start':'flex-end'};max-width:75%;padding:10px 14px;border-radius:14px;${isUser?'border-bottom-left-radius:4px;background:#1a2a3a':'border-bottom-right-radius:4px;background:#7B1FA2;color:#fff'}">
      <div style="font-size:10px;font-weight:600;margin-bottom:2px;${isUser?'color:#888':'color:#e1bee7'}">${isUser ? (m.sender_email || 'Usuario') : 'Tu (Admin)'}</div>
      <div style="font-size:13px;line-height:1.5">${m.message || ''}</div>
      ${attachs.length > 0 ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">${attachs.map(a => `<a href="data:${a.type};base64,${a.data}" download="${a.name}" style="font-size:11px;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:4px;color:inherit;text-decoration:none">&#128206; ${a.name}</a>`).join('')}</div>` : ''}
      <div style="font-size:10px;opacity:.6;margin-top:4px">${fmtDate(m.created_at)}</div>
    </div>`;
  }).join('');
}

async function sendAndClose() {
  const msg = document.getElementById('admin-reply-msg')?.value?.trim();
  if (msg) {
    const formData = new FormData();
    formData.append('message', msg);
    await fetch('/api/admin/support/tickets/' + adminSupportActive + '/reply', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: formData
    });
  }
  await api('/api/admin/support/tickets/' + adminSupportActive + '/close', { method: 'POST' });
  adminSupportActive = null;
  loadAdminSupport();
  render();
}

async function sendAdminReply() {
  const msg = document.getElementById('admin-reply-msg')?.value?.trim();
  if (!msg) return;
  const formData = new FormData();
  formData.append('message', msg);
  await fetch('/api/admin/support/tickets/' + adminSupportActive + '/reply', {
    method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: formData
  });
  document.getElementById('admin-reply-msg').value = '';
  openAdminTicket(adminSupportActive);
}

async function closeAdminTicket(id) {
  const t = adminSupportTickets.find(x => x.id === id);
  const ok = await confirmar({
    icono: '&#9989;', color: '#4CAF50', titulo: 'Cerrar ticket #' + id,
    subtitulo: (t?.email || 'Usuario') + (t?.subject ? ' \u2014 ' + t.subject : ''),
    detalle: 'Al cerrar este ticket:<br>' +
      '<span style="color:#607d8b">&bull;</span> El usuario no podra enviar mas mensajes<br>' +
      '<span style="color:#607d8b">&bull;</span> Podra reabrir el ticket si lo necesita<br>' +
      '<span style="color:#607d8b">&bull;</span> O crear uno nuevo por otro tema',
    ok: 'Cerrar ticket'
  });
  if (ok) doCloseTicket(id);
}

async function doCloseTicket(id) {
  await api('/api/admin/support/tickets/' + id + '/close', { method: 'POST' });
  adminSupportActive = null;
  loadAdminSupport();
}

function render() {
  if (!data) return;
  let content = '';
  if (tab === 'overview') content = renderOverview() + renderMachines();
  else if (tab === 'agent') content = renderAgent();
  else if (tab === 'notifs') content = renderNotifs();
  else if (tab === 'support') content = renderSupportAdmin();
  else if (tab === 'system') content = renderSmtpGlobal() + renderSystem();

  document.getElementById('app').innerHTML = `
    <div class="header">
      <h1>&#9881; ServerEyes Admin</h1>
      <div class="actions">
        <button class="btn-sm ${tab === 'overview' ? 'active' : ''}" onclick="setTab('overview')">&#128202; Overview</button>
        <button class="btn-sm ${tab === 'agent' ? 'active' : ''}" onclick="setTab('agent')">&#128228; Agente</button>
        <button class="btn-sm ${tab === 'notifs' ? 'active' : ''}" onclick="setTab('notifs')">&#128276; Notificaciones</button>
        <button class="btn-sm ${tab === 'support' ? 'active' : ''}" onclick="setTab('support')" id="btn-support">&#128172; Soporte</button>
        <button class="btn-sm ${tab === 'system' ? 'active' : ''}" onclick="setTab('system')">&#9881; Sistema</button>
        <a href="/" class="btn-sm" style="text-decoration:none">&#128065; Dashboard</a>
        <button class="btn-sm" style="color:#ff5252" onclick="logout()">Salir</button>
      </div>
    </div>
    <div class="content">${content}</div>`;

  if (tab === 'agent') loadHistory();
  if (tab === 'system' && !smtpGlobal) cargarSmtpGlobal();
  if (tab === 'notifs') setTimeout(loadNotifs, 50);
  if (tab === 'support') { setTimeout(loadAdminSupport, 50); }
}

function setTab(t) {
  tab = t;
  render();
  if (t === 'support') { setTimeout(loadSupportMetrics, 100); setTimeout(loadSupportEmail, 150); }
}

async function toggleAdmin(userId, makeAdmin) {
  const ok = await confirmar(makeAdmin ? {
    icono: '&#128081;', color: '#ff9800', titulo: 'Dar permisos de administrador',
    detalle: 'Va a poder ver todas las cuentas, bloquear usuarios, resetear contrase&ntilde;as y publicar versiones del agente y del cliente.',
    ok: 'Hacerlo admin'
  } : {
    icono: '&#128100;', titulo: 'Quitar permisos de administrador',
    subtitulo: 'Queda como usuario comun, con sus propias maquinas y monitores.',
    ok: 'Quitar permisos'
  });
  if (!ok) return;
  const res = await api('/api/admin/toggle-admin', { method: 'POST', body: JSON.stringify({ user_id: userId, is_admin: makeAdmin }) });
  if (res.ok) loadData();
  else errorAdmin(res);
}

async function blockUser(userId, email) {
  const reasons = [
    'Mal uso de la aplicacion',
    'Spam o abuso',
    'Cuenta sospechosa',
    'Falta de pago',
    'Violacion de terminos',
    'Otro'
  ];
  let reason = await elegir({
    icono: '&#128683;', peligro: true, titulo: 'Bloquear la cuenta', subtitulo: email,
    detalle: 'No va a poder entrar al panel ni a la app, y sus agentes dejan de reportar. El motivo le aparece al intentar entrar.',
    opciones: [...reasons.slice(0, -1), 'Otro motivo...']
  });
  if (reason === null) return;
  if (reason === 'Otro motivo...') {
    reason = await pedirTexto({
      icono: '&#9999;&#65039;', peligro: true, titulo: 'Motivo del bloqueo', subtitulo: email,
      marcador: 'Se lo mostramos al usuario', ok: 'Bloquear'
    });
    if (!reason || !reason.trim()) return;
    reason = reason.trim();
  }
  const res = await api('/api/admin/block-user', { method: 'POST', body: JSON.stringify({ user_id: userId, is_blocked: true, block_reason: reason }) });
  if (res.ok) { await avisar('Cuenta bloqueada', email + ' \u2014 ' + reason, '&#128683;'); loadData(); }
  else errorAdmin(res);
}

async function unblockUser(userId) {
  const ok = await confirmar({
    icono: '&#128275;', color: '#00e676', titulo: 'Desbloquear la cuenta',
    subtitulo: 'Vuelve a entrar al panel y a la app, y sus agentes reportan de nuevo.',
    ok: 'Desbloquear'
  });
  if (!ok) return;
  const res = await api('/api/admin/block-user', { method: 'POST', body: JSON.stringify({ user_id: userId, is_blocked: false }) });
  if (res.ok) loadData();
  else errorAdmin(res);
}

async function setPlan(userId, plan) {
  const res = await api('/api/admin/set-plan', { method: 'POST', body: JSON.stringify({ user_id: userId, plan }) });
  if (res.ok) loadData();
  else errorAdmin(res);
}

async function resetPassword(userId, email) {
  const newPass = await pedirTexto({
    icono: '&#128273;', color: '#ff9800', titulo: 'Resetear la contraseña', subtitulo: email,
    detalle: 'Se guarda tal cual la escribas, asi que despues se la tenes que pasar vos. La anterior deja de servir al instante.',
    marcador: 'Minimo 6 caracteres', ok: 'Resetear'
  });
  if (newPass === null) return;
  if (newPass.length < 6) {
    await avisar('Muy corta', 'La contraseña necesita al menos 6 caracteres.', '&#9888;&#65039;');
    return resetPassword(userId, email);
  }
  const res = await api('/api/admin/reset-password', { method: 'POST', body: JSON.stringify({ user_id: userId, new_password: newPass }) });
  if (res.ok) avisar('Contraseña cambiada', 'Pasale la nueva a ' + email + ' por un canal seguro.', '&#9989;');
  else errorAdmin(res);
}

// ── DIALOGOS ──
//
// alert(), confirm() y prompt() salen con el cartel gris del navegador, con el
// "servereyes.app dice" arriba y la pagina congelada atras. Ademas prompt() no
// deja explicar nada: entra todo en una linea de texto. Estos usan la misma
// caja que el resto del panel y dejan poner icono, explicacion y opciones.
let _resolverDlg = null;

function escApp(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function _teclaDlg(e) { if (e.key === 'Escape') cerrarDlg(null); }

function cerrarDlg(valor) {
  const r = _resolverDlg;
  _resolverDlg = null;
  const ov = document.getElementById('dlg-overlay');
  if (ov) ov.remove();
  document.removeEventListener('keydown', _teclaDlg);
  if (r) r(valor);
}

function aceptarDlg() {
  const c = document.getElementById('dlg-campo');
  cerrarDlg(c ? (c.value || '') : true);
}

function dialogo(op) {
  cerrarDlg(null); // si habia uno abierto, no dejarlo colgado
  return new Promise(resolve => {
    _resolverDlg = resolve;
    const color = op.peligro ? '#ff5252' : (op.color || '#00d4ff');
    const fondo = op.peligro ? '#2d1117' : '#0a3d62';
    const ov = document.createElement('div');
    ov.id = 'dlg-overlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;animation:fadeIn .2s';
    ov.onclick = e => { if (e.target === ov) cerrarDlg(null); };
    ov.innerHTML = `<div class="dlg-box">
      <div class="dlg-head">
        <div class="dlg-icon" style="background:${fondo}">${op.icono || '&#8505;&#65039;'}</div>
        <div style="min-width:0">
          <h3>${escApp(op.titulo || '')}</h3>
          ${op.subtitulo ? `<p>${escApp(op.subtitulo)}</p>` : ''}
        </div>
      </div>
      ${op.detalle ? `<div class="dlg-detalle">${op.detalle}</div>` : ''}
      ${op.opciones ? `<div class="dlg-opciones">${op.opciones.map(o =>
        `<button type="button" class="dlg-opcion" data-v="${escApp(o)}" onclick="cerrarDlg(this.dataset.v)">${escApp(o)}</button>`).join('')}</div>` : ''}
      ${op.campo ? `<input class="dlg-input" id="dlg-campo" placeholder="${escApp(op.marcador || '')}" value="${escApp(op.valor || '')}">` : ''}
      <div class="dlg-btns">
        ${op.sinCancelar ? '' : `<button type="button" class="dlg-btn dlg-cancel" onclick="cerrarDlg(null)">${escApp(op.cancelar || 'Cancelar')}</button>`}
        ${op.opciones ? '' : `<button type="button" class="dlg-btn dlg-ok" style="background:${color}" onclick="aceptarDlg()">${escApp(op.ok || 'Aceptar')}</button>`}
      </div>
    </div>`;
    document.body.appendChild(ov);
    document.addEventListener('keydown', _teclaDlg);
    const c = document.getElementById('dlg-campo');
    if (c) {
      c.focus();
      c.select();
      c.onkeydown = e => { if (e.key === 'Enter') aceptarDlg(); };
    }
  });
}

// Cancelar (Escape, click afuera o el boton) siempre devuelve null, asi que
// tanto "if (!await confirmar(...))" como "if (texto === null)" funcionan.
function avisar(titulo, mensaje, icono, op) {
  return dialogo({ titulo, subtitulo: mensaje, icono: icono || '&#8505;&#65039;', ok: 'Entendido', sinCancelar: true, ...op });
}
function confirmar(op) {
  return dialogo(op).then(v => v === true);
}
function pedirTexto(op) {
  return dialogo({ ...op, campo: true }).then(v => (typeof v === 'string' ? v : null));
}
function elegir(op) {
  return dialogo(op).then(v => (typeof v === 'string' ? v : null));
}

// Todos los endpoints de esta pantalla fallan igual: mostrar el motivo que
// mando el server, y si no mando ninguno al menos decir que no se guardo.
function errorAdmin(res) {
  return avisar('No se pudo completar', res.data?.error || 'El servidor rechazo la operacion y no dio un motivo.', '&#10060;');
}

  }
